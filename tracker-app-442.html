          {wodType === "time" ? (
            <>
              <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">Zeit (mm:ss)</label>
              <input type="text" value={resultTime} onChange={(e) => setResultTime(e.target.value)} placeholder="4:32" className="w-full mt-1 mb-3 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#7A8FC4]" />
            </>
          ) : (
            <>
              <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">Runden/Reps</label>
              <input type="number" value={resultRounds} onChange={(e) => setResultRounds(e.target.value)} placeholder="17" className="w-full mt-1 mb-3 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#7A8FC4]" />
            </>
          )}

          <label className="flex items-center gap-2.5 mb-3 cursor-pointer">
            <input type="checkbox" checked={rx} onChange={(e) => setRx(e.target.checked)} className="w-4 h-4 accent-[#7A8FC4]" />
            <span className="font-body text-sm text-[#E9E4DA]">Rx (ohne Skalierung)</span>
          </label>


          <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">Datum</label>
          <input type="date" value={entryDate} onChange={(e) => setEntryDate(e.target.value)} className="w-full mt-1 mb-3 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#7A8FC4]" />

          <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">Notiz (optional)</label>
          <input type="text" value={notes} onChange={(e) => setNotes(e.target.value)} className="w-full mt-1 mb-4 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#7A8FC4]" />

          {error && <div className="text-[#C46B6B] font-body text-xs mb-3">{error}</div>}
          <button onClick={handleSave} className="w-full bg-[#7A8FC4] text-[#14181A] font-body font-semibold text-sm rounded-lg py-3">Speichern</button>
        </Sheet>
      )}

      {detailWod && (
        <Sheet title={detailWod.name.toUpperCase()} onClose={() => setDetailWod(null)}>
          <div className="space-y-1.5">
            {detailEntries.map((e) => (
              <div key={e.id} className="flex items-center justify-between bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2">
                <div className="min-w-0">
                  <div className="font-body text-xs text-[#E9E4DA]">{detailWod.type === "time" ? formatSeconds(e.value) : e.value} {e.rx ? "(Rx)" : "(scaled)"}</div>
                  {e.movementWeights && Object.keys(e.movementWeights).length > 0 && (
                    <div className="font-mono text-[10px] text-[#7A8FC4] mt-0.5">{Object.entries(e.movementWeights).map(([k, v]) => `${k} ${v}kg`).join(" · ")}</div>
                  )}
                  <div className="font-mono text-[10px] text-[#5F6668] mt-0.5">{new Date(e.date + "T00:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" })}{e.notes ? ` · ${e.notes}` : ""}</div>
                </div>
                <button onClick={() => handleDelete(detailWod.name, e.id)} className="p-1.5 text-[#5F6668] hover:text-[#C46B6B] shrink-0"><Trash2 size={13} /></button>
              </div>
            ))}
          </div>
        </Sheet>
      )}
    </>
  );
}

function FoodRow({ f, isFav, onToggleFav, onEdit }) {
  return (
    <div className="bg-[#1B2022] rounded-xl px-4 py-3 flex items-center justify-between border border-[#262C2E]">
      <button onClick={onEdit} disabled={f.builtin} className="min-w-0 flex-1 text-left disabled:cursor-default">
        <div className="font-body text-sm text-[#E9E4DA] truncate">{f.name} {f.builtin && <span className="font-mono text-[9px] text-[#5F6668]">Standard</span>}</div>
        <div className="font-mono text-[11px] text-[#5F6668] mt-0.5">{f.kcal} kcal / {f.unit === "stk" ? "Stk" : "100g"} · P{f.protein} F{f.fat} KH{f.carbs}</div>
      </button>
      <div className="flex items-center gap-1 shrink-0 ml-2">
        {!f.builtin && (<button onClick={onEdit} className="p-2 text-[#5F6668] hover:text-[#E9E4DA]"><Pencil size={14} /></button>)}
        <button onClick={onToggleFav} className="p-1"><Star size={18} filled={isFav} className={isFav ? "text-[#E0925C]" : "text-[#5F6668]"} /></button>
      </div>
    </div>
  );
}

const FOCUS_CHOICES = ["Ganzkörper", "Oberkörper", "Unterkörper", "Engine/Conditioning", "Oly Technik", "Grip/Core"];

function GeneratorTab() {
  const [focus, setFocus] = useState("Ganzkörper");
  const [desired, setDesired] = useState("");
  const [timeCap, setTimeCap] = useState("45");
  const [genDate, setGenDate] = useState(todayStr());
  const [workout, setWorkout] = useState(null);
  const [oneRMMap, setOneRMMap] = useState({});
  const [history, setHistory] = useState([]);
  const [toast, setToast] = useState("");
  const [loaded, setLoaded] = useState(false);
  const [viewHistoryId, setViewHistoryId] = useState(null);
  const [locations, setLocations] = useState([]);
  const [locationId, setLocationId] = useState("");
  const [buildMode, setBuildMode] = useState("focus"); // "focus" | "list"
  const [muscleGroups, setMuscleGroups] = useState([]);
  const [progressionFactors, setProgressionFactors] = useState({});
  const [showFeedbackSheet, setShowFeedbackSheet] = useState(false);
  const [lastSavedWorkout, setLastSavedWorkout] = useState(null);
  const [timerStart, setTimerStart] = useState(null);
  const [timerElapsedSec, setTimerElapsedSec] = useState(0);
  const [timerRunning, setTimerRunning] = useState(false);
  const [quick1RM, setQuick1RM] = useState(null); // { blockIndex, itemIndex, name }
  const [quick1RMWeight, setQuick1RMWeight] = useState("");
  const [quick1RMReps, setQuick1RMReps] = useState("1");
  const [quick1RMError, setQuick1RMError] = useState("");

  useEffect(() => {
    if (!timerRunning) return;
    const interval = setInterval(() => {
      setTimerElapsedSec(Math.round((Date.now() - timerStart) / 1000));
    }, 1000);
    return () => clearInterval(interval);
  }, [timerRunning, timerStart]);

  const startTimer = () => {
    setTimerStart(Date.now());
    setTimerElapsedSec(0);
    setTimerRunning(true);
  };
  const stopTimer = () => {
    setTimerRunning(false);
    const mins = Math.max(1, Math.round(timerElapsedSec / 60));
    setTimeCap(String(mins));
    showToast(`Timer gestoppt: ${mins} Min übernommen`);
  };
  const fmtTimer = (sec) => {
    const m = Math.floor(sec / 60), s = sec % 60;
    return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  };

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2200); };

  useEffect(() => {
    (async () => {
      const map = {};
      try {
        const list = await window.storage.list("strength:", false);
        for (const key of (list?.keys || [])) {
          try {
            const r = await window.storage.get(key, false);
            const entries = r && r.value ? JSON.parse(r.value) : [];
            if (entries.length > 0) {
              const name = key.slice("strength:".length);
              map[name] = Math.max(...entries.map((e) => e.est1RM));
            }
          } catch (e) {}
        }
      } catch (e) {}
      setOneRMMap(map);
      try {
        const r = await window.storage.get("workoutHistory", false);
        setHistory(r && r.value ? JSON.parse(r.value) : []);
      } catch (e) {}
      try {
        const r = await window.storage.get("locations", false);
        setLocations(r && r.value ? JSON.parse(r.value) : []);
      } catch (e) {}
      try {
        const r = await window.storage.get("progressionFactors", false);
        setProgressionFactors(r && r.value ? JSON.parse(r.value) : {});
      } catch (e) {}
      setLoaded(true);
    })();
  }, []);

  const selectedLocation = locations.find((l) => l.id === locationId) || null;

  const toggleMuscleGroup = (g) => {
    setMuscleGroups((prev) => (prev.includes(g) ? prev.filter((x) => x !== g) : [...prev, g]));
  };

  const handleGenerate = () => {
    const cap = parseInt(timeCap) || 45;
    if (buildMode === "list" && !desired.trim()) { showToast("Bitte mindestens eine Übung angeben"); return; }
    const w = generateWorkout({ focus, desired, timeCapMinutes: cap, oneRMMap, equipment: selectedLocation ? selectedLocation.equipment : [], buildMode, muscleGroups: buildMode !== "list" ? muscleGroups : [], progressionFactors });
    w.locationName = selectedLocation ? selectedLocation.name : null;
    setWorkout(w);
  };

  const updateItem = (blockIndex, itemIndex, field, value) => {
    setWorkout((prev) => {
      if (!prev) return prev;
      const blocks = prev.blocks.map((b, bi) => bi !== blockIndex ? b : {
        ...b,
        items: b.items.map((it, ii) => {
          if (ii !== itemIndex) return it;
          if (field === "exercise") {
            const weight = suggestWeight(value, oneRMMap, progressionFactors);
            const newSuggestion = weight ? `≈${weight} kg` : null;
            // Bereits individuell bearbeitete Sätze bleiben erhalten, nur der Name ändert sich
            return { ...it, exercise: value, weightSuggestion: newSuggestion, oneRM: oneRMMap[value] || null };
          }
          return { ...it, [field]: value };
        }),
      });
      return { ...prev, blocks };
    });
  };

  const updateSet = (blockIndex, itemIndex, setIndex, field, value) => {
    setWorkout((prev) => {
      if (!prev) return prev;
      const blocks = prev.blocks.map((b, bi) => bi !== blockIndex ? b : {
        ...b,
        items: b.items.map((it, ii) => {
          if (ii !== itemIndex) return it;
          const currentSets = it.sets || defaultSets(it) || [];
          const sets = currentSets.map((s, si) => si !== setIndex ? s : { ...s, [field]: value });
          return { ...it, sets };
        }),
      });
      return { ...prev, blocks };
    });
  };

  const addSet = (blockIndex, itemIndex) => {
    setWorkout((prev) => {
      if (!prev) return prev;
      const blocks = prev.blocks.map((b, bi) => bi !== blockIndex ? b : {
        ...b,
        items: b.items.map((it, ii) => {
          if (ii !== itemIndex) return it;
          const currentSets = it.sets || defaultSets(it) || [];
          const last = currentSets[currentSets.length - 1] || { reps: "", weight: "", done: false };
          return { ...it, sets: [...currentSets, { reps: last.reps, weight: last.weight, done: false }] };
        }),
      });
      return { ...prev, blocks };
    });
  };

  const removeSet = (blockIndex, itemIndex, setIndex) => {
    setWorkout((prev) => {
      if (!prev) return prev;
      const blocks = prev.blocks.map((b, bi) => bi !== blockIndex ? b : {
        ...b,
        items: b.items.map((it, ii) => {
          if (ii !== itemIndex) return it;
          const currentSets = it.sets || defaultSets(it) || [];
          return { ...it, sets: currentSets.filter((_, si) => si !== setIndex) };
        }),
      });
      return { ...prev, blocks };
    });
  };

  const toggleBlockDone = (blockIndex) => {
    setWorkout((prev) => {
      if (!prev) return prev;
      const blocks = prev.blocks.map((b, bi) => bi !== blockIndex ? b : { ...b, done: !b.done });
      return { ...prev, blocks };
    });
  };

  const openQuick1RM = (blockIndex, itemIndex, name) => {
    if (!name || !name.trim()) return;
    setQuick1RM({ blockIndex, itemIndex, name: name.trim() });
    setQuick1RMWeight("");
    setQuick1RMReps("1");
    setQuick1RMError("");
  };

  const saveQuick1RM = async () => {
    setQuick1RMError("");
    const w = parseFloat(quick1RMWeight.replace(",", "."));
    const r = parseInt(quick1RMReps) || 1;
    if (!w || w <= 0) { setQuick1RMError("Bitte ein gültiges Gewicht eingeben."); return; }
    const name = quick1RM.name;
    const est = estimate1RM(w, r);
    try {
      const res = await window.storage.get(`strength:${name}`, false);
      const existing = res && res.value ? JSON.parse(res.value) : [];
      const entry = { id: uid(), date: todayStr(), weight: w, reps: r, est1RM: est, notes: "" };
      const next = [...existing, entry].sort((a, b) => a.date.localeCompare(b.date));
      await window.storage.set(`strength:${name}`, JSON.stringify(next), false);
      const newBest = Math.max(...next.map((e) => e.est1RM));
      const nextOneRMMap = { ...oneRMMap, [name]: newBest };
      setOneRMMap(nextOneRMMap);
      // Alle Vorkommen dieser Übung im aktuellen Workout live aktualisieren
      setWorkout((prev) => {
        if (!prev) return prev;
        const blocks = prev.blocks.map((b) => ({
          ...b,
          items: b.items.map((it) => {
            if (it.exercise.toLowerCase() !== name.toLowerCase()) return it;
            const weight = suggestWeight(it.exercise, nextOneRMMap, progressionFactors);
            return { ...it, oneRM: newBest, weightSuggestion: weight ? `≈${weight} kg` : it.weightSuggestion };
          }),
        }));
        return { ...prev, blocks };
      });
      setQuick1RM(null);
      showToast(`1RM für ${name} gespeichert (~${newBest} kg)`);
    } catch (e) {
      setQuick1RMError("Speichern fehlgeschlagen.");
    }
  };

  const moveBlock = (index, dir) => {
    setWorkout((prev) => {
      if (!prev) return prev;
      const target = index + dir;
      if (target < 0 || target >= prev.blocks.length) return prev;
      const isMain = (b) => /^(Block|Übung)\s*\d+/.test(b.name);
      if (!isMain(prev.blocks[index]) || !isMain(prev.blocks[target])) return prev;
      const blocks = prev.blocks.slice();
      [blocks[index], blocks[target]] = [blocks[target], blocks[index]];
      return { ...prev, blocks: renumberBlocks(blocks) };
    });
  };

  const addManualExercise = () => {
    setWorkout((prev) => {
      if (!prev) return prev;
      const mainBlocks = prev.blocks.filter((b) => /^(Block|Übung)/.test(b.name));
      const usesUebung = mainBlocks.some((b) => b.name.startsWith("Übung"));
      const nextNum = mainBlocks.length + 1;
      const newBlock = {
        name: `${usesUebung ? "Übung" : "Block"} ${nextNum}`,
        format: "Straight Sets",
        minutes: 8,
        items: [{ exercise: "", reps: "3 × 10", notes: "manuell ergänzt", weightSuggestion: null, oneRM: null }],
      };
      const cdIndex = prev.blocks.findIndex((b) => b.name === "Cool-Down");
      const blocks = cdIndex === -1 ? [...prev.blocks, newBlock] : [...prev.blocks.slice(0, cdIndex), newBlock, ...prev.blocks.slice(cdIndex)];
      return { ...prev, blocks: renumberBlocks(blocks), totalMin: prev.totalMin + newBlock.minutes };
    });
  };

  const handleSaveToTraining = async () => {
    if (!workout) return;
    if (!confirm("Training als abgeschlossen markieren und ins Trainingstagebuch übertragen?")) return;
    const id = uid();
    const actualMinutes = timerElapsedSec > 0 ? Math.max(1, Math.round(timerElapsedSec / 60)) : workout.timeCapMinutes;
    const mainBlocks = workout.blocks.filter((b) => b.name.startsWith("Block") || b.name.startsWith("Übung"));
    const doneCount = mainBlocks.filter((b) => b.done).length;
    const completionNote = mainBlocks.length > 0 && doneCount < mainBlocks.length ? ` (${doneCount}/${mainBlocks.length} Blöcke geschafft)` : "";

    const historyEntry = { id, date: genDate, title: workout.title, focus: workout.focus, timeCap: workout.timeCapMinutes };
    const nextHistory = [...history, historyEntry];
    setHistory(nextHistory);
    try {
      await window.storage.set("workoutHistory", JSON.stringify(nextHistory), false);
      await window.storage.set(`workoutDetail:${id}`, JSON.stringify(workout), false);
    } catch (e) {}

    try {
      const r = await window.storage.get(`training:${genDate}`, false);
      const existing = r && r.value ? JSON.parse(r.value) : [];
      const trainingEntry = { id: uid(), type: workout.focus === "Krafttraining" ? "Langhantel" : "CrossFit", focus: workout.focus, duration: actualMinutes, notes: `${workout.title}${completionNote}` };
      await window.storage.set(`training:${genDate}`, JSON.stringify([...existing, trainingEntry]), false);
    } catch (e) {}
    showToast("Im Trainingstagebuch gespeichert");
    setTimerElapsedSec(0);
    setTimerRunning(false);

    // Übungen mit Gewichtsvorschlag sammeln, um danach Feedback zur Progression einzuholen
    const loadedExercises = new Set();
    workout.blocks.forEach((b) => b.items.forEach((it) => { if (it.weightSuggestion) loadedExercises.add(it.exercise); }));
    if (loadedExercises.size > 0) {
      setLastSavedWorkout({ ...workout, loadedExercises: Array.from(loadedExercises) });
      setShowFeedbackSheet(true);
    }
  };

  const submitFeedback = async (level) => {
    // level: "easy" | "good" | "hard" — passt die künftige %-1RM-Vorgabe pro Übung leicht an
    if (!lastSavedWorkout) { setShowFeedbackSheet(false); return; }
    const next = { ...progressionFactors };
    lastSavedWorkout.loadedExercises.forEach((ex) => {
      const current = next[ex] || 1;
      if (level === "easy") next[ex] = Math.min(1.15, round1(current + 0.05));
      else if (level === "hard") next[ex] = Math.max(0.85, round1(current - 0.05));
      // "good" -> unverändert lassen, aktuelle Dosierung passt
    });
    setProgressionFactors(next);
    try { await window.storage.set("progressionFactors", JSON.stringify(next), false); } catch (e) {}
    setShowFeedbackSheet(false);
    showToast("Danke — wird bei der nächsten Generierung berücksichtigt");
  };

  const detailWorkout = useMemo(() => {
    if (!viewHistoryId) return null;
    return null; // wird asynchron geladen, siehe Effekt unten
  }, [viewHistoryId]);
  const [loadedDetail, setLoadedDetail] = useState(null);
  useEffect(() => {
    if (!viewHistoryId) { setLoadedDetail(null); return; }
    (async () => {
      try {
        const r = await window.storage.get(`workoutDetail:${viewHistoryId}`, false);
        setLoadedDetail(r && r.value ? JSON.parse(r.value) : null);
      } catch (e) { setLoadedDetail(null); }
    })();
  }, [viewHistoryId]);

  const oneRMCount = Object.keys(oneRMMap).length;

  return (
    <div className="px-5 pt-5 pb-32">
      <Toast message={toast} />

      <div className="bg-[#1B2022] rounded-2xl p-5 border border-[#262C2E] mb-4">
        <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">Ort (optional)</label>
        <select value={locationId} onChange={(e) => setLocationId(e.target.value)} className="w-full mt-1 mb-3 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#E0925C]">
          <option value="">Kein Ort — alle Übungen erlaubt</option>
          {locations.map((l) => (<option key={l.id} value={l.id}>{l.name}</option>))}
        </select>
        {selectedLocation && (
          <div className="font-mono text-[10px] text-[#5F6668] mb-3">Equipment: {selectedLocation.equipment.length > 0 ? selectedLocation.equipment.join(" · ") : "nur Bodyweight"}</div>
        )}
        {locations.length === 0 && loaded && (
          <div className="font-mono text-[10px] text-[#5F6668] mb-3">Noch keine Orte hinterlegt — anlegen unter Bibliothek → Orte.</div>
        )}

        <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296] mb-2 block">Aufbau-Modus</label>
        <div className="flex gap-2 mb-4">
          <button onClick={() => setBuildMode("focus")} className={`flex-1 py-2 rounded-lg font-body text-sm font-medium transition-colors ${buildMode === "focus" ? "bg-[#E0925C] text-[#14181A]" : "bg-[#14181A] text-[#8A9296] border border-[#2A2F31]"}`}>Nach Fokus</button>
          <button onClick={() => setBuildMode("list")} className={`flex-1 py-2 rounded-lg font-body text-sm font-medium transition-colors ${buildMode === "list" ? "bg-[#E0925C] text-[#14181A]" : "bg-[#14181A] text-[#8A9296] border border-[#2A2F31]"}`}>Aus Übungsliste</button>
          <button onClick={() => setBuildMode("strength")} className={`flex-1 py-2 rounded-lg font-body text-sm font-medium transition-colors ${buildMode === "strength" ? "bg-[#E0925C] text-[#14181A]" : "bg-[#14181A] text-[#8A9296] border border-[#2A2F31]"}`}>Krafttraining</button>
        </div>

        {buildMode === "focus" ? (
          <>
            <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">Fokus (optional)</label>
            <select value={focus} onChange={(e) => setFocus(e.target.value)} className="w-full mt-1 mb-3 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#E0925C]">
              {FOCUS_CHOICES.map((f) => (<option key={f} value={f}>{f}</option>))}
            </select>

            <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">Wunschübungen (optional)</label>
            <input type="text" value={desired} onChange={(e) => setDesired(e.target.value)} placeholder="z.B. Snatch, Front Squat, HSPU" className="w-full mt-1 mb-3 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#E0925C]" />
            <p className="font-mono text-[10px] text-[#5F6668] mb-3 leading-relaxed">Wunschübungen werden bevorzugt eingebaut, der Rest wird passend zum Fokus zufällig ergänzt.</p>

            <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296] mb-2 block">Muskelgruppen statt Übungen (optional)</label>
            <div className="flex flex-wrap gap-2 mb-1">
              {MUSCLE_GROUPS.map((g) => {
                const active = muscleGroups.includes(g);
                return (
                  <button
                    key={g}
                    onClick={() => toggleMuscleGroup(g)}
                    className="px-3 py-1.5 rounded-full font-body text-xs border transition-colors"
                    style={active ? { background: "#E0925C", color: "#14181A", borderColor: "#E0925C" } : { background: "#14181A", color: "#8A9296", borderColor: "#2A2F31" }}
                  >
                    {g}
                  </button>
                );
              })}
            </div>
            <p className="font-mono text-[10px] text-[#5F6668] mb-3 leading-relaxed">Statt konkrete Übungen zu nennen, kannst du hier einfach Muskelgruppen wählen — die Auswahl der Übungen übernimmt dann der Generator.</p>
          </>
        ) : buildMode === "list" ? (
          <>
            <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">Übungen (kommagetrennt)</label>
            <input type="text" value={desired} onChange={(e) => setDesired(e.target.value)} placeholder="z.B. Kreuzheben, Kettlebell Overhead Lunges, Plank" className="w-full mt-1 mb-3 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#E0925C]" />
            <p className="font-mono text-[10px] text-[#5F6668] mb-3 leading-relaxed">Die Hauptblöcke werden direkt und ausschließlich aus diesen Übungen aufgebaut (der Reihe nach durchgezykelt) — Warm-Up, Finisher und Cool-Down bleiben wie gewohnt.</p>
          </>
        ) : (
          <>
            <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">Übungen (optional, sonst automatisch gewählt)</label>
            <input type="text" value={desired} onChange={(e) => setDesired(e.target.value)} placeholder="z.B. Kreuzheben, Bankdrücken, Front Squat" className="w-full mt-1 mb-3 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#E0925C]" />

            <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296] mb-2 block">Muskelgruppen (optional, kombinierbar mit Übungen)</label>
            <div className="flex flex-wrap gap-2 mb-1">
              {MUSCLE_GROUPS.map((g) => {
                const active = muscleGroups.includes(g);
                return (
                  <button
                    key={g}
                    onClick={() => toggleMuscleGroup(g)}
                    className="px-3 py-1.5 rounded-full font-body text-xs border transition-colors"
                    style={active ? { background: "#E0925C", color: "#14181A", borderColor: "#E0925C" } : { background: "#14181A", color: "#8A9296", borderColor: "#2A2F31" }}
                  >
                    {g}
                  </button>
                );
              })}
            </div>
            <p className="font-mono text-[10px] text-[#5F6668] mb-3 leading-relaxed">Beides lässt sich kombinieren: z.B. Übung "Bankdrücken" + Muskelgruppe "Brust" für die restlichen Übungen, oder Übung "Snatch" + Muskelgruppe "Ganzkörper". Deine genannten Übungen werden immer zuerst eingebaut, freie Plätze füllt der Generator passend zu den gewählten Muskelgruppen (ohne Auswahl: frei gemischt).</p>
            <p className="font-mono text-[10px] text-[#5F6668] mb-3 leading-relaxed">Klassisches Krafttraining ohne AMRAP/EMOM: Warm-Up, dann Übungen als Straight Sets (z.B. 4×6) mit Gewichtsvorschlag aus deiner 1RM-Datenbank, danach Cool-Down. Anzahl der Übungen richtet sich nach dem Time Cap.</p>
          </>
        )}

        <div className="grid grid-cols-2 gap-3 mb-3">
          <div>
            <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">Time Cap (Min)</label>
            <input type="number" value={timeCap} onChange={(e) => setTimeCap(e.target.value)} className="w-full mt-1 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#E0925C]" />
          </div>
          <div>
            <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">Datum</label>
            <input type="date" value={genDate} onChange={(e) => setGenDate(e.target.value)} className="w-full mt-1 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#E0925C]" />
          </div>
        </div>

        {loaded && (
          <div className="font-mono text-[10px] text-[#5F6668] mb-3">{oneRMCount > 0 ? `${oneRMCount} 1RM-Werte werden für Gewichtsvorschläge genutzt.` : "Noch keine 1RM-Werte hinterlegt — trag welche im Kraft-Tab ein für Gewichtsvorschläge."}</div>
        )}

        <button onClick={handleGenerate} className="w-full bg-[#E0925C] text-[#14181A] font-body font-semibold text-sm rounded-lg py-3 flex items-center justify-center gap-2">
          <Zap size={16} /> Workout generieren
        </button>
      </div>

      {workout && (
        <div className="space-y-3 mb-6">
          <div className="flex items-center justify-between px-1">
            <div>
              <div className="font-display text-2xl text-[#E9E4DA]">{workout.title}</div>
              {workout.locationName && <div className="font-mono text-[10px] text-[#E0925C] mt-0.5">📍 {workout.locationName}</div>}
            </div>
            <div className="font-mono text-[11px] text-[#8A9296]">~{workout.totalMin} Min gesamt</div>
          </div>

          {/* Timer */}
          <div className="bg-[#1B2022] rounded-2xl p-4 border border-[#262C2E] flex items-center justify-between">
            <div>
              <div className="font-mono text-[10px] text-[#8A9296] uppercase tracking-wider mb-1">⏱ Trainingszeit</div>
              <div className="font-display text-3xl" style={{ color: timerRunning ? "#4E9E8F" : "#E9E4DA" }}>{fmtTimer(timerElapsedSec)}</div>
            </div>
            {!timerRunning ? (
              <button onClick={startTimer} className="bg-[#4E9E8F] text-[#14181A] font-body font-semibold text-sm rounded-lg px-5 py-2.5">▶ Start</button>
            ) : (
              <button onClick={stopTimer} className="bg-[#C46B6B] text-[#14181A] font-body font-semibold text-sm rounded-lg px-5 py-2.5">⏹ Stop</button>
            )}
          </div>

          {workout.blocks.map((b, bi) => {
            const isMainBlock = b.name.startsWith("Block") || b.name.startsWith("Übung");
            return (
            <div key={bi} className="bg-[#1B2022] rounded-2xl p-4 border border-[#262C2E]" style={b.done ? { opacity: 0.55 } : {}}>
              <div className="flex items-center justify-between mb-2.5">
                <div className="flex items-center gap-2">
                  {isMainBlock && (
                    <button onClick={() => toggleBlockDone(bi)} className="w-5 h-5 rounded border flex items-center justify-center shrink-0" style={{ borderColor: b.done ? "#4E9E8F" : "#5F6668", background: b.done ? "#4E9E8F" : "transparent" }}>
                      {b.done && <span style={{ color: "#14181A", fontSize: 12 }}>✓</span>}
                    </button>
                  )}
                  <div className="font-body text-sm font-semibold text-[#E9E4DA]" style={b.done ? { textDecoration: "line-through" } : {}}>{b.name}</div>
                </div>
                <div className="flex items-center gap-2">
                  <div className="font-mono text-[10px] px-2 py-0.5 rounded-full" style={{ background: "#14181A", color: "#E0925C", border: "1px solid #E0925C" }}>{b.format}</div>
                  {isMainBlock && (
                    <div className="flex flex-col -my-1">
                      <button onClick={() => moveBlock(bi, -1)} className="text-[#5F6668] hover:text-[#E9E4DA] leading-none px-1" aria-label="Nach oben verschieben">▲</button>
                      <button onClick={() => moveBlock(bi, 1)} className="text-[#5F6668] hover:text-[#E9E4DA] leading-none px-1" aria-label="Nach unten verschieben">▼</button>
                    </div>
                  )}
                </div>
              </div>
              <div className="space-y-3">
                {b.items.map((it, ii) => {
                  const sets = it.sets || defaultSets(it);
                  return (
                    <div key={ii}>
                      <div className="flex items-center gap-2">
                        <input
                          type="text"
                          list="exerciseNamesGen"
                          value={it.exercise}
                          onChange={(e) => updateItem(bi, ii, "exercise", e.target.value)}
                          placeholder="Übung eintragen..."
                          className="flex-1 min-w-0 bg-transparent border-b border-[#2A2F31] focus:border-[#E0925C] font-body text-xs text-[#E9E4DA] px-0.5 py-1 focus:outline-none"
                        />
                        <input
                          type="text"
                          value={it.reps}
                          onChange={(e) => updateItem(bi, ii, "reps", e.target.value)}
                          className="w-16 shrink-0 bg-transparent border-b border-[#2A2F31] focus:border-[#E0925C] font-mono text-[10px] text-[#8A9296] text-center px-0.5 py-1 focus:outline-none"
                        />
                        <div className="shrink-0 w-20 text-right">
                          {it.weightSuggestion && <div className="font-mono text-[10px] text-[#4E9E8F]">{it.weightSuggestion}</div>}
                          {it.oneRM ? (
                            <div className="font-mono text-[8px] text-[#5F6668]">1RM {it.oneRM}kg</div>
                          ) : (
                            it.exercise.trim() && (
                              <button onClick={() => openQuick1RM(bi, ii, it.exercise)} className="font-mono text-[8px] text-[#7A8FC4] underline">🔗 1RM hinterlegen</button>
                            )
                          )}
                        </div>
                      </div>

                      {sets && (
                        <div className="mt-2 ml-1 space-y-1.5">
                          {sets.map((s, si) => (
                            <div key={si} className="flex items-center gap-2">
                              <span className="font-mono text-[9px] text-[#5F6668] w-4 shrink-0">{si + 1}.</span>
                              <input
                                type="text" inputMode="numeric"
                                value={s.reps}
                                onChange={(e) => updateSet(bi, ii, si, "reps", e.target.value)}
                                placeholder="Wdh."
                                className="w-14 shrink-0 bg-[#14181A] border border-[#2A2F31] rounded px-2 py-1 font-mono text-[10px] text-[#E9E4DA] text-center focus:outline-none focus:border-[#E0925C]"
                              />
                              <span className="font-mono text-[9px] text-[#5F6668]">×</span>
                              <input
                                type="text" inputMode="decimal"
                                value={s.weight}
                                onChange={(e) => updateSet(bi, ii, si, "weight", e.target.value)}
                                placeholder="kg"
                                className="w-16 shrink-0 bg-[#14181A] border border-[#2A2F31] rounded px-2 py-1 font-mono text-[10px] text-[#E9E4DA] text-center focus:outline-none focus:border-[#E0925C]"
                              />
                              <span className="font-mono text-[9px] text-[#5F6668]">kg</span>
                              <button onClick={() => updateSet(bi, ii, si, "done", !s.done)} className="w-5 h-5 rounded border flex items-center justify-center shrink-0 ml-1" style={{ borderColor: s.done ? "#4E9E8F" : "#5F6668", background: s.done ? "#4E9E8F" : "transparent" }}>
                                {s.done && <span style={{ color: "#14181A", fontSize: 10 }}>✓</span>}
                              </button>
                              <button onClick={() => removeSet(bi, ii, si)} className="text-[#5F6668] hover:text-[#C46B6B] ml-auto shrink-0"><X size={12} /></button>
                            </div>
                          ))}
                          <button onClick={() => addSet(bi, ii)} className="font-mono text-[9px] text-[#7A8FC4] underline">+ Satz</button>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          );})}
          <datalist id="exerciseNamesGen">{Object.keys(oneRMMap).map((n) => (<option key={n} value={n} />))}</datalist>

          <button onClick={addManualExercise} className="w-full bg-[#1B2022] border border-dashed border-[#2A2F31] text-[#8A9296] font-body text-sm rounded-lg py-2.5 flex items-center justify-center gap-1.5">
            <Plus size={15} /> Übung manuell ergänzen
          </button>
          <p className="font-mono text-[10px] text-[#5F6668] px-1">✎ Übung oder Wiederholungen antippen, um sie manuell anzupassen. Bei erkanntem Satz-Schema (z.B. "4 × 6") kannst du jeden Satz einzeln mit tatsächlichem Gewicht & Wiederholungen eintragen und abhaken. Mit ▲▼ lässt sich die Reihenfolge deiner Übungen ändern. 1RM-Werte stammen aus deiner Kraft-Datenbank und dienen nur als Orientierung.</p>
          <div className="flex gap-2">
            <button onClick={handleGenerate} className="flex-1 bg-[#1B2022] border border-[#262C2E] text-[#8A9296] font-body font-medium text-sm rounded-lg py-3">🔁 Neu generieren</button>
            <button onClick={handleSaveToTraining} className="flex-1 bg-[#4E9E8F] text-[#14181A] font-body font-semibold text-sm rounded-lg py-3">✅ Training abgeschlossen — ins Tagebuch übertragen</button>
          </div>
        </div>
      )}

      {history.length > 0 && (
        <div>
          <div className="font-mono text-[11px] uppercase tracking-widest text-[#5F6668] mb-2 px-1">Verlauf</div>
          <div className="space-y-2">
            {history.slice().reverse().map((h) => (
              <button key={h.id} onClick={() => setViewHistoryId(h.id)} className="w-full text-left bg-[#1B2022] rounded-xl px-4 py-3 border border-[#262C2E] active:opacity-70">
                <div className="flex items-center justify-between">
                  <div className="font-body text-sm text-[#E9E4DA]">{h.title}</div>
                  <div className="font-mono text-[10px] text-[#5F6668]">{new Date(h.date + "T00:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" })}</div>
                </div>
              </button>
            ))}
          </div>
        </div>
      )}

      {viewHistoryId && (
        <Sheet title="WORKOUT ANSEHEN" onClose={() => setViewHistoryId(null)}>
          {!loadedDetail ? (
            <div className="flex justify-center py-10 text-[#8A9296]"><Loader2 className="animate-spin" size={22} /></div>
          ) : (
            <div className="space-y-3">
              {loadedDetail.blocks.map((b, bi) => (
                <div key={bi} className="bg-[#14181A] rounded-xl p-3 border border-[#2A2F31]">
                  <div className="flex items-center justify-between mb-2">
                    <div className="font-body text-sm font-semibold text-[#E9E4DA]">{b.name}</div>
                    <div className="font-mono text-[10px] text-[#E0925C]">{b.format}</div>
                  </div>
                  <div className="space-y-1">
                    {b.items.map((it, ii) => (
                      <div key={ii} className="flex items-center justify-between font-body text-xs text-[#E9E4DA]">
                        <span>{it.exercise} <span className="font-mono text-[#8A9296]">· {it.reps}</span></span>
                        <span className="text-right">
                          {it.weightSuggestion && <span className="font-mono text-[10px] text-[#4E9E8F] block">{it.weightSuggestion}</span>}
                          {it.oneRM && <span className="font-mono text-[8px] text-[#5F6668] block">1RM {it.oneRM}kg</span>}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          )}
        </Sheet>
      )}

      {showFeedbackSheet && (
        <Sheet title="WIE WAR'S?" onClose={() => setShowFeedbackSheet(false)}>
          <p className="font-body text-sm text-[#E9E4DA] mb-4">
            Wie war die Intensität bei den Gewichtsvorgaben ({lastSavedWorkout?.loadedExercises.join(", ")})? Deine Rückmeldung passt die Vorschläge für nächstes Mal automatisch an.
          </p>
          <div className="space-y-2">
            <button onClick={() => submitFeedback("easy")} className="w-full bg-[#14181A] border border-[#2A2F31] text-[#E9E4DA] font-body text-sm rounded-lg py-3 text-left px-4">
              😌 <span className="font-medium">Zu leicht</span> <span className="text-[#5F6668] font-mono text-[10px]">— nächstes Mal etwas mehr Gewicht</span>
            </button>
            <button onClick={() => submitFeedback("good")} className="w-full bg-[#14181A] border border-[#2A2F31] text-[#E9E4DA] font-body text-sm rounded-lg py-3 text-left px-4">
              👍 <span className="font-medium">Passend</span> <span className="text-[#5F6668] font-mono text-[10px]">— so beibehalten</span>
            </button>
            <button onClick={() => submitFeedback("hard")} className="w-full bg-[#14181A] border border-[#2A2F31] text-[#E9E4DA] font-body text-sm rounded-lg py-3 text-left px-4">
              😤 <span className="font-medium">Zu schwer</span> <span className="text-[#5F6668] font-mono text-[10px]">— nächstes Mal etwas weniger Gewicht</span>
            </button>
          </div>
          <button onClick={() => setShowFeedbackSheet(false)} className="w-full mt-3 font-mono text-[10px] text-[#5F6668] underline">Überspringen</button>
        </Sheet>
      )}

      {quick1RM && (
        <Sheet title="1RM HINTERLEGEN" onClose={() => setQuick1RM(null)}>
          <p className="font-body text-sm text-[#E9E4DA] mb-4">
            Für <span className="font-semibold">{quick1RM.name}</span> ist noch kein 1RM hinterlegt. Trag Gewicht + Wiederholungen eines aktuellen Satzes ein — die App schätzt daraus per Epley-Formel dein 1RM und übernimmt es direkt in dieses Workout.
          </p>
          <div className="grid grid-cols-2 gap-3 mb-3">
            <div>
              <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">Gewicht (kg)</label>
              <input type="text" inputMode="decimal" value={quick1RMWeight} onChange={(e) => setQuick1RMWeight(e.target.value)} placeholder="z.B. 60" className="w-full mt-1 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#7A8FC4]" />
            </div>
            <div>
              <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">Wiederholungen</label>
              <input type="number" value={quick1RMReps} onChange={(e) => setQuick1RMReps(e.target.value)} className="w-full mt-1 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#7A8FC4]" />
            </div>
          </div>
          {parseInt(quick1RMReps) > 1 && quick1RMWeight && (
            <div className="font-mono text-[11px] text-[#7A8FC4] mb-3">Geschätztes 1RM: ~{estimate1RM(parseFloat(quick1RMWeight.replace(",", ".")) || 0, parseInt(quick1RMReps))} kg</div>
          )}
          {quick1RMError && <div className="text-[#C46B6B] font-body text-xs mb-3">{quick1RMError}</div>}
          <button onClick={saveQuick1RM} className="w-full bg-[#7A8FC4] text-[#14181A] font-body font-semibold text-sm rounded-lg py-3">Speichern &amp; zurück zum Workout</button>
          <p className="font-mono text-[10px] text-[#5F6668] mt-3 leading-relaxed">Wird zusätzlich dauerhaft in deiner Kraft-Datenbank gespeichert.</p>
        </Sheet>
      )}
    </div>
  );
}

const DIET_TYPES = ["Omnivor (alles)", "Vegetarisch", "Vegan", "Pescetarisch", "Flexitarisch", "Low-Carb", "Sonstiges"];
const NUTRITION_GOALS = ["Muskelaufbau (Überschuss)", "Erhalt / Aufbau ohne Zunahme", "Fettabbau (Defizit)", "Leistungsoptimierung (Wettkampf)"];
const TRAINING_GOALS = ["Kraftaufbau", "Muskelaufbau", "Ausdauer", "Wettkampfvorbereitung", "Allgemeine Fitness / Gesundheit"];

function AnamneseTab() {
  const [profile, setProfile] = useState({
    name: "", birthYear: "", gender: "", heightCm: "",
    dietType: "Vegetarisch", allergies: "",
    trainingYears: "", sportGoal: "", nutritionGoal: "Erhalt / Aufbau ohne Zunahme", trainingGoal: "Kraftaufbau",
    injuries: "", notes: "",
  });
  const [loaded, setLoaded] = useState(false);
  const [saved, setSaved] = useState(false);
  const [latestWeight, setLatestWeight] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get("profile", false);
        if (r && r.value) setProfile((p) => ({ ...p, ...JSON.parse(r.value) }));
      } catch (e) {}
      let d = addDays(todayStr(), -1);
      for (let i = 0; i < 60; i++) {
        try {
          const rr = await window.storage.get(`recovery:${d}`, false);
          const parsed = rr && rr.value ? JSON.parse(rr.value) : null;
          if (parsed && parsed.weight) { setLatestWeight({ weight: parsed.weight, date: d }); break; }
        } catch (e) {}
        d = addDays(d, -1);
      }
      setLoaded(true);
    })();
  }, []);

  const persist = async (next) => {
    setProfile(next);
    try {
      await window.storage.set("profile", JSON.stringify(next), false);
      setSaved(true);
      setTimeout(() => setSaved(false), 1200);
    } catch (e) {}
  };

  const field = (key, val) => persist({ ...profile, [key]: val });

  const [goalChangeSuggestion, setGoalChangeSuggestion] = useState(null);
  const GOAL_KCAL_HINT = {
    "Muskelaufbau (Überschuss)": 250,
    "Fettabbau (Defizit)": -300,
    "Erhalt / Aufbau ohne Zunahme": 0,
    "Leistungsoptimierung (Wettkampf)": 0,
  };

  const handleNutritionGoalChange = (newGoal) => {
    const oldGoal = profile.nutritionGoal;
    field("nutritionGoal", newGoal);
    const hint = GOAL_KCAL_HINT[newGoal] ?? 0;
    if (newGoal !== oldGoal && hint !== 0) {
      setGoalChangeSuggestion({ newGoal, delta: hint });
    } else {
      setGoalChangeSuggestion(null);
    }
  };

  const applyGoalKcalSuggestion = async () => {
    if (!goalChangeSuggestion) return;
    try {
      const r = await window.storage.get("targets", false);
      const current = r && r.value ? JSON.parse(r.value) : { baseKcal: 2700, protein: 170, trainingFactor: 1 };
      const nextBase = Math.round((current.baseKcal ?? 2700) + goalChangeSuggestion.delta);
      await window.storage.set("targets", JSON.stringify({ ...current, baseKcal: nextBase }), false);
      await window.storage.set("lastCalorieChange", JSON.stringify({ previousBaseKcal: current.baseKcal ?? 2700, deltaKcal: goalChangeSuggestion.delta, appliedAt: todayStr() }), false);
      setGoalChangeSuggestion(null);
    } catch (e) {}
  };

  const age = profile.birthYear ? new Date().getFullYear() - parseInt(profile.birthYear) : null;
  const bmi = profile.heightCm && latestWeight ? round1(latestWeight.weight / Math.pow(parseFloat(profile.heightCm) / 100, 2)) : null;

  if (!loaded) return <div className="flex justify-center py-16 text-[#8A9296]"><Loader2 className="animate-spin" size={22} /></div>;

  const exportData = async () => {
    try {
      const list = await window.storage.list("", false);
      const data = {};
      for (const key of (list?.keys || [])) {
        try {
          const r = await window.storage.get(key, false);
          if (r && r.value !== undefined) data[key] = r.value;
        } catch (e) {}
      }
      const payload = { exportedAt: new Date().toISOString(), app: "Trainings- & Ernährungstracker", data };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `tracker-backup-${todayStr()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (e) {
      alert("Export fehlgeschlagen: " + e.message);
    }
  };

  const importData = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        const data = parsed.data || parsed;
        const keys = Object.keys(data);
        if (!keys.length) { alert("Keine Daten in dieser Datei gefunden."); return; }
        if (!confirm(`${keys.length} gespeicherte Werte gefunden. Vorhandene Daten mit gleichem Schlüssel werden überschrieben. Fortfahren?`)) return;
        for (const key of keys) {
          await window.storage.set(key, data[key], false);
        }
        alert("Import abgeschlossen. Die Seite wird neu geladen.");
        window.location.reload();
      } catch (err) {
        alert("Import fehlgeschlagen: Datei ungültig.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  return (
    <div className="px-5 pt-5 pb-10">
      <div className="flex items-center justify-between mb-4">
        <div className="font-mono text-[11px] text-[#8A9296]">Persönliches Profil — Basis für Trainings- und Ernährungsplanung</div>
        {saved && <span className="font-mono text-[10px] text-[#4E9E8F]">gespeichert ✓</span>}
      </div>

      {/* Wer bin ich */}
      <div className="bg-[#1B2022] rounded-2xl p-5 border border-[#262C2E] mb-4">
        <div className="font-mono text-xs text-[#8A9296] uppercase tracking-wider mb-3">Person</div>
        <div className="grid grid-cols-2 gap-3 mb-3">
          <div>
            <label className="font-mono text-[10px] uppercase tracking-wider text-[#5F6668]">Name</label>
            <input type="text" value={profile.name} onChange={(e) => setProfile({ ...profile, name: e.target.value })} onBlur={() => field("name", profile.name)} className="w-full mt-1 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#C4703B]" />
          </div>
          <div>
            <label className="font-mono text-[10px] uppercase tracking-wider text-[#5F6668]">Geschlecht</label>
            <select value={profile.gender} onChange={(e) => field("gender", e.target.value)} className="w-full mt-1 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#C4703B]">
              <option value="">—</option>
              <option value="männlich">männlich</option>
              <option value="weiblich">weiblich</option>
              <option value="divers">divers</option>
            </select>
          </div>
        </div>
        <div className="grid grid-cols-3 gap-3">
          <div>
            <label className="font-mono text-[10px] uppercase tracking-wider text-[#5F6668]">Geburtsjahr</label>
            <input type="number" value={profile.birthYear} onChange={(e) => setProfile({ ...profile, birthYear: e.target.value })} onBlur={() => field("birthYear", profile.birthYear)} placeholder="1984" className="w-full mt-1 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#C4703B]" />
            {age && <div className="font-mono text-[9px] text-[#5F6668] mt-1">≈ {age} Jahre</div>}
          </div>
          <div>
            <label className="font-mono text-[10px] uppercase tracking-wider text-[#5F6668]">Größe (cm)</label>
            <input type="number" value={profile.heightCm} onChange={(e) => setProfile({ ...profile, heightCm: e.target.value })} onBlur={() => field("heightCm", profile.heightCm)} placeholder="180" className="w-full mt-1 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#C4703B]" />
          </div>
          <div>
            <label className="font-mono text-[10px] uppercase tracking-wider text-[#5F6668]">Gewicht</label>
            <div className="mt-1 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2 font-body text-sm text-[#8A9296]">
              {latestWeight ? `${latestWeight.weight} kg` : "—"}
            </div>
          </div>
        </div>
        {latestWeight && (
          <div className="font-mono text-[9px] text-[#5F6668] mt-2">
            Aus dem wöchentlichen Wiegen ({new Date(latestWeight.date + "T00:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" })}){bmi ? ` · BMI ≈ ${bmi}` : ""} — änderbar im Training-Tab.
          </div>
        )}
      </div>

      {/* Ernährung */}
      <div className="bg-[#1B2022] rounded-2xl p-5 border border-[#262C2E] mb-4">
        <div className="font-mono text-xs text-[#8A9296] uppercase tracking-wider mb-3">Ernährung</div>
        <label className="font-mono text-[10px] uppercase tracking-wider text-[#5F6668]">Ernährungsform</label>
        <select value={profile.dietType} onChange={(e) => field("dietType", e.target.value)} className="w-full mt-1 mb-3 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#C4703B]">
          {DIET_TYPES.map((d) => (<option key={d} value={d}>{d}</option>))}
        </select>
        <label className="font-mono text-[10px] uppercase tracking-wider text-[#5F6668]">Unverträglichkeiten / Allergien</label>
        <input type="text" value={profile.allergies} onChange={(e) => setProfile({ ...profile, allergies: e.target.value })} onBlur={() => field("allergies", profile.allergies)} placeholder="z.B. Laktoseintoleranz, Nüsse" className="w-full mt-1 mb-3 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#C4703B]" />
        <label className="font-mono text-[10px] uppercase tracking-wider text-[#5F6668]">Ernährungsziel</label>
        <select value={profile.nutritionGoal} onChange={(e) => handleNutritionGoalChange(e.target.value)} className="w-full mt-1 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#C4703B]">
          {NUTRITION_GOALS.map((g) => (<option key={g} value={g}>{g}</option>))}
        </select>

        {goalChangeSuggestion && (
          <div className="mt-3 bg-[#14181A] border border-[#E0925C] rounded-lg p-3">
            <div className="font-body text-sm text-[#E9E4DA] mb-2">
              Neues Ziel "{goalChangeSuggestion.newGoal}" — soll das Kalorienziel direkt um {goalChangeSuggestion.delta > 0 ? "+" : ""}{goalChangeSuggestion.delta} kcal angepasst werden?
            </div>
            <div className="flex gap-2">
              <button onClick={() => setGoalChangeSuggestion(null)} className="flex-1 bg-transparent border border-[#2A2F31] text-[#8A9296] font-mono text-[11px] rounded-lg py-2">Später</button>
              <button onClick={applyGoalKcalSuggestion} className="flex-1 bg-[#E0925C] text-[#14181A] font-mono text-[11px] font-medium rounded-lg py-2">Jetzt anpassen</button>
            </div>
          </div>
        )}
      </div>

      {/* Sport */}
      <div className="bg-[#1B2022] rounded-2xl p-5 border border-[#262C2E] mb-4">
        <div className="font-mono text-xs text-[#8A9296] uppercase tracking-wider mb-3">Sport</div>
        <div className="grid grid-cols-2 gap-3 mb-3">
          <div>
            <label className="font-mono text-[10px] uppercase tracking-wider text-[#5F6668]">Trainingserfahrung (Jahre)</label>
            <input type="number" value={profile.trainingYears} onChange={(e) => setProfile({ ...profile, trainingYears: e.target.value })} onBlur={() => field("trainingYears", profile.trainingYears)} placeholder="25" className="w-full mt-1 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#4E9E8F]" />
          </div>
          <div>
            <label className="font-mono text-[10px] uppercase tracking-wider text-[#5F6668]">Trainingsziel</label>
            <select value={profile.trainingGoal} onChange={(e) => field("trainingGoal", e.target.value)} className="w-full mt-1 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#4E9E8F]">
              {TRAINING_GOALS.map((g) => (<option key={g} value={g}>{g}</option>))}
            </select>
          </div>
        </div>
        <label className="font-mono text-[10px] uppercase tracking-wider text-[#5F6668]">Sportliches Ziel (frei)</label>
        <input type="text" value={profile.sportGoal} onChange={(e) => setProfile({ ...profile, sportGoal: e.target.value })} onBlur={() => field("sportGoal", profile.sportGoal)} placeholder="z.B. Spartan Trifecta 2027" className="w-full mt-1 mb-3 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#4E9E8F]" />
        <label className="font-mono text-[10px] uppercase tracking-wider text-[#5F6668]">Verletzungen / Einschränkungen</label>
        <input type="text" value={profile.injuries} onChange={(e) => setProfile({ ...profile, injuries: e.target.value })} onBlur={() => field("injuries", profile.injuries)} placeholder="z.B. rechte Schulter, keine Overhead-Belastung" className="w-full mt-1 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#4E9E8F]" />
      </div>

      {/* Sonstiges */}
      <div className="bg-[#1B2022] rounded-2xl p-5 border border-[#262C2E]">
        <div className="font-mono text-xs text-[#8A9296] uppercase tracking-wider mb-3">Sonstiges</div>
        <label className="font-mono text-[10px] uppercase tracking-wider text-[#5F6668]">Notizen (frei)</label>
        <textarea value={profile.notes} onChange={(e) => setProfile({ ...profile, notes: e.target.value })} onBlur={() => field("notes", profile.notes)} placeholder="z.B. Familie/Job-Situation, bevorzugte Trainingszeiten, alles was sonst relevant ist" rows={3} className="w-full mt-1 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#7A8FC4] resize-none" />
      </div>

      {/* Backup */}
      <div className="bg-[#1B2022] rounded-2xl p-5 border border-[#262C2E] mt-4">
        <div className="font-mono text-xs text-[#8A9296] uppercase tracking-wider mb-2">💾 Daten-Backup</div>
        <p className="font-mono text-[10px] text-[#5F6668] mb-3 leading-relaxed">
          Alle Daten liegen nur lokal in diesem Browser — auch nach dem Hosten. Regelmäßiger Export ist die einzige echte Absicherung gegen Datenverlust (Browser-Reset, Gerätewechsel, versehentliches Löschen der Website-Daten).
        </p>
        <div className="flex gap-2">
          <button onClick={exportData} className="flex-1 bg-[#4E9E8F] text-[#14181A] font-body font-semibold text-sm rounded-lg py-2.5">Exportieren</button>
          <label className="flex-1 bg-[#14181A] border border-[#2A2F31] text-[#8A9296] font-body font-medium text-sm rounded-lg py-2.5 text-center cursor-pointer">
            Importieren
            <input type="file" accept="application/json" onChange={importData} className="hidden" />
          </label>
        </div>
      </div>
    </div>
  );
}

const PLAN_DAYS = 7;

function PlanningTab() {
  const [plan, setPlan] = useState({}); // { date: { mealType: assignment|null } }
  const [templates, setTemplates] = useState([]);
  const [favorites, setFavorites] = useState([]);
  const [allFoods, setAllFoods] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [toast, setToast] = useState("");

  const [assignSlot, setAssignSlot] = useState(null); // { date, mealType }
  const [shoppingDays, setShoppingDays] = useState(3);
  const [shoppingList, setShoppingList] = useState(null);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2000); };

  const dates = useMemo(() => {
    const d = [];
    for (let i = 0; i < PLAN_DAYS; i++) d.push(addDays(todayStr(), i));
    return d;
  }, []);

  useEffect(() => {
    (async () => {
      try { const r = await window.storage.get("mealTemplates", false); setTemplates(r && r.value ? JSON.parse(r.value) : []); } catch (e) {}
      try { const r = await window.storage.get("favoriteFoods", false); setFavorites(r && r.value ? JSON.parse(r.value) : []); } catch (e) {}
      try {
        const r = await window.storage.get("customFoods", false);
        const custom = r && r.value ? JSON.parse(r.value) : [];
        setAllFoods([...LOCAL_FOODS.map((f) => ({ ...f, builtin: true })), ...custom.map((f) => ({ ...f, builtin: false }))]);
      } catch (e) {}
      const planData = {};
      for (const d of dates) {
        try {
          const r = await window.storage.get(`mealplan:${d}`, false);
          planData[d] = r && r.value ? JSON.parse(r.value) : {};
        } catch (e) { planData[d] = {}; }
      }
      setPlan(planData);
      try {
        const r = await window.storage.get("shoppingList", false);
        if (r && r.value) setShoppingList(JSON.parse(r.value));
      } catch (e) {}
      setLoaded(true);
    })();
  }, []);

  const persistDay = async (date, dayPlan) => {
    setPlan((prev) => ({ ...prev, [date]: dayPlan }));
    try { await window.storage.set(`mealplan:${date}`, JSON.stringify(dayPlan), false); } catch (e) {}
  };

  const assignToSlot = async (source, ref) => {
    const { date, mealType } = assignSlot;
    let items = [];
    let label = "";
    if (source === "cluster") {
      items = ref.items;
      label = ref.name;
    } else {
      const f = allFoods.find((x) => x.name === ref);
      if (!f) return;
      const amt = f.unit === "stk" ? 1 : 100;
      const factor = f.unit === "stk" ? amt : amt / 100;
      items = [{ name: ref, amount: amt, unit: f.unit, kcal: round1(f.kcal * factor), protein: round1(f.protein * factor), fat: round1(f.fat * factor), carbs: round1(f.carbs * factor) }];
      label = ref;
    }
    const dayPlan = { ...(plan[date] || {}), [mealType]: { source, label, items } };
    await persistDay(date, dayPlan);
    setAssignSlot(null);
  };

  const clearSlot = async (date, mealType) => {
    const dayPlan = { ...(plan[date] || {}) };
    delete dayPlan[mealType];
    await persistDay(date, dayPlan);
  };

  const transferSlotToDiary = async (date, mealType) => {
    const assignment = plan[date]?.[mealType];
    if (!assignment) return;
    try {
      const r = await window.storage.get(`log:${date}`, false);
      const existing = r && r.value ? JSON.parse(r.value) : [];
      const newEntries = assignment.items.map((it) => ({ ...it, id: uid(), mealType, source: "geplant" }));
      await window.storage.set(`log:${date}`, JSON.stringify([...existing, ...newEntries]), false);
      showToast("Ins Tagebuch übertragen");
    } catch (e) {}
  };

  const generateShoppingList = async () => {
    const relevantDates = dates.slice(0, shoppingDays);
    const map = {};
    relevantDates.forEach((d) => {
      const dayPlan = plan[d] || {};
      Object.values(dayPlan).forEach((assignment) => {
        if (!assignment) return;
        assignment.items.forEach((it) => {
          const key = `${it.name}|${it.unit}`;
          map[key] = (map[key] || 0) + it.amount;
        });
      });
    });
    const items = Object.entries(map).map(([key, amount]) => {
      const [name, unit] = key.split("|");
      const rounded = unit === "stk" ? Math.ceil(amount) : Math.ceil(amount / 5) * 5;
      return { name, unit, amount: rounded, checked: false };
    }).sort((a, b) => a.name.localeCompare(b.name, "de"));
    const list = { days: shoppingDays, generatedAt: todayStr(), items };
    setShoppingList(list);
    try { await window.storage.set("shoppingList", JSON.stringify(list), false); } catch (e) {}
  };

  const toggleShoppingItem = async (idx) => {
    const next = { ...shoppingList, items: shoppingList.items.map((it, i) => (i === idx ? { ...it, checked: !it.checked } : it)) };
    setShoppingList(next);
    try { await window.storage.set("shoppingList", JSON.stringify(next), false); } catch (e) {}
  };

  const clearShoppingList = async () => {
    setShoppingList(null);
    try { await window.storage.delete("shoppingList", false); } catch (e) {}
  };

  if (!loaded) return <div className="flex justify-center py-16 text-[#8A9296]"><Loader2 className="animate-spin" size={22} /></div>;

  return (
    <div className="px-5 pt-5 pb-10">
      <Toast message={toast} />

      <div className="font-mono text-[11px] text-[#8A9296] mb-4">Plane Cluster oder Favoriten für die nächsten {PLAN_DAYS} Tage ein — als Orientierung, nicht als Pflicht.</div>

      <div className="space-y-3 mb-6">
        {dates.map((d) => {
          const dayPlan = plan[d] || {};
          const isToday = d === todayStr();
          return (
            <div key={d} className="bg-[#1B2022] rounded-2xl p-4 border border-[#262C2E]">
              <div className="font-body text-sm text-[#E9E4DA] font-medium mb-2.5 capitalize">
                {new Date(d + "T00:00:00").toLocaleDateString("de-DE", { weekday: "long", day: "2-digit", month: "2-digit" })}
                {isToday && <span className="font-mono text-[9px] text-[#4E9E8F] ml-2">HEUTE</span>}
              </div>
              <div className="space-y-1.5">
                {MEAL_TYPES.map((mt) => {
                  const a = dayPlan[mt];
                  return (
                    <div key={mt} className="flex items-center justify-between bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2">
                      <div className="min-w-0 flex-1">
                        <div className="font-mono text-[9px] text-[#5F6668] uppercase tracking-wider">{mt}</div>
                        {a ? (
                          <div className="font-body text-xs text-[#E9E4DA] truncate">{a.label} <span className="font-mono text-[9px] text-[#7A8FC4]">{a.source === "cluster" ? "Cluster" : "Favorit"}</span></div>
                        ) : (
                          <div className="font-body text-xs text-[#5F6668]">— nicht geplant</div>
                        )}
                      </div>
                      {a ? (
                        <div className="flex items-center gap-2 shrink-0 ml-2">
                          <button onClick={() => transferSlotToDiary(d, mt)} className="font-mono text-[9px] text-[#4E9E8F] underline">übertragen</button>
                          <button onClick={() => clearSlot(d, mt)} className="p-1 text-[#5F6668] hover:text-[#C46B6B]"><X size={13} /></button>
                        </div>
                      ) : (
                        <button onClick={() => setAssignSlot({ date: d, mealType: mt })} className="p-1.5 rounded-full text-[#7A8FC4] shrink-0 ml-2"><Plus size={16} /></button>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>

      {/* Einkaufsliste */}
      <div className="bg-[#1B2022] rounded-2xl p-5 border border-[#262C2E]">
        <div className="font-mono text-xs text-[#8A9296] uppercase tracking-wider mb-3">🛒 Einkaufsliste</div>
        <div className="flex gap-2 mb-3">
          {[3, 5, 7].map((n) => (
            <button key={n} onClick={() => setShoppingDays(n)} className={`flex-1 py-2 rounded-lg font-body text-sm font-medium transition-colors ${shoppingDays === n ? "bg-[#4E9E8F] text-[#14181A]" : "bg-[#14181A] text-[#8A9296] border border-[#2A2F31]"}`}>{n} Tage</button>
          ))}
        </div>
        <button onClick={generateShoppingList} className="w-full bg-[#4E9E8F] text-[#14181A] font-body font-semibold text-sm rounded-lg py-2.5 mb-3">Einkaufsliste generieren</button>

        {shoppingList && (
          <>
            <div className="flex items-center justify-between mb-2">
              <div className="font-mono text-[10px] text-[#5F6668]">Für {shoppingList.days} Tage · erstellt am {new Date(shoppingList.generatedAt + "T00:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" })}</div>
              <button onClick={clearShoppingList} className="font-mono text-[10px] text-[#C46B6B] underline">löschen</button>
            </div>
            {shoppingList.items.length === 0 ? (
              <div className="font-mono text-[11px] text-[#5F6668] py-4 text-center">Keine geplanten Mahlzeiten im gewählten Zeitraum — plane oben zuerst ein paar Slots ein.</div>
            ) : (
              <div className="space-y-1.5">
                {shoppingList.items.map((it, i) => (
                  <button key={i} onClick={() => toggleShoppingItem(i)} className="w-full flex items-center gap-3 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2 text-left">
                    <span className="w-4 h-4 rounded border flex items-center justify-center shrink-0" style={{ borderColor: it.checked ? "#4E9E8F" : "#5F6668", background: it.checked ? "#4E9E8F" : "transparent" }}>
                      {it.checked && <span style={{ color: "#14181A", fontSize: 11 }}>✓</span>}
                    </span>
                    <span className={`font-body text-sm ${it.checked ? "text-[#5F6668] line-through" : "text-[#E9E4DA]"}`}>{it.name}</span>
                    <span className="font-mono text-xs text-[#8A9296] ml-auto">{it.amount}{it.unit === "stk" ? " Stk" : " g"}</span>
                  </button>
                ))}
              </div>
            )}
          </>
        )}
      </div>

      {assignSlot && (
        <Sheet title={`${assignSlot.mealType.toUpperCase()} PLANEN`} onClose={() => setAssignSlot(null)}>
          <div className="font-mono text-[10px] text-[#5F6668] mb-3 capitalize">{new Date(assignSlot.date + "T00:00:00").toLocaleDateString("de-DE", { weekday: "long", day: "2-digit", month: "2-digit" })}</div>

          {templates.length > 0 && (
            <>
              <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296] mb-2 block">Cluster</label>
              <div className="space-y-1.5 mb-4">
                {templates.map((t) => {
                  const tot = t.items.reduce((acc, it) => ({ kcal: acc.kcal + it.kcal }), { kcal: 0 });
                  return (
                    <button key={t.id} onClick={() => assignToSlot("cluster", t)} className="w-full text-left bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2 flex items-center justify-between">
                      <span className="font-body text-sm text-[#E9E4DA]">{t.name}</span>
                      <span className="font-mono text-[10px] text-[#8A9296]">{Math.round(tot.kcal)} kcal</span>
                    </button>
                  );
                })}
              </div>
            </>
          )}

          {favorites.length > 0 && (
            <>
              <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296] mb-2 block">Favoriten</label>
              <div className="space-y-1.5">
                {favorites.map((name) => (
                  <button key={name} onClick={() => assignToSlot("favorit", name)} className="w-full text-left bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2">
                    <span className="font-body text-sm text-[#E9E4DA]">{name}</span>
                  </button>
                ))}
              </div>
            </>
          )}

          {templates.length === 0 && favorites.length === 0 && (
            <div className="font-mono text-[11px] text-[#5F6668] text-center py-6">Noch keine Cluster oder Favoriten vorhanden — leg sie zuerst in der Bibliothek an.</div>
          )}
        </Sheet>
      )}
    </div>
  );
}

function ExerciseListEditor({ exercises, setExercises, oneRMMap }) {
  const updateEx = (i, field, value) => {
    setExercises((prev) => prev.map((e, idx) => idx !== i ? e : (
      field === "exercise" ? { ...e, exercise: value, oneRM: oneRMMap[value] || null } : { ...e, [field]: value }
    )));
  };
  const removeEx = (i) => setExercises((prev) => prev.filter((_, idx) => idx !== i));
  const addEx = () => setExercises((prev) => [...prev, { exercise: "", reps: "3 × 10", oneRM: null, sets: null }]);
  const updateSet = (i, si, field, value) => {
    setExercises((prev) => prev.map((e, idx) => {
      if (idx !== i) return e;
      const sets = e.sets || defaultSets(e) || [];
      return { ...e, sets: sets.map((s, ssi) => ssi !== si ? s : { ...s, [field]: value }) };
    }));
  };
  const addSet = (i) => {
    setExercises((prev) => prev.map((e, idx) => {
      if (idx !== i) return e;
      const sets = e.sets || defaultSets(e) || [];
      const last = sets[sets.length - 1] || { reps: "", weight: "", done: false };
      return { ...e, sets: [...sets, { reps: last.reps, weight: last.weight, done: false }] };
    }));
  };
  const removeSet = (i, si) => {
    setExercises((prev) => prev.map((e, idx) => {
      if (idx !== i) return e;
      const sets = e.sets || defaultSets(e) || [];
      return { ...e, sets: sets.filter((_, ssi) => ssi !== si) };
    }));
  };

  return (
    <div className="mb-4">
      <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296] mb-2 block">Übungen (optional)</label>
      {exercises.length > 0 && (
        <div className="space-y-3 mb-3">
          {exercises.map((ex, i) => {
            const sets = ex.sets || defaultSets(ex);
            return (
              <div key={i} className="bg-[#14181A] border border-[#2A2F31] rounded-lg p-3">
                <div className="flex items-center gap-2 mb-1">
                  <input
                    type="text" list="exerciseNamesFree" value={ex.exercise}
                    onChange={(e) => updateEx(i, "exercise", e.target.value)}
                    placeholder="Übung eintragen..."
                    className="flex-1 min-w-0 bg-transparent border-b border-[#2A2F31] focus:border-[#4E9E8F] font-body text-xs text-[#E9E4DA] px-0.5 py-1 focus:outline-none"
                  />
                  <input
                    type="text" value={ex.reps}
                    onChange={(e) => updateEx(i, "reps", e.target.value)}
                    className="w-16 shrink-0 bg-transparent border-b border-[#2A2F31] focus:border-[#4E9E8F] font-mono text-[10px] text-[#8A9296] text-center px-0.5 py-1 focus:outline-none"
                  />
                  {ex.oneRM && <span className="font-mono text-[8px] text-[#5F6668] w-16 text-right shrink-0">1RM {ex.oneRM}kg</span>}
                  <button onClick={() => removeEx(i)} className="text-[#5F6668] hover:text-[#C46B6B] shrink-0"><X size={13} /></button>
                </div>
                {sets && (
                  <div className="mt-2 ml-1 space-y-1.5">
                    {sets.map((s, si) => (
                      <div key={si} className="flex items-center gap-2">
                        <span className="font-mono text-[9px] text-[#5F6668] w-4 shrink-0">{si + 1}.</span>
                        <input
                          type="text" inputMode="numeric" value={s.reps}
                          onChange={(e) => updateSet(i, si, "reps", e.target.value)}
                          placeholder="Wdh."
                          className="w-14 shrink-0 bg-[#1B2022] border border-[#2A2F31] rounded px-2 py-1 font-mono text-[10px] text-[#E9E4DA] text-center focus:outline-none focus:border-[#4E9E8F]"
                        />
                        <span className="font-mono text-[9px] text-[#5F6668]">×</span>
                        <input
                          type="text" inputMode="decimal" value={s.weight}
                          onChange={(e) => updateSet(i, si, "weight", e.target.value)}
                          placeholder="kg"
                          className="w-16 shrink-0 bg-[#1B2022] border border-[#2A2F31] rounded px-2 py-1 font-mono text-[10px] text-[#E9E4DA] text-center focus:outline-none focus:border-[#4E9E8F]"
                        />
                        <span className="font-mono text-[9px] text-[#5F6668]">kg</span>
                        <button onClick={() => updateSet(i, si, "done", !s.done)} className="w-5 h-5 rounded border flex items-center justify-center shrink-0 ml-1" style={{ borderColor: s.done ? "#4E9E8F" : "#5F6668", background: s.done ? "#4E9E8F" : "transparent" }}>
                          {s.done && <span style={{ color: "#14181A", fontSize: 10 }}>✓</span>}
                        </button>
                        <button onClick={() => removeSet(i, si)} className="text-[#5F6668] hover:text-[#C46B6B] ml-auto shrink-0"><X size={12} /></button>
                      </div>
                    ))}
                    <button onClick={() => addSet(i)} className="font-mono text-[9px] text-[#7A8FC4] underline">+ Satz</button>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}
      <datalist id="exerciseNamesFree">{Object.keys(oneRMMap).map((n) => (<option key={n} value={n} />))}</datalist>
      <button onClick={addEx} className="w-full bg-[#14181A] border border-dashed border-[#2A2F31] text-[#8A9296] font-body text-xs rounded-lg py-2 flex items-center justify-center gap-1.5">
        <Plus size={13} /> Übung hinzufügen
      </button>
    </div>
  );
}

function Sheet({ title, onClose, children }) {
  return (
    <div className="fixed inset-0 z-30 flex items-end sm:items-center sm:justify-center bg-black/50">
      <div className="bg-[#1B2022] w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl border border-[#262C2E] p-5 pb-8 max-h-[90vh] overflow-y-auto">
        <div className="flex items-center justify-between mb-4">
          <h2 className="font-display text-2xl tracking-wide">{title}</h2>
          <button onClick={onClose} className="p-1.5 rounded-full hover:bg-[#262C2E]"><X size={18} /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Tracker />);
</script>
</body>
</html>
