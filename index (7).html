<script>
  const PREFIX = "nutriapp:";
  window.storage = {
    get: async (key) => {
      const raw = localStorage.getItem(PREFIX + key);
      if (raw === null) return null;
      return { key, value: raw, shared: false };
    },
    set: async (key, value) => {
      localStorage.setItem(PREFIX + key, value);
      return { key, value, shared: false };
    },
    delete: async (key) => {
      localStorage.removeItem(PREFIX + key);
      return { key, deleted: true, shared: false };
    },
    list: async (prefix = "") => {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(PREFIX + prefix)) keys.push(k.slice(PREFIX.length));
      }
      return { keys, prefix, shared: false };
    },
  };
</script>

function recFoodMacros(foodName, amount) {
  const base = LOCAL_FOODS.find((f) => f.name === foodName);
  if (!base) return { name: foodName, amount, unit: "g", kcal: 0, protein: 0, fat: 0, carbs: 0 };
  const factor = base.unit === "stk" ? amount : amount / 100;
  return {
    name: foodName, amount, unit: base.unit,
    kcal: round1(base.kcal * factor), protein: round1(base.protein * factor),
    fat: round1(base.fat * factor), carbs: round1(base.carbs * factor),
  };
}

function computeRecItems(rec) {
  return rec.items.map(([foodName, amount]) => recFoodMacros(foodName, amount));
}

function recTotals(items) {
  return items.reduce((acc, it) => ({
    kcal: acc.kcal + it.kcal, protein: acc.protein + it.protein, fat: acc.fat + it.fat, carbs: acc.carbs + it.carbs,
  }), { kcal: 0, protein: 0, fat: 0, carbs: 0 });
}

// Skaliert eine Empfehlung proportional auf ein Ziel-kcal (mit sinnvollen Rundungen)
function scaleRecommendation(rec, targetKcal) {
  return scaleItems(computeRecItems(rec), targetKcal);
}

// Generische Skalierung für bereits berechnete Item-Listen (Cluster, Favoriten, kuratierte Vorschläge)
function scaleItems(items, targetKcal) {
  const baseTotal = recTotals(items);
  if (baseTotal.kcal <= 0) return { items, totals: baseTotal, scale: 1 };
  let scale = targetKcal / baseTotal.kcal;
  scale = Math.max(0.4, Math.min(2.5, scale));
  const scaledItems = items.map((it) => {
    const amt = it.amount || 1;
    const rate = { kcal: it.kcal / amt, protein: it.protein / amt, fat: it.fat / amt, carbs: it.carbs / amt };
    let newAmount = amt * scale;
    newAmount = it.unit === "stk" ? Math.max(1, Math.round(newAmount)) : Math.max(5, Math.round(newAmount / 5) * 5);
    return {
      name: it.name, amount: newAmount, unit: it.unit,

const LOADABLE_1RM_MAP = {
  "Power Snatch": 0.7, "Hang Snatch": 0.7, "Snatch": 0.75, "Overhead Squat": 0.65,
  "Power Clean": 0.75, "Hang Clean": 0.75, "Clean & Jerk": 0.8,
  "Front Squat": 0.72, "Back Squat": 0.72, "Deadlift": 0.72, "Sumo Deadlift": 0.72,
  "Bench Press": 0.72, "Push Press": 0.72, "Strict Press": 0.72, "Thruster": 0.65,
};

function suggestWeight(exName, oneRMMap, progressionFactors) {
  const pct = LOADABLE_1RM_MAP[exName];
  const rm = oneRMMap[exName];
  if (!pct || !rm) return null;
  const factor = (progressionFactors && progressionFactors[exName]) || 1;
  const adjustedPct = Math.max(0.5, Math.min(0.95, pct * factor));
  return Math.round(rm * adjustedPct * 2) / 2; // auf 0.5kg runden
}

function pickRandom(arr, excludeNames, availableSet, muscleSet) {
  let pool = arr.filter((it) => !excludeNames.has(it.ex));
  if (availableSet && availableSet.size > 0) {
    const equipPool = pool.filter((it) => equipmentAvailable(it.ex, availableSet));
    if (equipPool.length > 0) pool = equipPool;
  }
  if (muscleSet && muscleSet.size > 0) {
    const musclePool = pool.filter((it) => matchesMuscleGroup(it.ex, muscleSet));
    if (musclePool.length > 0) pool = musclePool;
  }
  if (pool.length === 0) return arr[Math.floor(Math.random() * arr.length)];
  return pool[Math.floor(Math.random() * pool.length)];
}

function buildBlockItems(pools, count, excludeNames, oneRMMap) {
  const items = [];
  for (let i = 0; i < count; i++) {
    const poolKey = pools[i % pools.length];
    const picked = pickRandom(WORKOUT_POOLS[poolKey], excludeNames);
    excludeNames.add(picked.ex);
    const weight = suggestWeight(picked.ex, oneRMMap);
    items.push({ exercise: picked.ex, reps: picked.reps, notes: picked.note, weightSuggestion: weight ? `≈${weight} kg` : null });
  }
  return items;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const FORMAT_BASES = ["EMOM", "AMRAP", "ROUNDS"];
function pickFormat(prevBase, minutes) {
  let base = FORMAT_BASES[Math.floor(Math.random() * FORMAT_BASES.length)];
  // Wiederholung des letzten Formats meistens vermeiden, aber nicht strikt verbieten (bleibt trotzdem natürlich variabel)
  if (base === prevBase && Math.random() < 0.75) {
    const alt = FORMAT_BASES.filter((f) => f !== prevBase);
    base = alt[Math.floor(Math.random() * alt.length)];
  }
  const label = base === "EMOM" ? `EMOM ${minutes}` : base === "AMRAP" ? `AMRAP ${minutes}` : `3 Runden auf Zeit`;
  return { base, label };
}

const REP_SCHEMES = ["4 × 6", "3 × 8", "5 × 5", "4 × 8", "3 × 10"];

// Erkennt Schemata wie "4 × 6" oder "4x6" und liefert Satzanzahl + Wiederholungen pro Satz
function parseSetsScheme(repsStr) {
  if (!repsStr) return null;
  const m = String(repsStr).match(/(\d+)\s*[×x]\s*(\d+)/i);
  if (!m) return null;
  return { numSets: parseInt(m[1]), repsPerSet: parseInt(m[2]) };
}
function extractNumericWeight(weightSuggestion) {
  if (!weightSuggestion) return "";
  const m = String(weightSuggestion).match(/([\d.,]+)/);
  return m ? m[1].replace(",", ".") : "";
}
function defaultSets(item) {
  const scheme = parseSetsScheme(item.reps);
  if (!scheme) return null;
  const w = extractNumericWeight(item.weightSuggestion);
  return Array.from({ length: scheme.numSets }, () => ({ reps: String(scheme.repsPerSet), weight: w, done: false }));
}
function renumberBlocks(blocks) {
  let idx = 0;
  return blocks.map((b) => {
    if (/^(Block|Übung)\s*\d+/.test(b.name)) {
      idx++;
      const prefix = b.name.startsWith("Übung") ? "Übung" : "Block";
      return { ...b, name: `${prefix} ${idx}` };
    }
    return b;
  });
}

function buildStrengthWorkout({ desiredList, timeCapMinutes, oneRMMap, equipment, muscleGroups, progressionFactors }) {
  const excludeNames = new Set();
  const availableSet = equipment && equipment.length > 0 ? new Set(equipment) : null;
  const muscleSet = muscleGroups && muscleGroups.length > 0 ? new Set(muscleGroups) : null;

  const fixedTime = 10; // 5 Warm-Up + 5 Cool-Down
  const remaining = Math.max(10, timeCapMinutes - fixedTime);
  const numExercises = Math.max(2, Math.min(6, Math.round(remaining / 8)));

  const warmupItems = [];
  const wuPool = WORKOUT_POOLS.warmup.slice();
  for (let i = 0; i < 4; i++) {
    const picked = pickRandom(wuPool, excludeNames, availableSet);
    excludeNames.add(picked.ex);
    warmupItems.push({ exercise: picked.ex, reps: picked.reps, notes: picked.note, weightSuggestion: null });
  }
  const blocks = [{ name: "Warm-Up", format: "Vorbereitung", minutes: 5, items: warmupItems }];

  // Übungs-Pool: eigene Angaben zuerst, danach klassische Kraft-/Oly-Übungen als Auffüllung
  const strengthPool = [...WORKOUT_POOLS.strength, ...WORKOUT_POOLS.oly];
  const queue = desiredList.slice();

  for (let i = 0; i < numExercises; i++) {
    let picked = null;
    if (queue.length > 0) {
      const wanted = queue.shift();
      const found = strengthPool.find((it) => it.ex.toLowerCase() === wanted.toLowerCase())
        || Object.values(WORKOUT_POOLS).flat().find((it) => it.ex.toLowerCase() === wanted.toLowerCase());
      picked = found && !excludeNames.has(found.ex) ? found : (!found ? { ex: wanted, reps: "", note: "Wunschübung" } : null);
    }
    if (!picked) picked = pickRandom(strengthPool, excludeNames, availableSet, muscleSet);
    excludeNames.add(picked.ex);
    const scheme = REP_SCHEMES[Math.floor(Math.random() * REP_SCHEMES.length)];
    const weight = suggestWeight(picked.ex, oneRMMap, progressionFactors);
    blocks.push({
      name: `Übung ${i + 1}`,
      format: "Straight Sets",
      minutes: Math.round(remaining / numExercises),
      items: [{ exercise: picked.ex, reps: scheme, notes: "sauber, kontrolliert — 90–120 Sek. Pause", weightSuggestion: weight ? `≈${weight} kg` : null, oneRM: oneRMMap[picked.ex] || null }],
    });
  }

  const cdItems = [];
  const cdPool = WORKOUT_POOLS.cooldown.slice();
  for (let i = 0; i < 3; i++) {
    const picked = pickRandom(cdPool, excludeNames, availableSet);
    excludeNames.add(picked.ex);
    cdItems.push({ exercise: picked.ex, reps: picked.reps, notes: picked.note, weightSuggestion: null });
  }
  blocks.push({ name: "Cool-Down", format: "Mobility", minutes: 5, items: cdItems });

  const totalMin = blocks.reduce((s, b) => s + b.minutes, 0);
  return { title: `Krafttraining · ${timeCapMinutes} Min`, timeCapMinutes, totalMin, focus: "Krafttraining", blocks };
}

function generateWorkout({ focus, desired, timeCapMinutes, oneRMMap, equipment, buildMode, muscleGroups, progressionFactors }) {
  const excludeNames = new Set();
  const desiredList = desired.split(",").map((s) => s.trim()).filter(Boolean);
  const availableSet = equipment && equipment.length > 0 ? new Set(equipment) : null;
  const muscleSet = muscleGroups && muscleGroups.length > 0 ? new Set(muscleGroups) : null;
  const listMode = buildMode === "list" && desiredList.length > 0;

  if (buildMode === "strength") {
    return buildStrengthWorkout({ desiredList, timeCapMinutes, oneRMMap, equipment, muscleGroups, progressionFactors });
  }

  // Zeitbudget: Warm-Up + Cool-Down fix, Rest auf Hauptblöcke + evtl. Finisher verteilen
  const fixedTime = 10; // 5 Warm-Up + 5 Cool-Down
  const remaining = Math.max(10, timeCapMinutes - fixedTime);
  const includeFinisher = remaining >= 20;
  const mainBudget = includeFinisher ? remaining - 6 : remaining;
  const numBlocks = mainBudget <= 16 ? 2 : mainBudget <= 28 ? 3 : mainBudget <= 40 ? 4 : 5;
  const perBlockMin = Math.max(8, Math.round(mainBudget / numBlocks));

  // Warm-Up (immer aus dem Pool, unabhängig vom Modus — Mobilisation bleibt sinnvoll)
  const warmupItems = [];
  const wuPool = WORKOUT_POOLS.warmup.slice();
  for (let i = 0; i < 4; i++) {
    const picked = pickRandom(wuPool, excludeNames, availableSet);
    excludeNames.add(picked.ex);
    warmupItems.push({ exercise: picked.ex, reps: picked.reps, notes: picked.note, weightSuggestion: null });
  }

  // Block-Poolschema je nach Fokus (nur im Fokus-Modus relevant)
  const focusSchemes = {
    "Ganzkörper": [["oly", "strength", "gymnastics"], ["kettlebell", "gymnastics", "coregrip"], ["strength", "coregrip", "kettlebell"], ["oly", "gymnastics", "coregrip"]],
    "Oberkörper": [["strength", "gymnastics", "gymnastics"], ["gymnastics", "strength", "coregrip"], ["oly", "gymnastics", "strength"], ["gymnastics", "coregrip", "strength"]],
    "Unterkörper": [["strength", "kettlebell", "coregrip"], ["oly", "strength", "kettlebell"], ["kettlebell", "strength", "coregrip"], ["strength", "coregrip", "kettlebell"]],
    "Engine/Conditioning": [["kettlebell", "gymnastics", "coregrip"], ["strength", "kettlebell", "gymnastics"], ["coregrip", "kettlebell", "gymnastics"], ["gymnastics", "kettlebell", "coregrip"]],
    "Oly Technik": [["oly", "oly", "strength"], ["oly", "strength", "gymnastics"], ["oly", "kettlebell", "coregrip"], ["oly", "strength", "coregrip"]],
    "Grip/Core": [["coregrip", "kettlebell", "gymnastics"], ["kettlebell", "coregrip", "strength"], ["coregrip", "strength", "kettlebell"], ["coregrip", "gymnastics", "kettlebell"]],
  };
  const scheme = focusSchemes[focus] || focusSchemes["Ganzkörper"];

  const blocks = [{ name: "Warm-Up", format: "Vorbereitung", minutes: 5, items: warmupItems }];

  if (listMode) {
    // Listen-Modus: Blöcke werden direkt und ausschließlich aus den angegebenen Übungen zyklisch aufgebaut,
    // Reihenfolge der Übungen wird pro Generierung gemischt, damit nicht immer dieselbe Übung Block 1 eröffnet
    const shuffledList = shuffle(desiredList);
    let cursor = 0;
    let prevFormatBase = null;
    for (let b = 0; b < numBlocks; b++) {
      const items = [];
      const itemCount = Math.min(3, shuffledList.length);
      for (let i = 0; i < itemCount; i++) {
        const wanted = shuffledList[cursor % shuffledList.length];
        cursor++;
        const found = Object.values(WORKOUT_POOLS).flat().find((it) => it.ex.toLowerCase() === wanted.toLowerCase());
        const picked = found ? found : { ex: wanted, reps: "8-10", note: "aus deiner Liste" };
        const weight = suggestWeight(picked.ex, oneRMMap, progressionFactors);
        items.push({ exercise: picked.ex, reps: picked.reps, notes: picked.note, weightSuggestion: weight ? `≈${weight} kg` : null, oneRM: oneRMMap[picked.ex] || null });
      }
      const fmt = pickFormat(prevFormatBase, perBlockMin);
      prevFormatBase = fmt.base;
      blocks.push({ name: `Block ${b + 1}`, format: fmt.label, minutes: perBlockMin, items });
    }
  } else {
    // Wunschübungen zufällig auf freie Plätze über alle Hauptblöcke verteilen (nicht mehr fest in Block 1)
    const totalSlots = numBlocks * 3;
    const slotOrder = shuffle(Array.from({ length: totalSlots }, (_, idx) => idx));
    const desiredAssignment = {}; // slotIndex -> Übungsname
    desiredList.slice(0, totalSlots).forEach((name, i) => { desiredAssignment[slotOrder[i]] = name; });

    let prevFormatBase = null;
    for (let b = 0; b < numBlocks; b++) {
      // Pool-Schema pro Block zufällig aus dem Fokus-Schema wählen statt fest nach Blockindex
      const pools = scheme[Math.floor(Math.random() * scheme.length)];
      const itemCount = 3;
      const items = [];
      for (let i = 0; i < itemCount; i++) {
        const slotIndex = b * 3 + i;
        const wanted = desiredAssignment[slotIndex];
        let picked = null;
        if (wanted) {
          const found = Object.values(WORKOUT_POOLS).flat().find((it) => it.ex.toLowerCase() === wanted.toLowerCase());
          if (found && !excludeNames.has(found.ex)) picked = found;
          else if (!found) picked = { ex: wanted, reps: "8-10", note: "Wunschübung" };
        }
        if (!picked) {
          const poolKey = pools[i % pools.length];
          picked = pickRandom(WORKOUT_POOLS[poolKey], excludeNames, availableSet, muscleSet);
        }
        excludeNames.add(picked.ex);
        const weight = suggestWeight(picked.ex, oneRMMap, progressionFactors);
        items.push({ exercise: picked.ex, reps: picked.reps, notes: picked.note, weightSuggestion: weight ? `≈${weight} kg` : null, oneRM: oneRMMap[picked.ex] || null });
      }
      const fmt = pickFormat(prevFormatBase, perBlockMin);
      prevFormatBase = fmt.base;
      blocks.push({ name: `Block ${b + 1}`, format: fmt.label, minutes: perBlockMin, items });
    }
  }

  if (includeFinisher) {
    const finItems = [];
    const finPool = WORKOUT_POOLS.finisher.slice();
    for (let i = 0; i < 3; i++) {
      const picked = pickRandom(finPool, excludeNames, availableSet);
      excludeNames.add(picked.ex);
      finItems.push({ exercise: picked.ex, reps: picked.reps, notes: picked.note, weightSuggestion: null });
    }
    blocks.push({ name: "Finisher", format: "Straight Sets", minutes: 6, items: finItems });
  }

  const cdItems = [];
  const cdPool = WORKOUT_POOLS.cooldown.slice();
  for (let i = 0; i < 3; i++) {
    const picked = pickRandom(cdPool, excludeNames);
    excludeNames.add(picked.ex);
    cdItems.push({ exercise: picked.ex, reps: picked.reps, notes: picked.note, weightSuggestion: null });
  }
  blocks.push({ name: "Cool-Down", format: "Mobility", minutes: 5, items: cdItems });

  const totalMin = blocks.reduce((s, b) => s + b.minutes, 0);
  return {
    title: `${focus} · ${timeCapMinutes} Min`,
    timeCapMinutes,
    totalMin,
    focus,
    blocks,
  };
}
const FOCUS_MULTIPLIER = { "Bergintervalle": 1.2, "Ausdauer": 1.05 };

function estimateTrainingBurn(entries) {
  return entries.reduce((sum, e) => sum + partsOf(e).reduce((s, p) => {
    const rate = WORKOUT_RATES[p.type] ?? 7;
    const mult = FOCUS_MULTIPLIER[p.focus || e.focus] ?? 1;
    return s + (p.duration || 0) * rate * mult;
  }, 0), 0);
}

function localDateStr(dt) {
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, "0");
  const d = String(dt.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}
const todayStr = () => localDateStr(new Date());
const fmtDate = (d) => new Date(d + "T00:00:00").toLocaleDateString("de-DE", { weekday: "long", day: "2-digit", month: "long" });
const addDays = (d, n) => { const dt = new Date(d + "T00:00:00"); dt.setDate(dt.getDate() + n); return localDateStr(dt); };
function weekDates(d) {
  const dt = new Date(d + "T00:00:00");
  const day = dt.getDay();
  const diffToMonday = day === 0 ? -6 : 1 - day;
  const monday = new Date(dt);
  monday.setDate(dt.getDate() + diffToMonday);
  const dates = [];
  for (let i = 0; i < 7; i++) { const d2 = new Date(monday); d2.setDate(monday.getDate() + i); dates.push(localDateStr(d2)); }
  return dates;
}
function monthDates(d) {
  const dt = new Date(d + "T00:00:00");
  const year = dt.getFullYear(), month = dt.getMonth();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const dates = [];
  for (let i = 1; i <= daysInMonth; i++) dates.push(localDateStr(new Date(year, month, i)));
  return dates;
}
const shiftWeek = (d, n) => addDays(d, n * 7);
const shiftMonth = (d, n) => { const dt = new Date(d + "T00:00:00"); const nd = new Date(dt.getFullYear(), dt.getMonth() + n, 1); return localDateStr(nd); };

function msProgress(ms, entries, latestWeight) {
  const since = ms.since || HOME_PLAN_START;
  const es = entries.filter((e) => e.date >= since);
  let cur = 0, pct = 0;
  if (ms.kind === "run_single") cur = Math.max(0, ...es.filter((e) => e.type === "Laufen").map((e) => e.distance || 0));
  else if (ms.kind === "bike_single") cur = Math.max(0, ...es.filter((e) => BIKE_TYPES.includes(e.type)).map((e) => e.distance || 0));
  else if (ms.kind === "run_total") cur = es.filter((e) => e.type === "Laufen").reduce((s, e) => s + (e.distance || 0), 0);
  else if (ms.kind === "bike_total") cur = es.filter((e) => BIKE_TYPES.includes(e.type)).reduce((s, e) => s + (e.distance || 0), 0);
  else if (ms.kind === "sessions_total") cur = new Set(es.map((e) => e.date)).size;
  else if (ms.kind === "weight") {
    cur = latestWeight || ms.start || 0;
    const st = ms.start || cur;
    pct = st === ms.target ? 1 : Math.max(0, Math.min(1, (cur - st) / (ms.target - st)));
    return { cur: round1(cur), pct, done: pct >= 1 };
  } else if (ms.kind === "manual") return { cur: ms.done ? 1 : 0, pct: ms.done ? 1 : 0, done: !!ms.done };
  cur = round1(cur);
  pct = Math.max(0, Math.min(1, cur / ms.target));
  return { cur, pct, done: cur >= ms.target };
}

const RUN2 = { title: "Lauf + Steigerungen", type: "Laufen", focus: "Ausdauer", min: 30, distance: 5, detail: ["20–25 Min locker (Zone 2)", "6× 20 Sek Steigerung (Sprint-Technik), 60 Sek Trab dazwischen"], why: "Zweiter Lauf pro Woche: mehr Lauffrequenz und Technik, ohne viel Belastung." };
const SPRINTS = { title: "Sprints + Bergsprints", type: "Laufen", focus: "Sprint", min: 40, distance: 6, detail: ["10 Min einlaufen, Lauf-ABC", "6× 10 Sek Bergsprint (steil), Gehpause zurück", "4× 20 Sek Flachsprint, 90 Sek Pause", "5 Min auslaufen"], why: "Schnelligkeit und Antritte für die kurzen harten Abschnitte im Rennen." };
const BERGLAUF = { title: "Berglauf (Gelände)", type: "Laufen", focus: "Bergintervalle", min: 50, distance: 7, detail: ["15 Min einlaufen", "6–8× 2 Min bergauf zügig (RPE 8), Trab zurück", "10 Min auslaufen"], why: "Kulmbach ist hügelig: Bergkraft und Trittsicherheit im Gelände." };
const STADION = { title: "Stadion: Hindernis-Zirkel", type: "Eigengewicht", focus: "Ganzkörper", min: 60, detail: ["10 Min einlaufen und mobilisieren", "Hangeln: 5 Durchgänge, Griffwechsel sauber", "Klimmzüge 5× knapp vor Versagen", "Zwischenläufe: 4× 400 m zügig zwischen den Stationen", "Tragen (Sandbag oder Kanister) 4× 40 m", "Burpee-Finisher 5 Min"], why: "Hindernis-Technik und Grip unter Ermüdung, dazu Lauf zwischen den Stationen." };
function adaptRun(base, dow, phase, cyc, ctx) {
  const lvl = ctx.runLevel || 1;
  if (lvl < 2 || ["taper", "woche"].includes(phase.key)) return base;
  if (dow === "Di") return lvl >= 3 ? SPRINTS : RUN2;
  if (lvl >= 3 && dow === "Mi" && /Intervalle/.test(base.title || "")) return { title: "Cycling Grundlage (Zone 2)", type: "Indoor Cycling", focus: "Ausdauer", min: 45, detail: ["Zone 2, gleichmäßig, Beine locker halten"], why: "Nach den Sprints gestern keine zweite harte Einheit." };
  if (lvl >= 3 && dow === "Fr" && cyc % 2 === 0 && cyc !== 3) return BERGLAUF;
  if (lvl >= 3 && dow === "So" && (phase.key === "renn" || cyc % 2 === 0)) return STADION;
  return base;
}
function coachSession(date, ctx) {
  const dow = WEEKDAY_LABELS[new Date(date + "T00:00:00").getDay()];
  const R = ctx.raceDate;
  if (date >= R && date <= addDays(R, 2)) return { rest: false, race: true, title: "Rennwochenende", type: "Sonstiges", focus: "Ausdauer", min: 0, detail: ["Das ist dein Moment. Trag die Läufe nachher ein."], why: "Alles Training dafür." };
  if (date > addDays(R, 2)) return { rest: true, title: "Erholung nach dem Rennen", min: 0, detail: ["Locker bewegen, gut essen"], why: "Gönn dir die Pause." };
  const phase = phaseAtDate(date, ctx.phases);
  const { cyc } = blockIndex(date);
  const base = adaptRun((COACH_PLAN[phase.key] || COACH_PLAN.aufbau)[dow], dow, phase, cyc, ctx);
  const f = ["taper", "woche"].includes(phase.key) ? 1 : BLOCK_FACTOR[cyc];
  const out = { ...base, detail: [...(base.detail || [])], phase: phase.key, cyc };
  if (base.lr) {
    const L = ctx.longestRun || 5;
    let d;
    if (phase.key === "taper") d = L * 0.6;
    else if (cyc === 3) d = L * 0.7;
    else d = Math.min(L * 1.1, L + 3);
    if (ctx.runCap && L < ctx.runCap) d = Math.min(d, ctx.runCap);
    const rr = ctx.recordRun;
    const ll = ctx.lastLong;
    const useFb = !!(ll && ll.feel && date > ll.date && date <= addDays(ll.date, 10) && phase.key !== "taper");
    const afterRecord = !useFb && !!(rr && date > rr.date && date <= addDays(rr.date, 9) && cyc !== 3);
    let fbWhy = "", fbPain = false;
    if (useFb) {
      let feel = ll.feel;
      if (feel === "super" && ll.hr && ctx.z2 && ll.hr > ctx.z2[1] + 5) feel = "good";
      let m = { super: 1.1, good: 1.05, ok: 1, tough: 0.72, pain: 0.5 }[feel] || 1;
      const jump = ll.prev > 0 && ll.km > ll.prev * 1.15;
      if (jump && (feel === "super" || feel === "good")) m = 1;
      d = ll.km * m;
      if (cyc === 3) d = Math.min(d, ll.km * 0.7);
      if (ctx.runCap && ll.km < ctx.runCap) d = Math.min(d, ctx.runCap);
      fbPain = feel === "pain";
      const nm = { super: "super", good: "gut", ok: "anstrengend, aber ok", tough: "zäh", pain: "mit Schmerzen verbunden" }[feel];
      fbWhy = `Dein Lauf (${ll.km} km) war ${nm}` + (ll.feel === "super" && feel === "good" ? " (aber der Puls lag über Zone 2)" : "") + (m === 1 && jump && ll.feel !== "ok" ? " und der Sprung zum vorherigen Rekord war groß, deshalb bleibst du bei der Distanz." : m > 1 ? ", deshalb wächst die Distanz um " + Math.round((m - 1) * 100) + " %." : m < 1 ? ", deshalb diese Woche kürzer (" + Math.round(m * 100) + " %)." : ", deshalb bleibt die Distanz gleich.");
    } else if (afterRecord) d = rr.km * 0.7;
    d = Math.max(3, Math.round(d * 2) / 2);
    out.distance = d;
    out.min = Math.max(20, Math.round((d * 6.5) / 5) * 5);
    out.detail = [`${d} km locker in Zone 2`, "Kein Tempo, Zeit auf den Beinen zählt", ...(phase.key === "renn" ? ["Wenn möglich im Gelände, Höhenmeter sammeln"] : [])];
    if (fbPain) out.detail.unshift("Nur laufen, wenn du schmerzfrei bist. Sonst Rad oder Pause und bei Schmerzen über 2–3 Tage abklären lassen.");
    if (ctx.runMs) out.detail.push(`Ziel dahinter: ${ctx.runMs.title} (${ctx.runMs.target} km)`);
    out.why = useFb ? fbWhy : afterRecord ? `Nach deinem Rekordlauf (${rr.km} km) eine kürzere Woche: Sehnen und Gelenke brauchen länger als dein Herz, um sich anzupassen.` : cyc === 3 ? "Entlastungswoche: kürzer, damit dein Körper sich anpasst." : "Der Wochenlauf wächst um etwa 10 %, das ist sicher und stetig.";
  } else if (!base.rest) {
    out.min = Math.max(20, Math.round((base.min * f) / 5) * 5);
    if (cyc === 3 && !["taper", "woche"].includes(phase.key)) out.detail.unshift("Entlastungswoche: Gewichte bei ca. 80 %, nichts bis zum Versagen");
  }
  if (base.bikeBonus && !["taper", "woche"].includes(phase.key)) {
    const B = ctx.longestRide || 30;
    let km = cyc === 3 ? B * 0.7 : Math.min(B * 1.15, B + 20);
    if (ctx.bikeCap && B < ctx.bikeCap) km = Math.min(km, ctx.bikeCap);
    km = Math.max(20, Math.round(km / 5) * 5);
    out.detail.push(`Optional an Sa oder So: Rennrad ca. ${km} km locker`);
  }
  if (ctx.z2 && !out.rest && (/Zone 2/.test(out.title) || out.lr)) out.detail.unshift(`Ziel-Puls${BIKE_TYPES.includes(out.type) ? " Rad" : ""}: ${(BIKE_TYPES.includes(out.type) && ctx.z2Bike ? ctx.z2Bike : ctx.z2)[0]}–${(BIKE_TYPES.includes(out.type) && ctx.z2Bike ? ctx.z2Bike : ctx.z2)[1]} bpm${ctx.z2est ? " (geschätzt, Pulszonen unter Mehr einstellen)" : ""}`);
  out.hard = !out.rest && (/Intervalle|Berg|Sprint|Stadion|Unterkörper|Gelände/.test(out.title || "") || !!out.lr);
  out.key = !out.rest && !/optional|Grundlage|locker/i.test(out.title || "");
  return out;
}

const CHECKIN_SCALES = {
  hunger: { label: "Hunger", opts: ["ständig hungrig", "eher hungrig", "passt", "eher satt", "zu satt"] },
  energy: { label: "Energie im Alltag", opts: ["platt", "müde", "ok", "gut", "top"] },
  perf: { label: "Leistung im Training", opts: ["schwach", "unter Form", "normal", "stark", "Bestform"] },
  sleep: { label: "Schlaf", opts: ["schlecht", "unruhig", "ok", "gut", "sehr gut"] },
};

function calorieAdvice({ base, adherence, nLogged, fb, goalKind }) {
  const reasons = [];
  if (nLogged < 4) return { delta: 0, headline: "Zu wenige geloggte Tage", reasons: ["Logge mindestens 4 Tage pro Woche, damit ich belastbar rechnen kann."] };
  if (adherence < 0.9) return { delta: 0, headline: "Erst das Ziel treffen", reasons: [`Du isst im Schnitt ${Math.round(adherence * 100)} % deines Tagesziels. Dann sagt der Gewichtstrend nichts darüber, ob das Ziel passt. Komm erst näher ran, zum Beispiel mit einem zusätzlichen Snack.`] };
  const lowFuel = (fb.energy <= 2 ? 1 : 0) + (fb.perf <= 2 ? 1 : 0);
  let delta = 0;
  if (base.status === "insufficient") {
    if (lowFuel >= 1 && goalKind !== "cut") { delta = 100; reasons.push("Noch kein Gewichtstrend, aber Energie oder Leistung sind schwach: +100 kcal als Test."); }
    else reasons.push("Noch kein belastbarer Gewichtstrend (mindestens 2 Wiegungen über 10 Tage). Gefühl ist okay, Ziel beibehalten.");
  } else {
    delta = base.deltaKcal || 0;
    reasons.push(`${base.reason} (Trend ${base.weeklyRate > 0 ? "+" : ""}${base.weeklyRate} kg/Woche).`);
  }
  if (delta < 0 && lowFuel >= 1 && goalKind !== "cut") { delta = 0; reasons.push("Energie oder Leistung sind schwach: nicht kürzen, auch wenn das Gewicht etwas schnell steigt."); }
  if (delta === 0 && lowFuel >= 2 && goalKind !== "cut") { delta = 100; reasons.push("Energie und Leistung sind beide schwach: +100 kcal, vor allem Kohlenhydrate rund ums Training."); }
  if (goalKind === "cut" && lowFuel >= 2) {
    if (delta < 0) delta = 0;
    reasons.push("Im Defizit sind Energie und Leistung beide eingebrochen: Defizit nicht vergrößern. Hält das zwei Wochen an, plane eine Woche auf Erhaltungsniveau.");
  }
  if (fb.hunger <= 2 && goalKind !== "cut" && delta <= 0) { delta = 100; reasons.push("Du hast Hunger, obwohl du aufbaust: +100 kcal."); }
  if (fb.hunger <= 2 && goalKind === "cut") reasons.push("Hunger im Defizit ist normal. Mehr Volumen (Gemüse, Skyr, Hüttenkäse) und Protein halten, ohne Kalorien zu erhöhen.");
  if (fb.hunger >= 5 && delta > 0) { delta = 0; reasons.push("Du bist zu satt: lieber kalorienreichere Lebensmittel (Nüsse, Öl, Reis) statt mehr Volumen. Ziel erstmal halten."); }
  if (fb.sleep <= 2) reasons.push("Schlechter Schlaf verzerrt Hunger und Gewicht (Wasser). Reagiere nicht über.");
  delta = Math.max(-200, Math.min(200, delta));
  const headline = delta > 0 ? `Mehr essen: +${delta} kcal` : delta < 0 ? `Etwas weniger: ${delta} kcal` : "Kalorienziel beibehalten";
  return { delta, headline, reasons };
}

function CalorieCheckin({ data, targets, setTargets, nutritionGoal, phaseKey, today }) {
  const monday = weekDates(today)[0];
  const [fb, setFb] = useState({ hunger: 3, energy: 3, perf: 3, sleep: 3, note: "" });
  const [saved, setSaved] = useState(false);
  const [editing, setEditing] = useState(false);
  const [history, setHistory] = useState([]);
  const [lastChange, setLastChange] = useState(null);
  const [applied, setApplied] = useState(false);

  useEffect(() => {
    (async () => {
      try { const r = await window.storage.get(`checkin:${monday}`, false); if (r && r.value) { setFb(JSON.parse(r.value)); setSaved(true); } } catch (e) {}
      try { const r = await window.storage.get("lastCalorieChange", false); if (r && r.value) setLastChange(JSON.parse(r.value)); } catch (e) {}
      try {
        const l = await window.storage.list("checkin:", false);
        const ks = ((l && l.keys) || []).sort().slice(-6);
        const items = [];
        for (const k of ks) { try { const r = await window.storage.get(k, false); if (r && r.value) items.push({ week: k.slice("checkin:".length), ...JSON.parse(r.value) }); } catch (e) {} }
        setHistory(items);
      } catch (e) {}
    })();
  }, []);

  const get = (d) => data[d] || { train: [], kcal: 0, logged: false, weight: null };
  const dayTarget = (d) => Math.round(targets.baseKcal + estimateTrainingBurn(get(d).train) * targets.trainingFactor);
  const last7 = []; for (let i = 6; i >= 0; i--) last7.push(addDays(today, -i));
  const logged7 = last7.filter((d) => get(d).logged);
  const avgIntake = logged7.length ? Math.round(logged7.reduce((s, d) => s + get(d).kcal, 0) / logged7.length) : 0;
  const avgTarget = logged7.length ? Math.round(logged7.reduce((s, d) => s + dayTarget(d), 0) / logged7.length) : targets.baseKcal;
  const adherence = avgTarget ? avgIntake / avgTarget : 0;
  const weightsRecent = Object.keys(data).filter((d) => d <= today && d >= addDays(today, -28) && get(d).weight).sort().map((d) => ({ date: d, weight: get(d).weight }));
  const goalKind = nutritionGoal.includes("Fettabbau") ? "cut" : nutritionGoal.includes("Muskelaufbau") ? "build" : nutritionGoal ? "maintain" : (phaseKey === "definition" ? "cut" : phaseKey === "aufbau" ? "build" : "maintain");
  const goalText = goalKind === "cut" ? "Fettabbau" : goalKind === "build" ? "Muskelaufbau" : "Erhalt";
  const base = computeCalorieSuggestion(weightsRecent, goalText);
  const advice = calorieAdvice({ base, adherence, nLogged: logged7.length, fb, goalKind });
  const kcalMax = Math.max(1, ...last7.map((d) => Math.max(get(d).kcal, dayTarget(d))));
  const weekAvgs = [];
  for (let w = 3; w >= 0; w--) {
    const ds = weekDates(addDays(today, -7 * w)).filter((d) => d <= today && get(d).logged);
    weekAvgs.push({ label: w === 0 ? "diese" : `vor ${w}`, avg: ds.length ? Math.round(ds.reduce((s, d) => s + get(d).kcal, 0) / ds.length) : null });
  }
  const bal = targets.maintenanceKcal && avgIntake ? avgIntake - targets.maintenanceKcal : null;

  const persistTargets = async (nextBase, change) => {
    try {
      const r = await window.storage.get("targets", false);
      const cur = r && r.value ? JSON.parse(r.value) : { baseKcal: targets.baseKcal, protein: targets.protein, trainingFactor: targets.trainingFactor };
      await window.storage.set("targets", JSON.stringify({ ...cur, baseKcal: nextBase }), false);
      if (change) await window.storage.set("lastCalorieChange", JSON.stringify(change), false); else await window.storage.delete("lastCalorieChange", false);
    } catch (e) {}
    setTargets((t) => ({ ...t, baseKcal: nextBase }));
  };
  const save = async () => {
    const rec = { ...fb, savedAt: today, avgIntake, avgTarget, weeklyRate: base.weeklyRate ?? null, delta: advice.delta };
    try { await window.storage.set(`checkin:${monday}`, JSON.stringify(rec), false); } catch (e) {}
    setSaved(true); setEditing(false);
    setHistory((h) => [...h.filter((x) => x.week !== monday), { week: monday, ...rec }].sort((a, b) => a.week.localeCompare(b.week)).slice(-6));
  };
  const apply = async () => {
    const change = { previousBaseKcal: targets.baseKcal, deltaKcal: advice.delta, appliedAt: today };
    await persistTargets(Math.round(targets.baseKcal + advice.delta), change);
    setLastChange(change); setApplied(true);
  };
  const undo = async () => {
    if (!lastChange) return;
    await persistTargets(lastChange.previousBaseKcal, null);
    setLastChange(null); setApplied(false);
  };
  const showForm = !saved || editing;

  return (
    <div className="bg-[#1B2022] rounded-2xl p-4 border border-[#262C2E]">
      <div className="font-display text-xl tracking-wide mb-1">KALORIEN-CHECK</div>
      <div className="font-body text-xs text-[#8A9296] mb-3">Einmal pro Woche (am besten Sonntag): dein Gefühl plus Gewicht und Zahlen ergeben eine Empfehlung für dein Kalorienziel.</div>

      <div className="flex items-end gap-1.5 h-16">
        {last7.map((d) => {
          const k = get(d).kcal, t = dayTarget(d);
          return (
            <div key={d} className="flex-1 flex flex-col items-center justify-end h-full">
              <div className="w-full relative flex items-end" style={{ height: "100%" }}>
                <div className="w-full rounded" style={{ height: Math.max(3, (k / kcalMax) * 100) + "%", background: !get(d).logged ? "#262C2E" : Math.abs(k - t) <= t * 0.1 ? "#4E9E8F" : "#C4703B" }} />
                <div className="absolute left-0 right-0 border-t border-dashed border-[#E9E4DA]/60" style={{ bottom: (t / kcalMax) * 100 + "%" }} />
              </div>
            </div>
          );
        })}
      </div>
      <div className="flex justify-between font-mono text-[10px] text-[#5F6668] mt-1"><span>vor 6 Tagen</span><span>gestrichelt = Tagesziel</span><span>heute</span></div>
      <div className="grid grid-cols-3 gap-2 mt-3">
        <div className="rounded-xl bg-[#14181A] border border-[#262C2E] p-2 text-center"><div className="font-display text-xl text-[#E0925C]">{avgIntake || "–"}</div><div className="font-mono text-[9px] text-[#8A9296]">Ø gegessen</div></div>
        <div className="rounded-xl bg-[#14181A] border border-[#262C2E] p-2 text-center"><div className="font-display text-xl text-[#E9E4DA]">{avgTarget}</div><div className="font-mono text-[9px] text-[#8A9296]">Ø Ziel</div></div>
        <div className="rounded-xl bg-[#14181A] border border-[#262C2E] p-2 text-center"><div className="font-display text-xl" style={{ color: bal === null ? "#5F6668" : bal >= 0 ? "#4E9E8F" : "#C46B6B" }}>{bal === null ? "–" : (bal > 0 ? "+" : "") + bal}</div><div className="font-mono text-[9px] text-[#8A9296]">{bal === null ? "Erhalt unbekannt" : "zum Erhalt"}</div></div>
      </div>
      <div className="font-mono text-[10px] text-[#8A9296] mt-2">Wochen-Ø: {weekAvgs.map((w) => `${w.label} ${w.avg ?? "–"}`).join(" · ")} kcal</div>
      <div className="font-mono text-[10px] text-[#5F6668] mt-0.5">Basis aktuell {targets.baseKcal} kcal · Ziel: {goalText}{base.weeklyRate !== undefined ? ` · Trend ${base.weeklyRate > 0 ? "+" : ""}${base.weeklyRate} kg/Woche` : ""}</div>

      <div className="border-t border-[#262C2E] mt-3 pt-3">
        {showForm ? (
          <>
            <div className="font-body text-sm text-[#E9E4DA] mb-2">Wie war deine Woche?</div>
            {Object.keys(CHECKIN_SCALES).map((k) => (
              <div key={k} className="mb-2.5">
                <div className="flex justify-between font-mono text-[10px] text-[#8A9296] mb-1"><span>{CHECKIN_SCALES[k].label}</span><span>{CHECKIN_SCALES[k].opts[fb[k] - 1]}</span></div>
                <div className="flex gap-1.5">
                  {[1, 2, 3, 4, 5].map((n) => (
                    <button key={n} onClick={() => setFb({ ...fb, [k]: n })} className="flex-1 py-2 rounded-lg font-mono text-sm border" style={{ background: fb[k] === n ? "#C4703B" : "#14181A", color: fb[k] === n ? "#14181A" : "#8A9296", borderColor: fb[k] === n ? "#C4703B" : "#262C2E" }}>{n}</button>
                  ))}
                </div>

    ? `Stufe 1 von 3: ein Lauf pro Woche. Stufe 2 (zweiter Lauf mit Steigerungen) startet, sobald dein längster Lauf mindestens 8 km hat (aktuell ${round1(longestRun)} km) und du in 28 Tagen mindestens 3 Läufe gemacht hast (aktuell ${runs28}).`
    : runLevel === 2
    ? `Stufe 2 von 3: zwei Läufe pro Woche. Stufe 3 (Sprints, Berglauf im Gelände, Stadion-Hindernistraining) startet bei einem längsten Lauf von mindestens 10 km (aktuell ${round1(longestRun)} km) und mindestens 6 Läufen in 28 Tagen (aktuell ${runs28}).`
    : "Stufe 3 von 3: zwei Läufe pro Woche, dazu Sprints, Berglauf im Gelände und Stadion-Hindernistraining im Wechsel.";
  const doSwap = async (a, b) => {
    const wk = weekDates(a); const mon = wk[0];
    const cur = swaps[mon] || [0, 1, 2, 3, 4, 5, 6];
    const ia = wk.indexOf(a), ib = wk.indexOf(b);
    const nx = [...cur]; [nx[ia], nx[ib]] = [nx[ib], nx[ia]];
    setSwaps({ ...swaps, [mon]: nx });
    try { await window.storage.set(`weekSwap:${mon}`, JSON.stringify(nx), false); } catch (e) {}
    const moved = [sess(a), sess(b)].filter((x) => x && x.key).map((x) => ({ t: x.title, d: today }));
    if (moved.length) { const nl = [...moveLog, ...moved].slice(-40); setMoveLog(nl); try { await window.storage.set("moveLog", JSON.stringify(nl), false); } catch (e) {} }
    setSwapSheet(null);
    showToast("Tage getauscht");
  };
  const resetSwap = async (d) => {
    const mon = weekDates(d)[0]; const id = [0, 1, 2, 3, 4, 5, 6];
    setSwaps({ ...swaps, [mon]: id });
    try { await window.storage.set(`weekSwap:${mon}`, JSON.stringify(id), false); } catch (e) {}
    setSwapSheet(null);
    showToast("Wochenplan zurückgesetzt");
  };
  const quickLog = async (s) => {
    const entry = { id: uid(), type: s.type, focus: s.focus, duration: s.min, notes: "Coach: " + s.title, distance: s.distance || null };
    try {
      const r = await window.storage.get(`training:${today}`, false);
      const ex = r && r.value ? JSON.parse(r.value) : [];
      await window.storage.set(`training:${today}`, JSON.stringify([...ex, entry]), false);
    } catch (e) {}
    setData((prev) => { const c = prev[today] || { train: [], kcal: 0, protein: 0, logged: false, weight: null }; return { ...prev, [today]: { ...c, train: [...c.train, entry] } }; });
    setAllEntries((p) => [...p, { date: today, type: entry.type, duration: entry.duration, distance: entry.distance || 0 }]);
    showToast("Einheit eingetragen. Gut gemacht!");
  };
  const addMs = async () => {
    const t = parseFloat(String(msForm.target).replace(",", "."));
    const k = MS_KINDS[msForm.kind];
    if (msForm.kind !== "manual" && !(t > 0)) return;
    const title = msForm.title.trim() || (msForm.kind === "manual" ? "Eigenes Ziel" : `${k.label} ${t} ${k.unit}`);
    const item = { id: uid(), kind: msForm.kind, title, target: msForm.kind === "manual" ? 1 : t, deadline: msForm.deadline || null, since: today };
    if (msForm.kind === "weight") item.start = wLast ? wLast.w : t;
    await persistMs([...milestones, item]);
    setMsSheet(false);
    setMsForm({ kind: "run_single", title: "", target: "", deadline: "" });
  };

  return (
    <div className="px-5 pt-5 pb-24 space-y-4">
      <Toast message={toast} />
      {/* Trainer */}
      <div className="bg-[#1B2022] rounded-2xl p-4 border" style={{ borderColor: curPhase.color + "88" }}>
        <div className="flex items-center justify-between mb-1">
          <div className="font-display text-xl tracking-wide">DEIN TRAINER</div>
          <div className="flex items-center gap-3"><button onClick={() => setShowZones(true)} className="font-mono text-[10px] text-[#7A8FC4] underline">❤ Pulszonen</button><div className="font-mono text-[10px] text-[#8A9296]">Woche {blk.weekNo + 1}</div></div>
        </div>
        <div className="flex items-center gap-1.5 mb-1">
          {[0, 1, 2, 3].map((i) => (<div key={i} className="h-1.5 flex-1 rounded-full" style={{ background: i < blk.cyc ? "#4E9E8F" : i === blk.cyc ? (blk.cyc === 3 ? "#7A8FC4" : "#C4703B") : "#262C2E" }} />))}
        </div>
        <div className="font-mono text-[11px] text-[#8A9296] mb-3">Block-Woche {blk.cyc + 1} von 4: {BLOCK_LABELS[blk.cyc]}</div>

        <div className="rounded-xl bg-[#14181A] border border-[#262C2E] p-3 mb-3">
          <div className="font-mono text-[10px] text-[#8A9296] mb-1">DEIN AUFTRAG HEUTE</div>
          {todayData.train.length > 0 ? (
            <div className="font-body text-sm text-[#4E9E8F]">✓ Erledigt: {todayData.train.map((e) => `${TYPE_ICON[e.type] || ""} ${entryTitle(e)} ${e.duration} Min`).join(", ")}. Jetzt essen, trinken, regenerieren.</div>
          ) : todayPlan.rest ? (
            <>
              <div className="font-body text-sm text-[#E9E4DA]">😴 {todayPlan.title}</div>
              {todayPlan.detail.map((t) => <div key={t} className="font-body text-xs text-[#8A9296]">• {t}</div>)}
              <div className="font-body text-xs text-[#E0925C] mt-1">{todayPlan.why}</div>
            </>
          ) : (
            <>
              <div className="font-body text-base text-[#E9E4DA]">{TYPE_ICON[todayPlan.type] || "⚡"} {todayPlan.title} · {todayPlan.min ? todayPlan.min + " Min" : ""}{todayPlan.distance ? ` · ${todayPlan.distance} km` : ""}</div>
              <div className="mt-1.5 space-y-0.5">{todayPlan.detail.map((t) => <div key={t} className="font-body text-xs text-[#8A9296]">• {t}</div>)}</div>
              <div className="font-body text-xs text-[#E0925C] mt-2">Warum: {todayPlan.why}</div>
              <div className="flex gap-2 mt-3">
                {!todayPlan.race && <button onClick={() => quickLog(todayPlan)} className="flex-1 bg-[#4E9E8F] text-[#14181A] rounded-lg py-2.5 font-body font-semibold text-sm">✓ Erledigt eintragen</button>}
                {["CrossFit", "Langhantel", "Kettlebell", "Eigengewicht"].includes(todayPlan.type) && <button onClick={() => onNavigate("generator")} className="flex-1 bg-[#14181A] border border-[#2A2F31] rounded-lg py-2.5 font-body text-sm text-[#E9E4DA]">⚡ Workout bauen</button>}
              </div>
              <div className="font-mono text-[10px] text-[#5F6668] mt-2">Trainierst du anders? Trag es im Training-Tab ein. Der Plan richtet sich danach.</div>
            </>
          )}
        </div>

        {missed.length > 0 && (
          <div className="font-body text-xs text-[#E0925C] mb-2">⚠ Offen diese Woche: {missed.map((x) => `${WEEKDAY_LABELS[new Date(x.d + "T00:00:00").getDay()]} ${x.s.title}`).join(", ")}. Hol die wichtigste Einheit nach, den Rest lass los.</div>
        )}
        <div className="font-body text-xs text-[#8A9296] mb-2">Morgen: {tomorrowPlan.rest ? "😴 " : (TYPE_ICON[tomorrowPlan.type] || "") + " "}{tomorrowPlan.title}{tomorrowPlan.min ? ` · ${tomorrowPlan.min} Min` : ""}. {tomorrowPlan.rest ? "" : "Leg dir heute Abend Kleidung und Equipment bereit."}</div>
        <div className="font-body text-xs text-[#E9E4DA] border-t border-[#262C2E] pt-2">
          <span className="text-[#4E9E8F]">Rückblick:</span> {reviewHead} {reviewTips.join(" ")}
        </div>
        {openMs[0] && (
          <div className="font-body text-xs text-[#E9E4DA] mt-1.5"><span className="text-[#C4703B]">Nächstes Zwischenziel:</span> {openMs[0].m.title}{openMs[0].m.deadline ? `, noch ${Math.max(0, daysBetween(today, openMs[0].m.deadline))} Tage` : ""} ({Math.round(openMs[0].p.pct * 100)} %).</div>
        )}
      </div>

      {feelRun && <RunFeelCard run={feelRun} onSave={saveFeel} />}
      {painRecent.length > 0 && <div className="rounded-xl bg-[#2A1F1F] border border-[#C46B6B66] p-3 font-body text-xs text-[#E9E4DA]">🤕 Du hast in den letzten Tagen Schmerzen beim Laufen gemeldet. Lauf nur, wenn du schmerzfrei bist. Halten die Schmerzen länger als 2 bis 3 Tage an, lass sie abklären (Hausarzt oder Physio).</div>}
      {/* Woche */}
      <div className="bg-[#1B2022] rounded-2xl p-4 border border-[#262C2E]">
        <div className="flex items-center justify-between mb-3">
          <div>
            <div className="font-display text-xl tracking-wide">{weekOffset === 0 ? "DIESE WOCHE" : "NÄCHSTE WOCHE"}</div>
            <button onClick={() => { setWeekOffset(weekOffset === 0 ? 1 : 0); setSelDay(weekOffset === 0 ? addDays(curWeek[0], 7) : today); }} className="font-mono text-[11px] text-[#7A8FC4] underline">{weekOffset === 0 ? "Vorschau nächste Woche" : "Zurück zu dieser Woche"}</button>
          </div>
          <svg width="76" height="76" viewBox="0 0 80 80" aria-label="Wochenziel">
            <circle cx="40" cy="40" r={ringR} fill="none" stroke="#262C2E" strokeWidth="8" />
            <circle cx="40" cy="40" r={ringR} fill="none" stroke={weekSessions >= SESSION_GOAL ? "#4E9E8F" : "#C4703B"} strokeWidth="8" strokeLinecap="round" strokeDasharray={ringC} strokeDashoffset={ringC * (1 - Math.min(1, weekSessions / SESSION_GOAL))} transform="rotate(-90 40 40)" />
            <text x="40" y="45" textAnchor="middle" fill="#E9E4DA" fontSize="18" fontFamily="Bebas Neue">{weekSessions}/{SESSION_GOAL}</text>
          </svg>
        </div>
        <div className="grid grid-cols-7 gap-1.5">
          {week.map((d, i) => {
            const s = plan[i];
            const dd = get(d);
            const done = dd.train.length > 0;
            const mins = dd.train.reduce((a, e) => a + (e.duration || 0), 0);
            const past = d < today;
            const isToday = d === today;
            const first = dd.train[0];
            const icon = done ? (TYPE_ICON[first.type] || "⚡") : (s.rest ? "😴" : (TYPE_ICON[s.type] || "⚡"));
            const col = done ? (WORKOUT_COLORS[first.type] || "#4E9E8F") : (s.rest ? "#5F6668" : "#8A9296");
            const diff = done && !s.rest && s.type && !dd.train.flatMap((e) => partsOf(e)).some((e) => e.type === s.type);
            return (
              <button key={d} onClick={() => setSelDay(d)} className="rounded-xl py-2 flex flex-col items-center gap-1 border transition" style={{ background: selDay === d ? "#22282A" : "#14181A", borderColor: isToday ? "#E0925C" : "#262C2E" }}>
                <span className="font-mono text-[10px]" style={{ color: isToday ? "#E9E4DA" : "#8A9296" }}>{wdShort[i]}{s.moved ? "⇄" : ""}</span>
                <span className="text-lg leading-none" style={{ opacity: done ? 1 : 0.5 }}>{icon}</span>
                <div className="w-3 h-12 rounded bg-[#1B2022] flex items-end overflow-hidden">
                  {done && (<div className="w-full rounded" style={{ height: Math.max(8, (mins / maxMin) * 100) + "%", background: col }} />)}
                </div>
                <span className="font-mono text-[11px]" style={{ color: done ? "#4E9E8F" : "#5F6668" }}>{done ? (dd.train.length > 1 ? "✓" + dd.train.length : "✓") : (past && !s.rest ? "·" : "–")}</span>
                <span className="font-mono text-[9px] text-[#E0925C]" style={{ visibility: diff ? "visible" : "hidden" }}>↔</span>
              </button>
            );
          })}
        </div>
        <div className="font-mono text-[10px] text-[#5F6668] mt-2">Symbol = tatsächlich trainiert. ↔ = anders als geplant. ⇄ = verschoben. Blass = geplant.</div>
        <div className="mt-3 rounded-xl bg-[#14181A] border border-[#262C2E] p-3">
          <div className="font-mono text-[10px] text-[#8A9296] mb-1">WOCHENBAUKASTEN</div>
          <div className="font-body text-sm" style={{ color: keyDone >= keyIdx.length ? "#4E9E8F" : "#E9E4DA" }}>Pflicht-Einheiten: {keyDone} von {keyIdx.length} erledigt</div>
          <div className="font-body text-xs text-[#8A9296] mt-0.5">Pflicht sind die Einheiten ohne „optional“, „Grundlage“ oder „locker“. Du darfst sie auf andere Tage legen, aber nicht streichen.</div>
          {keyMissed.length > 0 && <div className="font-body text-xs text-[#C46B6B] mt-1.5">Offen: {keyMissed.map((i) => `${wdShort[i]} ${plan[i].title}`).join(", ")}. Leg sie auf einen der nächsten Tage, sonst zählt sie als verpasst.</div>}
          {hardWarn.map((w) => <div key={w} className="font-body text-xs text-[#E0925C] mt-1.5">⚠ {w} Tausche einen Tag oder fahr eine Einheit bewusst ruhiger.</div>)}
          {avoided.map((t) => <div key={t} className="font-body text-xs text-[#E0925C] mt-1.5">🔁 „{t}“ hast du in den letzten 8 Wochen {recentMoves[t]}× verschoben. Passt der Tag wirklich nicht, oder meidest du die Einheit?</div>)}
          <div className="font-body text-xs text-[#8A9296] mt-2 border-t border-[#262C2E] pt-2">🏃 {lvlTxt}</div>
        </div>
        <div className="mt-3 rounded-xl bg-[#14181A] border border-[#262C2E] p-3">
          <div className="font-mono text-[10px] text-[#8A9296] mb-1">{fmtDate(selDay)}</div>
          <div className="font-body text-sm text-[#E9E4DA]">Plan: {selPlan.rest ? "😴 " : (TYPE_ICON[selPlan.type] || "") + " "}{selPlan.title}{selPlan.min ? ` · ${selPlan.min} Min` : ""}{selPlan.distance ? ` · ${selPlan.distance} km` : ""}</div>
          {selPlan.moved && <div className="font-mono text-[10px] text-[#E0925C]">⇄ verschoben von {wdShort[(new Date(selPlan.fromDay + "T00:00:00").getDay() + 6) % 7]}</div>}
          {selPlan.detail.map((t) => <div key={t} className="font-body text-xs text-[#8A9296]">• {t}</div>)}
          {selDay >= today && selTrain.length === 0 && <button onClick={() => setSwapSheet(selDay)} className="mt-2 px-3 py-1.5 rounded-lg bg-[#1B2022] border border-[#2A2F31] font-mono text-[11px] text-[#7A8FC4]">⇄ Tag tauschen</button>}
          {selTrain.length > 0 ? selTrain.map((e) => (
            <div key={e.id} className="font-body text-xs text-[#4E9E8F] mt-1">✓ {TYPE_ICON[e.type] || ""} {entryTitle(e)}{e.focus ? " · " + e.focus : ""} · {e.duration} Min{e.distance ? " · " + e.distance + " km" : ""}</div>
          )) : <div className="font-body text-xs text-[#5F6668] mt-1">{selDay > today ? "Noch offen." : "Kein Training eingetragen."}</div>}
        </div>
        <div className="font-mono text-[11px] text-[#8A9296] mt-2">{weekMinutes} Min Training diese Woche</div>
      </div>

      {/* Zwischenziele */}
      <div className="bg-[#1B2022] rounded-2xl p-4 border border-[#262C2E]">
        <div className="flex items-center justify-between mb-3">
          <div className="font-display text-xl tracking-wide">ZWISCHENZIELE</div>
          <button onClick={() => setMsSheet(true)} className="font-mono text-[11px] text-[#7A8FC4] underline">+ Hinzufügen</button>
        </div>
        <div className="space-y-3">
          {[...msStates].sort((a, b) => (a.p.done - b.p.done) || (a.m.deadline || "9999").localeCompare(b.m.deadline || "9999")).map(({ m, p }) => {
            const left = m.deadline ? daysBetween(today, m.deadline) : null;
            const unit = MS_KINDS[m.kind].unit;
            const late = !p.done && left !== null && left < 0;
            return (
              <div key={m.id}>
                <div className="flex items-baseline justify-between gap-2">
                  <div className="font-body text-sm" style={{ color: p.done ? "#4E9E8F" : "#E9E4DA" }}>{p.done ? "✓ " : ""}{m.title}</div>
                  <div className="flex items-center gap-2">
                    {m.kind === "manual" && <button onClick={() => persistMs(milestones.map((x) => x.id === m.id ? { ...x, done: !x.done } : x))} className="font-mono text-[10px] text-[#7A8FC4] underline">{m.done ? "zurück" : "abhaken"}</button>}
                    <button onClick={() => { if (confirm("Zwischenziel löschen?")) persistMs(milestones.filter((x) => x.id !== m.id)); }} className="font-mono text-[11px] text-[#5F6668]">✕</button>
                  </div>
                </div>
                <div className="h-2 rounded-full bg-[#14181A] overflow-hidden my-1"><div className="h-full rounded-full" style={{ width: Math.round(p.pct * 100) + "%", background: p.done ? "#4E9E8F" : "#C4703B" }} /></div>
                <div className="flex justify-between font-mono text-[10px]" style={{ color: late ? "#C46B6B" : "#8A9296" }}>
                  <span>{m.kind === "manual" ? "" : `${p.cur} / ${m.target} ${unit}`}</span>
                  <span>{p.done ? "erreicht" : left === null ? "" : late ? `${-left} Tage überfällig` : `noch ${left} Tage`}</span>
                </div>
              </div>
            );
          })}
          {msStates.length === 0 && <div className="font-body text-xs text-[#8A9296]">Noch keine Zwischenziele. Setz dir das erste.</div>}
        </div>
        <div className="font-mono text-[10px] text-[#5F6668] mt-3">Der Fortschritt wird aus deinen Trainingseinträgen berechnet (Distanz eintragen!). Der Trainer richtet die Länge deines Wochenlaufs an den Lauf-Zielen aus.</div>
      </div>
      {showZones && <ZonesSheet onClose={() => setShowZones(false)} onSaved={(z) => setHrZones(z)} />}
      {swapSheet && (
        <Sheet title="TAG TAUSCHEN" onClose={() => setSwapSheet(null)}>
          <div className="font-body text-sm text-[#8A9296] mb-3">Mit welchem Tag soll <span className="text-[#E9E4DA]">{sess(swapSheet).title}</span> getauscht werden?</div>
          <div className="space-y-2 mb-3">
            {weekDates(swapSheet).filter((d) => d !== swapSheet && d >= today && get(d).train.length === 0).map((d) => {
              const o = sess(d);
              return (
                <button key={d} onClick={() => doSwap(swapSheet, d)} className="w-full text-left rounded-lg bg-[#14181A] border border-[#2A2F31] px-3 py-2.5">
                  <div className="font-mono text-[10px] text-[#8A9296]">{fmtDate(d)}</div>
                  <div className="font-body text-sm text-[#E9E4DA]">{o.rest ? "😴 " : (TYPE_ICON[o.type] || "") + " "}{o.title}</div>
                </button>
              );
            })}
          </div>
          <button onClick={() => resetSwap(swapSheet)} className="w-full bg-[#14181A] border border-[#2A2F31] text-[#8A9296] rounded-lg py-2.5 font-body text-sm">↺ Ganze Woche auf Coach-Plan zurücksetzen</button>
        </Sheet>
      )}
      {msSheet && (
        <Sheet title="ZWISCHENZIEL" onClose={() => setMsSheet(false)}>
          <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">Art</label>
          <select value={msForm.kind} onChange={(e) => setMsForm({ ...msForm, kind: e.target.value })} className="w-full mt-1 mb-3 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA]">
            {Object.keys(MS_KINDS).map((k) => <option key={k} value={k}>{MS_KINDS[k].label}</option>)}
          </select>
          <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">Name (optional)</label>
          <input type="text" value={msForm.title} onChange={(e) => setMsForm({ ...msForm, title: e.target.value })} placeholder="z.B. Halbmarathon" className="w-full mt-1 mb-3 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA]" />
          {msForm.kind !== "manual" && (
            <>
              <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">Zielwert ({MS_KINDS[msForm.kind].unit})</label>
              <input type="text" inputMode="decimal" value={msForm.target} onChange={(e) => setMsForm({ ...msForm, target: e.target.value })} className="w-full mt-1 mb-3 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA]" />
            </>
          )}
          <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">Bis wann (optional)</label>
          <input type="date" value={msForm.deadline} onChange={(e) => setMsForm({ ...msForm, deadline: e.target.value })} className="w-full mt-1 mb-4 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA]" />
          <button onClick={addMs} className="w-full bg-[#7A8FC4] text-[#14181A] font-body font-semibold text-sm rounded-lg py-3">Speichern</button>
        </Sheet>
      )}

      {/* Heute Ernährung */}
      <div className="bg-[#1B2022] rounded-2xl p-4 border border-[#262C2E]">
        <div className="font-display text-xl tracking-wide mb-2">HEUTE ESSEN</div>
        <div className="flex justify-between font-mono text-[11px] text-[#8A9296] mb-1"><span>Kalorien</span><span>{Math.round(todayData.kcal)} / {kcalTarget}</span></div>
        <div className="h-2 rounded-full bg-[#14181A] overflow-hidden mb-3"><div className="h-full rounded-full" style={{ width: Math.min(100, (todayData.kcal / kcalTarget) * 100) + "%", background: "#C4703B" }} /></div>
        <div className="flex justify-between font-mono text-[11px] text-[#8A9296] mb-1"><span>Protein</span><span>{Math.round(todayData.protein)} / {targets.protein} g</span></div>
        <div className="h-2 rounded-full bg-[#14181A] overflow-hidden mb-3"><div className="h-full rounded-full" style={{ width: Math.min(100, (todayData.protein / targets.protein) * 100) + "%", background: "#4E9E8F" }} /></div>
        <button onClick={() => onNavigate("ernaehrung")} className="w-full bg-[#14181A] border border-[#262C2E] rounded-lg py-2 font-body text-xs text-[#E9E4DA]">🍽 Essen eintragen</button>
      </div>

      <CalorieCheckin data={data} targets={targets} setTargets={setTargets} nutritionGoal={nutritionGoal} phaseKey={curPhase.key} today={today} />

      {/* Hero */}
      <div className="rounded-2xl p-4 border" style={{ background: "linear-gradient(135deg,#1B2022 0%,#1B2022 60%," + curPhase.color + "22 100%)", borderColor: curPhase.color + "55" }}>
        <div className="flex items-start justify-between">
          <div>
            <div className="font-mono text-[11px] text-[#8A9296]">{race.name}</div>

function racePhase(days) {
  if (days === null) return null;
  if (days < 0) return { label: "Rennen war bereits", color: "#5F6668" };
  if (days <= 7) return { label: "Rennwoche — nur noch leicht bewegen", color: "#C46B6B" };
  if (days <= 28) return { label: "Taper — Volumen runter, Frische aufbauen", color: "#E0925C" };
  if (days <= 84) return { label: "Renn-spezifisch — mehr Laufen, Grip, Gelände", color: "#C4703B" };
  if (days <= 182) return { label: "Kombiphase — Kraft & Ausdauer parallel ausbauen", color: "#4E9E8F" };
  return { label: "Aufbauphase — Kraft & Grundlagenausdauer", color: "#7A8FC4" };
}

// Regelbasierte Kalorien-Trend-Empfehlung: vergleicht Gewichtsverlauf mit dem Ernährungsziel aus der Anamnese
function computeCalorieSuggestion(weightEntries, nutritionGoal) {
  if (!weightEntries || weightEntries.length < 2) return { status: "insufficient" };
  const sorted = weightEntries.slice().sort((a, b) => a.date.localeCompare(b.date));
  const first = sorted[0], last = sorted[sorted.length - 1];
  const daySpan = Math.max(1, (new Date(last.date + "T00:00:00") - new Date(first.date + "T00:00:00")) / 86400000);
  if (daySpan < 10) return { status: "insufficient" };
  const totalDelta = last.weight - first.weight;
  const weeklyRate = round1((totalDelta / daySpan) * 7);

  const goal = nutritionGoal || "";
  let status = "ontrack", deltaKcal = 0, reason = "";

  if (goal.includes("Muskelaufbau")) {
    if (weeklyRate < 0.05) { status = "increase"; deltaKcal = 150; reason = "Gewicht stagniert trotz Aufbauziel"; }
    else if (weeklyRate > 0.35) { status = "decrease"; deltaKcal = -100; reason = "Zunahme schneller als für sauberen Aufbau nötig"; }
    else { reason = "Zunahme im erwarteten Rahmen (~0,1-0,25 kg/Woche)"; }
  } else if (goal.includes("Fettabbau")) {
    if (weeklyRate > -0.1) { status = "decrease"; deltaKcal = -150; reason = "Kaum Abnahme trotz Defizit-Ziel"; }
    else if (weeklyRate < -0.7) { status = "increase"; deltaKcal = 100; reason = "Abnahme sehr schnell — Risiko für Muskelverlust"; }
    else { reason = "Abnahme im erwarteten Rahmen (~0,3-0,5 kg/Woche)"; }
  } else {
    // Erhalt / Aufbau ohne Zunahme / Leistungsoptimierung — Ziel: stabiles Gewicht
    if (weeklyRate > 0.2) { status = "decrease"; deltaKcal = -100; reason = "Gewicht steigt, obwohl Ziel Stabilität ist"; }
    else if (weeklyRate < -0.2) { status = "increase"; deltaKcal = 100; reason = "Gewicht sinkt, obwohl Ziel Stabilität ist"; }
    else { reason = "Gewicht stabil, passt zum Ziel"; }
  }

  return { status, deltaKcal, reason, weeklyRate, spanDays: Math.round(daySpan) };
}

// ---------- Barcode-Scanner (Open Food Facts) ----------
async function lookupBarcode(code) {
  const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_de,brands,nutriments,serving_size,quantity`);
  if (!res.ok) throw new Error("http");
  const j = await res.json();
  if (!j || j.status !== 1 || !j.product) return null;
  const p = j.product, n = p.nutriments || {};
  const num = (v) => { const x = parseFloat(v); return isNaN(x) ? 0 : x; };
  let kcal = num(n["energy-kcal_100g"]);
  if (!kcal && n["energy_100g"]) kcal = num(n["energy_100g"]) / 4.184;
  const brand = (p.brands || "").split(",")[0].trim();
  const name = ((p.product_name_de || p.product_name || "").trim() + (brand ? ` (${brand})` : "")).slice(0, 70) || `Produkt ${code}`;
  return { name, kcal: Math.round(kcal), protein: round1(num(n["proteins_100g"])), fat: round1(num(n["fat_100g"])), carbs: round1(num(n["carbohydrates_100g"])), serving: p.serving_size || p.quantity || "" };
}
function BarcodeSheet({ onClose, onResult }) {
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const [code, setCode] = useState("");
  const [status, setStatus] = useState("");
  const [busy, setBusy] = useState(false);
  const [found, setFound] = useState(null);
  const supported = typeof window !== "undefined" && "BarcodeDetector" in window;
  const stopCam = () => { try { if (streamRef.current) { streamRef.current.getTracks().forEach((t) => t.stop()); streamRef.current = null; } } catch (e) {} };
  const doLookup = async (c) => {
    const clean = String(c).replace(/\D/g, "");
    if (clean.length < 8) { setStatus("Bitte einen gültigen Barcode (8 bis 13 Ziffern) eingeben."); return; }
    stopCam(); setBusy(true); setStatus("Suche in Open Food Facts …");
    try {
      const r = await lookupBarcode(clean);
      if (!r) setStatus(`Barcode ${clean} ist in Open Food Facts nicht eingetragen. Trag die Werte bitte einmal von Hand ein.`);
      else if (!r.kcal) setStatus("Das Produkt hat dort keine Nährwerte. Bitte von Hand eintragen.");
      else { setFound(r); setStatus(""); }
    } catch (e) { setStatus("Keine Verbindung zu Open Food Facts. Prüfe dein Internet."); }
    setBusy(false);
  };
  useEffect(() => {
    if (!supported) return;
    let cancelled = false, timer = null;
    (async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        if (cancelled) { stream.getTracks().forEach((t) => t.stop()); return; }
        streamRef.current = stream;
        const v = videoRef.current; if (!v) return;
        v.srcObject = stream; await v.play();
        const det = new window.BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a", "upc_e"] });
        setStatus("Halte den Barcode ruhig ins Bild.");
        timer = setInterval(async () => {
          try { const r = await det.detect(v); if (r && r.length && !cancelled) { clearInterval(timer); setCode(r[0].rawValue); doLookup(r[0].rawValue); } } catch (e) {}
        }, 350);
      } catch (e) { setStatus("Kamera nicht verfügbar. Erlaube den Kamerazugriff im Browser oder gib den Barcode unten ein."); }
    })();
    return () => { cancelled = true; if (timer) clearInterval(timer); stopCam(); };
  }, []);
  const inp = "w-full mt-1 mb-3 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#C4703B]";
  return (
    <Sheet title="BARCODE" onClose={() => { stopCam(); onClose(); }}>
      {!found ? (
        <>
          {supported ? (
            <video ref={videoRef} playsInline muted className="w-full rounded-xl bg-[#14181A] mb-3" style={{ maxHeight: 260, objectFit: "cover" }} />
          ) : (
            <div className="font-body text-xs text-[#E0925C] mb-3">Dein Browser unterstützt das Scannen nicht. Gib den Barcode (die Zahl unter den Strichen) von Hand ein.</div>
          )}
          <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">Oder Barcode eingeben</label>
          <input type="text" inputMode="numeric" value={code} onChange={(e) => setCode(e.target.value)} placeholder="z.B. 4001234567890" className={inp} />
          <button onClick={() => doLookup(code)} disabled={busy} className="w-full bg-[#C4703B] text-[#14181A] font-body font-semibold text-sm rounded-lg py-3 disabled:opacity-60">{busy ? "Suche …" : "Nachschlagen"}</button>
          {status && <div className="font-body text-xs text-[#8A9296] mt-3">{status}</div>}
        </>
      ) : (
        <>
          <div className="font-body text-sm text-[#4E9E8F] mb-2">Gefunden. Prüfe die Werte (pro 100 g) und übernimm sie.</div>
          <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">Name</label>
          <input type="text" value={found.name} onChange={(e) => setFound({ ...found, name: e.target.value })} className={inp} />
          <div className="grid grid-cols-2 gap-3 mb-3">
            {[["kcal", "Kcal"], ["protein", "Protein (g)"], ["fat", "Fett (g)"], ["carbs", "Kohlenh. (g)"]].map(([k, l]) => (
              <div key={k}><label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">{l}</label><input type="text" inputMode="decimal" value={found[k]} onChange={(e) => setFound({ ...found, [k]: e.target.value })} className="w-full mt-1 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#C4703B]" /></div>
            ))}
          </div>
          {found.serving && <div className="font-mono text-[10px] text-[#8A9296] mb-3">Packung/Portion laut Hersteller: {found.serving}</div>}
          <button onClick={() => { stopCam(); onResult({ name: found.name.trim(), unit: "g", kcal: parseFloat(String(found.kcal).replace(",", ".")) || 0, protein: parseFloat(String(found.protein).replace(",", ".")) || 0, fat: parseFloat(String(found.fat).replace(",", ".")) || 0, carbs: parseFloat(String(found.carbs).replace(",", ".")) || 0 }); }} className="w-full bg-[#C4703B] text-[#14181A] font-body font-semibold text-sm rounded-lg py-3">Übernehmen</button>
          <p className="font-mono text-[10px] text-[#5F6668] mt-3 leading-relaxed">Daten von Open Food Facts (von Nutzern gepflegt, daher gelegentlich ungenau). Das Lebensmittel wird gespeichert, du musst danach nur die Menge eintragen.</p>
        </>
      )}
    </Sheet>
  );
}
