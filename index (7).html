                  <div className="font-mono text-[11px] text-[#5F6668]">Noch nicht genug Gewichtsdaten (mind. 2 Wiegungen über 10+ Tage) für eine Trend-Empfehlung.</div>
                ) : calorieSuggestion.status === "ontrack" ? (
                  <div className="font-body text-sm text-[#4E9E8F]">✓ {calorieSuggestion.reason} (Trend: {calorieSuggestion.weeklyRate > 0 ? "+" : ""}{calorieSuggestion.weeklyRate} kg/Woche über {calorieSuggestion.spanDays} Tage). Kalorienziel beibehalten.</div>
                ) : (
                  <>
                    <div className="font-body text-sm text-[#E9E4DA] mb-2">{calorieSuggestion.reason} (Trend: {calorieSuggestion.weeklyRate > 0 ? "+" : ""}{calorieSuggestion.weeklyRate} kg/Woche über {calorieSuggestion.spanDays} Tage).</div>
                    {suggestionApplied ? (
                      <div className="font-mono text-[11px] text-[#4E9E8F]">✓ Übernommen — neues Basisziel {targets.baseKcal} kcal</div>
                    ) : (
                      <button onClick={applyCalorieSuggestion} className="font-mono text-[11px] text-[#E0925C] underline">
                        {calorieSuggestion.deltaKcal > 0 ? "+" : ""}{calorieSuggestion.deltaKcal} kcal übernehmen (→ {targets.baseKcal + calorieSuggestion.deltaKcal} kcal Basisziel)
                      </button>
                    )}
                  </>
                )}
                {lastCalorieChange && (
                  <div className="mt-2.5 pt-2.5 border-t border-[#262C2E] flex items-center justify-between">
                    <div className="font-mono text-[10px] text-[#5F6668]">
                      Letzte Anpassung: {lastCalorieChange.deltaKcal > 0 ? "+" : ""}{lastCalorieChange.deltaKcal} kcal am {new Date(lastCalorieChange.appliedAt + "T00:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" })}
                    </div>
                    <button onClick={undoCalorieChange} className="font-mono text-[10px] text-[#C46B6B] underline shrink-0 ml-2">Rückgängig machen</button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Kennzahlen-Kacheln */}
          <div className="grid grid-cols-2 gap-3 mb-5">
            <StatTile label="Ø Kalorien/Tag" value={avgKcal} unit="kcal" color="#C4703B" />
            <StatTile label="Ø Protein/Tag" value={avgProtein} unit="g" color="#4E9E8F" />
            <StatTile label="Kalorienziel erreicht" value={`${kcalMetCount}/${days.length}`} unit="Tage" color="#E0925C" />
            <StatTile label="Proteinziel erreicht" value={`${proteinMetCount}/${days.length}`} unit="Tage" color="#6FC2B3" />
            <StatTile label="Trainingseinheiten" value={totalSessions} unit={`${totalMinutes} Min`} color="#7A8FC4" />
            <StatTile label="Trainingstage" value={`${trainingDays.length}/${days.length}`} unit="Tage" color="#B8A15C" />
          </div>

          {streak !== null && streak > 0 && (
            <div className="bg-[#1B2022] rounded-2xl p-4 border border-[#262C2E] mb-5 flex items-center gap-3">
              <span style={{ fontSize: 22 }}>🔥</span>
              <div>
                <div className="font-display text-xl text-[#E9E4DA] leading-none">{streak} {streak === 1 ? "Tag" : "Tage"} Streak</div>
                <div className="font-mono text-[10px] text-[#5F6668] mt-1">Ununterbrochen Ernährung getrackt</div>
              </div>
            </div>
          )}

          {/* Trainings-Aufschlüsselung nach Art */}
          {typeBreakdown.length > 0 && (
            <div className="bg-[#1B2022] rounded-2xl p-4 border border-[#262C2E] mb-5">
              <div className="font-mono text-xs text-[#8A9296] uppercase tracking-wider mb-3">Training nach Art & Häufigkeit</div>
              <div className="space-y-2.5">
                {typeBreakdown.map(([type, count]) => (
                  <div key={type}>
                    <div className="flex justify-between font-body text-xs text-[#E9E4DA] mb-1">
                      <span>{type}</span>
                      <span className="font-mono text-[#8A9296]">{count}× · {typeMinutes[type]} Min</span>
                    </div>
                    <div className="h-1.5 rounded-full bg-[#262C2E] overflow-hidden">
                      <div className="h-full rounded-full" style={{ width: `${(count / totalSessions) * 100}%`, background: WORKOUT_COLORS[type] || "#8A9296" }} />
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Soll vs. Ist Trainingseinheiten */}
          <div className="bg-[#1B2022] rounded-2xl p-4 border border-[#262C2E] mb-5">
            <div className="flex items-center justify-between mb-3">
              <span className="font-mono text-xs text-[#8A9296] uppercase tracking-wider">Soll vs. Ist ({weekGoalSessions}×/Woche Ziel)</span>
              <span className="font-mono text-xs" style={{ color: sessionsGap >= 0 ? "#4E9E8F" : "#C46B6B" }}>{sessionsGap >= 0 ? `+${sessionsGap}` : sessionsGap}</span>
            </div>
            <div className="flex items-baseline gap-2 mb-2">
              <span className="font-display text-4xl text-[#E9E4DA]">{totalSessions}</span>
              <span className="font-mono text-sm text-[#8A9296]">von theoretisch {theoreticalSessions} Einheiten</span>
            </div>
            <div className="h-2 rounded-full bg-[#262C2E] overflow-hidden">
              <div className="h-full rounded-full" style={{ width: `${Math.min(100, (totalSessions / theoreticalSessions) * 100)}%`, background: totalSessions >= theoreticalSessions ? "#4E9E8F" : "#E0925C" }} />
            </div>
            <div className="font-mono text-[10px] text-[#5F6668] mt-2">{mode === "week" ? "Basiert auf deinem Wochenziel von 6 Einheiten." : `Hochgerechnet auf ${Math.round(days.length / 7 * 10) / 10} Wochen in diesem Monat.`}</div>
          </div>

          {/* Gewichtsverlauf über mehrere Wochen (Liniengrafik, unabhängig vom Woche/Monat-Umschalter oben) */}
          <div className="bg-[#1B2022] rounded-2xl p-4 border border-[#262C2E] mb-5">
            <div className="flex items-center justify-between mb-3">
              <span className="font-mono text-xs text-[#8A9296] uppercase tracking-wider">Gewichtsentwicklung</span>
              {weightChartData && (
                <span className="font-mono text-xs" style={{ color: weightChartData.totalChange <= 0 ? "#4E9E8F" : "#C46B6B" }}>{weightChartData.totalChange > 0 ? `+${weightChartData.totalChange}` : weightChartData.totalChange} kg</span>
              )}
            </div>

            <div className="flex gap-2 mb-4">
              {[8, 12, 26].map((w) => (
                <button key={w} onClick={() => setWeightRangeWeeks(w)} className={`flex-1 py-1.5 rounded-lg font-mono text-[11px] font-medium transition-colors ${weightRangeWeeks === w ? "bg-[#7A8FC4] text-[#14181A]" : "bg-[#14181A] text-[#8A9296] border border-[#2A2F31]"}`}>{w} Wochen</button>
              ))}
            </div>

            {!weightChartData ? (
              <div className="font-mono text-[11px] text-[#5F6668]">Noch keine Gewichtseinträge im gewählten Zeitraum — trag samstags im Training-Tab dein Gewicht ein.</div>
            ) : (
              <>
                <svg viewBox={`0 0 ${weightChartData.W} ${weightChartData.H}`} className="w-full" style={{ height: 120 }}>
                  <path d={weightChartData.pathD} fill="none" stroke="#7A8FC4" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
                  {weightChartData.points.map((p, i) => (
                    <circle key={i} cx={p.x} cy={p.y} r="2.5" fill="#7A8FC4" />
                  ))}
                </svg>
                <div className="flex items-center justify-between font-mono text-[10px] text-[#5F6668] mt-1">
                  <span>{new Date(weightChartData.first.date + "T00:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" })} · {weightChartData.first.weight}kg</span>
                  <span>{new Date(weightChartData.last.date + "T00:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" })} · {weightChartData.last.weight}kg</span>
                </div>
                <div className="font-mono text-[10px] text-[#5F6668] mt-2">{weightChartData.points.length} Einträge in den letzten {weightRangeWeeks} Wochen · Spanne {round1(weightChartData.min)}–{round1(weightChartData.max)} kg</div>
              </>
            )}
          </div>

          {/* Formverlauf-Galerie */}
          {photos.length > 0 && (
            <div className="bg-[#1B2022] rounded-2xl p-4 border border-[#262C2E] mb-5">
              <div className="font-mono text-xs text-[#8A9296] uppercase tracking-wider mb-3">📸 Formverlauf ({photos.length} {photos.length === 1 ? "Foto" : "Fotos"})</div>
              <div className="flex gap-2 overflow-x-auto pb-1">
                {photos.map((p) => (
                  <button key={p.date} onClick={() => setViewPhoto(p)} className="shrink-0">
                    <img src={p.url} alt={p.date} className="w-16 h-16 object-cover rounded-lg border border-[#2A2F31]" />
                    <div className="font-mono text-[8px] text-[#5F6668] mt-1 text-center">{new Date(p.date + "T00:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" })}</div>
                  </button>
                ))}
              </div>
            </div>
          )}

          {/* Kalorien pro Tag - Balkendiagramm */}
          <div className="bg-[#1B2022] rounded-2xl p-4 border border-[#262C2E] mb-5">
            <div className="font-mono text-xs text-[#8A9296] uppercase tracking-wider mb-4">Kalorien pro Tag</div>
            <div className="flex items-end gap-1.5" style={{ height: 110 }}>
              {days.map((d) => (
                <div key={d.date} className="flex-1 flex flex-col items-center justify-end h-full">
                  <div className="w-full flex items-end justify-center relative" style={{ height: "100%" }}>
                    <div
                      className="w-full rounded-t-sm"
                      style={{
                        height: `${d.hasNutrition ? Math.max(4, (d.kcalTotal / maxKcal) * 100) : 2}%`,
                        background: !d.hasNutrition ? "#262C2E" : d.kcalMet ? "#4E9E8F" : d.kcalTotal > d.adjustedTarget ? "#C46B6B" : "#C4703B",
                      }}
                      title={`${Math.round(d.kcalTotal)} kcal`}
                    />
                  </div>
                  <div className="font-mono text-[9px] text-[#5F6668] mt-1">
                    {mode === "week" ? new Date(d.date + "T00:00:00").toLocaleDateString("de-DE", { weekday: "narrow" }) : new Date(d.date + "T00:00:00").getDate()}
                  </div>
                </div>
              ))}
            </div>
            <div className="flex items-center gap-4 mt-3 font-mono text-[9px] text-[#5F6668]">
              <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full inline-block" style={{ background: "#4E9E8F" }} />im Ziel</span>
              <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full inline-block" style={{ background: "#C4703B" }} />drunter</span>
              <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full inline-block" style={{ background: "#C46B6B" }} />drüber</span>
              <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full inline-block" style={{ background: "#262C2E" }} />kein Log</span>
            </div>
          </div>

          {/* Tagesliste (nur Wochenansicht - im Monat wäre es zu lang) */}
          {mode === "week" && (
            <div className="space-y-2">
              {days.map((d) => (
                <div key={d.date} className="bg-[#1B2022] rounded-xl px-4 py-3 border border-[#262C2E]">
                  <div className="flex items-center justify-between mb-1.5">
                    <div className="font-body text-sm text-[#E9E4DA] capitalize">{new Date(d.date + "T00:00:00").toLocaleDateString("de-DE", { weekday: "long", day: "2-digit", month: "2-digit" })}</div>
                    {d.hasNutrition ? (
                      <div className="font-mono text-xs" style={{ color: d.kcalMet ? "#4E9E8F" : d.kcalTotal > d.adjustedTarget ? "#C46B6B" : "#C4703B" }}>
                        {Math.round(d.kcalTotal)} / {d.adjustedTarget} kcal
                      </div>
                    ) : (<div className="font-mono text-xs text-[#5F6668]">kein Log</div>)}
                  </div>
                  <div className="flex items-center justify-between">
                    <div className="flex gap-1.5 flex-wrap">
                      {d.training.length > 0 ? d.training.map((t, i) => (
                        <span key={i} className="font-mono text-[10px] px-2 py-0.5 rounded-full" style={{ background: "#14181A", color: WORKOUT_COLORS[t.type] || "#8A9296", border: `1px solid ${WORKOUT_COLORS[t.type] || "#262C2E"}` }}>
                          {t.type} · {t.duration}min{t.distance ? ` · ${t.distance}km` : ""}
                        </span>
                      )) : (<span className="font-mono text-[10px] text-[#5F6668]">Ruhetag</span>)}
                    </div>
                    {d.hasNutrition && (
                      <span className="font-mono text-[10px]" style={{ color: d.proteinMet ? "#4E9E8F" : "#8A9296" }}>
                        P {round1(d.proteinTotal)}g{d.proteinMet ? " ✓" : ""}
                      </span>
                    )}
                  </div>
                </div>
              ))}
            </div>
          )}
        </>
      )}

      {viewPhoto && (
        <Sheet title={new Date(viewPhoto.date + "T00:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" })} onClose={() => setViewPhoto(null)}>
          <img src={viewPhoto.url} alt={viewPhoto.date} className="w-full rounded-xl border border-[#2A2F31]" />
        </Sheet>
      )}
    </div>
  );
}

function StatTile({ label, value, unit, color }) {
  return (
    <div className="bg-[#1B2022] rounded-2xl p-4 border border-[#262C2E]">
      <div className="font-mono text-[10px] uppercase tracking-wider text-[#8A9296] mb-1.5">{label}</div>
      <div className="font-display text-2xl" style={{ color }}>{value}</div>
      <div className="font-mono text-[10px] text-[#5F6668] mt-0.5">{unit}</div>
    </div>
  );
}
function LibraryTab() {
  const [subView, setSubView] = useState("foods"); // "foods" | "clusters" | "locations"
  const [customFoods, setCustomFoods] = useState([]);
  const [favorites, setFavorites] = useState([]);
  const [templates, setTemplates] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [search, setSearch] = useState("");
  const [toast, setToast] = useState("");

  const [showFoodSheet, setShowFoodSheet] = useState(false);
  const [editingFoodName, setEditingFoodName] = useState(null); // null = neu
  const [foodForm, setFoodForm] = useState({ name: "", unit: "g", kcal: "", protein: "", fat: "", carbs: "" });
  const [foodError, setFoodError] = useState("");

  const [showClusterSheet, setShowClusterSheet] = useState(false);
  const [editingClusterId, setEditingClusterId] = useState(null);
  const [clusterName, setClusterName] = useState("");
  const [clusterItems, setClusterItems] = useState([]);
  const [clusterFoodInput, setClusterFoodInput] = useState("");
  const [clusterAmount, setClusterAmount] = useState("");
  const [clusterError, setClusterError] = useState("");
  const [clusterMealType, setClusterMealType] = useState("");

  const [locations, setLocations] = useState([]);
  const [showLocationSheet, setShowLocationSheet] = useState(false);
  const [editingLocationId, setEditingLocationId] = useState(null);
  const [locationName, setLocationName] = useState("");
  const [locationEquipment, setLocationEquipment] = useState([]);
  const [customEquipmentInput, setCustomEquipmentInput] = useState("");
  const [locationError, setLocationError] = useState("");

  const [queryKcal, setQueryKcal] = useState("");
  const [queryMeal, setQueryMeal] = useState(MEAL_TYPES[0]);
  const [queryResults, setQueryResults] = useState(null);
  const [queryDate, setQueryDate] = useState(todayStr());

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2000); };

  useEffect(() => {
    (async () => {
      try { const r = await window.storage.get("customFoods", false); setCustomFoods(r && r.value ? JSON.parse(r.value) : []); } catch (e) {}
      try { const r = await window.storage.get("favoriteFoods", false); setFavorites(r && r.value ? JSON.parse(r.value) : []); } catch (e) {}
      try { const r = await window.storage.get("mealTemplates", false); setTemplates(r && r.value ? JSON.parse(r.value) : []); } catch (e) {}
      try {
        const r = await window.storage.get("locations", false);
        const stored = r && r.value ? JSON.parse(r.value) : null;
        setLocations(stored || [
          { id: uid(), name: "Home Gym", equipment: [] },
          { id: uid(), name: "Studio", equipment: [] },
        ]);
      } catch (e) {}
      setLoaded(true);
    })();
  }, []);

  const persistCustomFoods = useCallback(async (next) => {
    setCustomFoods(next);
    try { await window.storage.set("customFoods", JSON.stringify(next), false); } catch (e) {}
  }, []);
  const persistFavorites = useCallback(async (next) => {
    setFavorites(next);
    try { await window.storage.set("favoriteFoods", JSON.stringify(next), false); } catch (e) {}
  }, []);
  const persistTemplates = useCallback(async (next) => {
    setTemplates(next);
    try { await window.storage.set("mealTemplates", JSON.stringify(next), false); } catch (e) {}
  }, []);

  const persistLocations = useCallback(async (next) => {
    setLocations(next);
    try { await window.storage.set("locations", JSON.stringify(next), false); } catch (e) {}
  }, []);

  const openNewLocation = () => {
    setEditingLocationId(null);
    setLocationName("");
    setLocationEquipment([]);
    setCustomEquipmentInput("");
    setLocationError("");
    setShowLocationSheet(true);
  };
  const openEditLocation = (loc) => {
    setEditingLocationId(loc.id);
    setLocationName(loc.name);
    setLocationEquipment(loc.equipment.slice());
    setCustomEquipmentInput("");
    setLocationError("");
    setShowLocationSheet(true);
  };
  const toggleLocationEquipment = (eq) => {
    setLocationEquipment((prev) => (prev.includes(eq) ? prev.filter((e) => e !== eq) : [...prev, eq]));
  };
  const addCustomEquipment = () => {
    const val = customEquipmentInput.trim();
    if (val && !locationEquipment.includes(val)) setLocationEquipment([...locationEquipment, val]);
    setCustomEquipmentInput("");
  };
  const saveLocation = async () => {
    setLocationError("");
    if (!locationName.trim()) { setLocationError("Bitte einen Namen vergeben."); return; }
    const loc = { id: editingLocationId || uid(), name: locationName.trim(), equipment: locationEquipment };
    const next = locations.filter((l) => l.id !== loc.id).concat(loc);
    await persistLocations(next);
    setShowLocationSheet(false);
    showToast("Ort gespeichert");
  };
  const deleteLocation = async (id) => {
    await persistLocations(locations.filter((l) => l.id !== id));
    setShowLocationSheet(false);
  };

  const runQuery = () => {
    const target = parseInt(queryKcal);
    if (!target || target <= 0) { showToast("Bitte eine gültige Kalorienzahl eingeben"); return; }

    const candidates = [];

    // Kuratierte Vorschläge für diese Mahlzeit
    (FOOD_RECOMMENDATIONS[queryMeal] || []).forEach((r) => {
      candidates.push({ label: r.name, source: "kuratiert", items: computeRecItems(r) });
    });

    // Eigene Cluster mit passender Mahlzeiten-Zuordnung
    templates.filter((t) => t.mealType === queryMeal).forEach((t) => {
      candidates.push({ label: t.name, source: "cluster", items: t.items });
    });

    // Favoriten (mahlzeiten-unabhängig, als Einzelposten)
    favorites.forEach((name) => {
      const f = allFoods.find((x) => x.name === name);
      if (!f) return;
      const amt = f.unit === "stk" ? 1 : 100;
      const factor = f.unit === "stk" ? amt : amt / 100;
      candidates.push({
        label: name, source: "favorit",
        items: [{ name, amount: amt, unit: f.unit, kcal: round1(f.kcal * factor), protein: round1(f.protein * factor), fat: round1(f.fat * factor), carbs: round1(f.carbs * factor) }],
      });
    });

    const scaled = candidates.map((c) => ({ label: c.label, source: c.source, ...scaleItems(c.items, target) }));
    scaled.sort((a, b) => Math.abs(a.totals.kcal - target) - Math.abs(b.totals.kcal - target));
    setQueryResults({ target, meal: queryMeal, options: scaled.slice(0, 4) });
  };

  const addRecToLog = async (mealType, items, date) => {
    try {
      const r = await window.storage.get(`log:${date}`, false);
      const existing = r && r.value ? JSON.parse(r.value) : [];
      const newEntries = items.map((it) => ({ ...it, id: uid(), mealType, source: "empfehlung" }));
      await window.storage.set(`log:${date}`, JSON.stringify([...existing, ...newEntries]), false);
      showToast(`Ins Tagebuch übertragen (${date === todayStr() ? "heute" : date})`);
    } catch (e) {
      showToast("Übertragen fehlgeschlagen");
    }
  };

  const allFoods = useMemo(() => {
    const builtin = LOCAL_FOODS.map((f) => ({ ...f, builtin: true }));
    const custom = customFoods.map((f) => ({ ...f, builtin: false }));
    return [...builtin, ...custom].sort((a, b) => a.name.localeCompare(b.name, "de"));
  }, [customFoods]);

  const filteredFoods = useMemo(() => {
    const q = search.trim().toLowerCase();
    return q ? allFoods.filter((f) => f.name.toLowerCase().includes(q)) : allFoods;
  }, [allFoods, search]);

  const favoriteFoods = filteredFoods.filter((f) => favorites.includes(f.name));
  const otherFoods = filteredFoods.filter((f) => !favorites.includes(f.name));

  const toggleFavorite = (name) => {
    if (favorites.includes(name)) persistFavorites(favorites.filter((n) => n !== name));
    else persistFavorites([...favorites, name]);
  };

  const findFood = (name) => {
    const n = name.trim().toLowerCase();
    return LOCAL_FOODS.find((f) => f.name.toLowerCase() === n) || customFoods.find((f) => f.name.toLowerCase() === n);
  };

  // ---------- Lebensmittel anlegen / bearbeiten ----------
  const openNewFood = () => {
    setEditingFoodName(null);
    setFoodForm({ name: "", unit: "g", kcal: "", protein: "", fat: "", carbs: "" });
    setFoodError("");
    setShowFoodSheet(true);
  };
  const openEditFood = (f) => {
    setEditingFoodName(f.name);
    setFoodForm({ name: f.name, unit: f.unit, kcal: String(f.kcal), protein: String(f.protein), fat: String(f.fat), carbs: String(f.carbs) });
    setFoodError("");
    setShowFoodSheet(true);
  };
  const saveFood = async () => {
    setFoodError("");
    const name = foodForm.name.trim();
    if (!name) { setFoodError("Bitte einen Namen eingeben."); return; }
    if (!foodForm.kcal) { setFoodError("Bitte mindestens die Kalorien angeben."); return; }
    if (LOCAL_FOODS.some((f) => f.name.toLowerCase() === name.toLowerCase()) && name.toLowerCase() !== (editingFoodName || "").toLowerCase()) {
      setFoodError("Dieser Name gehört zu einem Standard-Lebensmittel und kann nicht überschrieben werden.");
      return;
    }
    const entry = { name, unit: foodForm.unit, kcal: parseFloat(foodForm.kcal) || 0, protein: parseFloat(foodForm.protein) || 0, fat: parseFloat(foodForm.fat) || 0, carbs: parseFloat(foodForm.carbs) || 0 };
    let next = customFoods.filter((f) => f.name.toLowerCase() !== (editingFoodName || name).toLowerCase());
    next = [...next, entry];
    await persistCustomFoods(next);
    // Favoriten-Namen bei Umbenennung mit übernehmen
    if (editingFoodName && editingFoodName !== name && favorites.includes(editingFoodName)) {
      await persistFavorites(favorites.filter((n) => n !== editingFoodName).concat(name));
    }
    setShowFoodSheet(false);
    showToast(editingFoodName ? "Aktualisiert" : "Gespeichert");
  };
  const deleteFood = async (name) => {
    await persistCustomFoods(customFoods.filter((f) => f.name !== name));
    if (favorites.includes(name)) await persistFavorites(favorites.filter((n) => n !== name));
    setShowFoodSheet(false);
  };

  // ---------- Cluster anlegen / bearbeiten ----------
  const openNewCluster = () => {
    setEditingClusterId(null);
    setClusterName("");
    setClusterItems([]);
    setClusterFoodInput("");
    setClusterAmount("");
    setClusterMealType("");
    setClusterError("");
    setShowClusterSheet(true);
  };
  const openEditCluster = (tpl) => {
    setEditingClusterId(tpl.id);
    setClusterName(tpl.name);
    setClusterItems(tpl.items.map((it) => ({ ...it, id: uid() })));
    setClusterFoodInput("");
    setClusterAmount("");
    setClusterMealType(tpl.mealType || "");
    setClusterError("");
    setShowClusterSheet(true);
  };
  const addClusterItem = () => {
    setClusterError("");
    const amt = parseFloat(clusterAmount.replace(",", "."));
    if (!clusterFoodInput.trim() || !amt || amt <= 0) { setClusterError("Bitte Lebensmittel und Menge angeben."); return; }
    const base = findFood(clusterFoodInput);
    if (!base) { setClusterError(`"${clusterFoodInput}" ist nicht in der Bibliothek. Erst unter "Lebensmittel" anlegen.`); return; }
    const factor = base.unit === "stk" ? amt : amt / 100;
    const item = {
      id: uid(), name: clusterFoodInput.trim(), amount: amt, unit: base.unit,
      kcal: round1(base.kcal * factor), protein: round1(base.protein * factor), fat: round1(base.fat * factor), carbs: round1(base.carbs * factor),
    };
    setClusterItems([...clusterItems, item]);
    setClusterFoodInput(""); setClusterAmount("");
  };
  const removeClusterItem = (id) => setClusterItems(clusterItems.filter((it) => it.id !== id));
  const saveCluster = async () => {
    setClusterError("");
    if (!clusterName.trim()) { setClusterError("Bitte einen Namen für den Cluster vergeben."); return; }
    if (clusterItems.length === 0) { setClusterError("Bitte mindestens ein Lebensmittel hinzufügen."); return; }
    const tpl = { id: editingClusterId || uid(), name: clusterName.trim(), mealType: clusterMealType || null, items: clusterItems.map(({ id, ...rest }) => rest) };
    const next = templates.filter((t) => t.id !== tpl.id).concat(tpl);
    await persistTemplates(next);
    setShowClusterSheet(false);
    showToast("Cluster gespeichert");
  };
  const deleteCluster = async (id) => {
    await persistTemplates(templates.filter((t) => t.id !== id));
  };

  const clusterTotals = (items) => items.reduce((acc, it) => ({ kcal: acc.kcal + it.kcal, protein: acc.protein + it.protein }), { kcal: 0, protein: 0 });

  return (
    <div className="px-5 pt-5 pb-32">
      <Toast message={toast} />
      <div className="flex gap-2 mb-4 flex-wrap">
        <button onClick={() => setSubView("foods")} className={`flex-1 py-2 rounded-lg font-body text-sm font-medium transition-colors ${subView === "foods" ? "bg-[#E0925C] text-[#14181A]" : "bg-[#1B2022] text-[#8A9296] border border-[#262C2E]"}`}>Lebensmittel</button>
        <button onClick={() => setSubView("clusters")} className={`flex-1 py-2 rounded-lg font-body text-sm font-medium transition-colors ${subView === "clusters" ? "bg-[#E0925C] text-[#14181A]" : "bg-[#1B2022] text-[#8A9296] border border-[#262C2E]"}`}>Cluster</button>
        <button onClick={() => setSubView("locations")} className={`flex-1 py-2 rounded-lg font-body text-sm font-medium transition-colors ${subView === "locations" ? "bg-[#E0925C] text-[#14181A]" : "bg-[#1B2022] text-[#8A9296] border border-[#262C2E]"}`}>Orte</button>
        <button onClick={() => setSubView("empfehlungen")} className={`flex-1 py-2 rounded-lg font-body text-sm font-medium transition-colors ${subView === "empfehlungen" ? "bg-[#E0925C] text-[#14181A]" : "bg-[#1B2022] text-[#8A9296] border border-[#262C2E]"}`}>Empfehlungen</button>
      </div>

      {!loaded ? (
        <div className="flex justify-center py-16 text-[#8A9296]"><Loader2 className="animate-spin" size={22} /></div>
      ) : subView === "foods" ? (
        <>
          <input type="text" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Lebensmittel suchen..." className="w-full mb-4 bg-[#1B2022] border border-[#262C2E] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#E0925C]" />

          {favoriteFoods.length > 0 && (
            <div className="mb-5">
              <div className="font-mono text-[11px] uppercase tracking-widest text-[#5F6668] mb-2 px-1">⭐ Favoriten</div>
              <div className="space-y-2">
                {favoriteFoods.map((f) => (
                  <FoodRow key={f.name} f={f} isFav={true} onToggleFav={() => toggleFavorite(f.name)} onEdit={() => !f.builtin && openEditFood(f)} />
                ))}
              </div>
            </div>
          )}

          <div className="font-mono text-[11px] uppercase tracking-widest text-[#5F6668] mb-2 px-1">Alle Lebensmittel ({filteredFoods.length})</div>
          <div className="space-y-2">
            {otherFoods.map((f) => (
              <FoodRow key={f.name} f={f} isFav={false} onToggleFav={() => toggleFavorite(f.name)} onEdit={() => !f.builtin && openEditFood(f)} />
            ))}
          </div>

          <button onClick={openNewFood} className="fixed bottom-24 right-5 w-14 h-14 rounded-full bg-[#E0925C] text-[#14181A] flex items-center justify-center shadow-lg active:scale-95 transition-transform" aria-label="Lebensmittel hinzufügen"><Plus size={26} /></button>
        </>
      ) : subView === "clusters" ? (
        <>
          {templates.length === 0 ? (
            <div className="text-center py-10 text-[#5F6668] font-body text-sm">Noch keine Cluster gespeichert. Kombiniere mehrere Lebensmittel zu einer wiederverwendbaren Mahlzeit.</div>
          ) : (
            <div className="space-y-2">
              {templates.map((t) => {
                const tot = clusterTotals(t.items);
                return (
                  <button key={t.id} onClick={() => openEditCluster(t)} className="w-full text-left bg-[#1B2022] rounded-xl px-4 py-3 border border-[#262C2E] active:opacity-70">
                    <div className="flex items-center justify-between">
                      <div className="font-body text-sm text-[#E9E4DA]">{t.name}</div>
                      <div className="font-mono text-[11px] text-[#8A9296]">{Math.round(tot.kcal)} kcal · P{round1(tot.protein)}g</div>
                    </div>
                    <div className="font-mono text-[10px] text-[#5F6668] mt-1">{t.items.map((it) => it.name).join(" · ")}</div>
                  </button>
                );
              })}
            </div>
          )}
          <button onClick={openNewCluster} className="fixed bottom-24 right-5 w-14 h-14 rounded-full bg-[#E0925C] text-[#14181A] flex items-center justify-center shadow-lg active:scale-95 transition-transform" aria-label="Cluster hinzufügen"><Plus size={26} /></button>
        </>
      ) : subView === "locations" ? (
        <>
          {locations.length === 0 ? (
            <div className="text-center py-10 text-[#5F6668] font-body text-sm">Noch keine Orte angelegt.</div>
          ) : (
            <div className="space-y-2">
              {locations.map((loc) => (
                <button key={loc.id} onClick={() => openEditLocation(loc)} className="w-full text-left bg-[#1B2022] rounded-xl px-4 py-3 border border-[#262C2E] active:opacity-70">
                  <div className="flex items-center gap-2 mb-1.5">
                    <MapPin size={13} className="text-[#E0925C]" />
                    <div className="font-body text-sm text-[#E9E4DA]">{loc.name}</div>
                  </div>
                  <div className="font-mono text-[10px] text-[#5F6668]">{loc.equipment.length > 0 ? loc.equipment.join(" · ") : "Kein Equipment hinterlegt (nur Bodyweight)"}</div>
                </button>
              ))}
            </div>
          )}
          <button onClick={openNewLocation} className="fixed bottom-24 right-5 w-14 h-14 rounded-full bg-[#E0925C] text-[#14181A] flex items-center justify-center shadow-lg active:scale-95 transition-transform" aria-label="Ort hinzufügen"><Plus size={26} /></button>
        </>
      ) : (
        <>
          {/* Frag-nach-Vorschlag Tool */}
          <div className="bg-[#1B2022] rounded-2xl p-4 border border-[#262C2E] mb-5">
            <div className="font-mono text-xs text-[#8A9296] uppercase tracking-wider mb-3">💬 Was soll ich essen?</div>
            <div className="font-body text-sm text-[#E9E4DA] mb-3">"Ich habe noch <span className="text-[#E0925C] font-semibold">___</span> kcal übrig für <span className="text-[#E0925C] font-semibold">___</span> — was empfiehlst du?"</div>
            <div className="grid grid-cols-2 gap-3 mb-3">
              <div>
                <label className="font-mono text-[10px] uppercase tracking-wider text-[#5F6668]">Verbleibende kcal</label>
                <input type="number" value={queryKcal} onChange={(e) => setQueryKcal(e.target.value)} placeholder="700" className="w-full mt-1 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#E0925C]" />
              </div>
              <div>
                <label className="font-mono text-[10px] uppercase tracking-wider text-[#5F6668]">Für welche Mahlzeit</label>
                <select value={queryMeal} onChange={(e) => setQueryMeal(e.target.value)} className="w-full mt-1 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#E0925C]">
                  {MEAL_TYPES.map((m) => (<option key={m} value={m}>{m}</option>))}
                </select>
              </div>
            </div>
            <button onClick={runQuery} className="w-full bg-[#E0925C] text-[#14181A] font-body font-semibold text-sm rounded-lg py-2.5">Vorschlag anzeigen</button>

            {queryResults && (
              <div className="mt-4 space-y-2.5">
                <div className="font-mono text-[10px] text-[#5F6668]">Vorschläge für ~{queryResults.target} kcal · {queryResults.meal}</div>
                {queryResults.options.map((opt, i) => (
                  <div key={i} className="bg-[#14181A] border border-[#2A2F31] rounded-lg p-3">
                    <div className="flex items-center justify-between mb-1.5">
                      <div className="font-body text-sm text-[#E9E4DA] font-medium">
                        {opt.label} <span className="font-mono text-[9px]" style={{ color: opt.source === "cluster" ? "#7A8FC4" : opt.source === "favorit" ? "#E0925C" : "#5F6668" }}>
                          {opt.source === "cluster" ? "Eigener Cluster" : opt.source === "favorit" ? "★ Favorit" : "Kuratiert"}
                        </span>
                      </div>
                      <div className="font-mono text-[11px] text-[#4E9E8F]">{Math.round(opt.totals.kcal)} kcal</div>
                    </div>
                    <div className="font-mono text-[10px] text-[#8A9296] mb-2">
                      {opt.items.map((it) => `${it.name} ${it.amount}${it.unit === "stk" ? " Stk" : "g"}`).join(" · ")}
                    </div>
                    <div className="flex items-center justify-between">
                      <div className="font-mono text-[9px] text-[#5F6668]">P {round1(opt.totals.protein)}g · F {round1(opt.totals.fat)}g · KH {round1(opt.totals.carbs)}g</div>
                      <button onClick={() => addRecToLog(queryResults.meal, opt.items, queryDate)} className="font-mono text-[10px] text-[#E0925C] underline">Ins Tagebuch übertragen</button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Favoriten (mahlzeiten-unabhängig) */}
          {favorites.length > 0 && (
            <div className="mb-5">
              <div className="font-mono text-[11px] uppercase tracking-widest text-[#5F6668] mb-2 px-1">⭐ Deine Favoriten</div>
              <div className="space-y-2">
                {favorites.map((name) => {
                  const f = allFoods.find((x) => x.name === name);
                  if (!f) return null;
                  const amt = f.unit === "stk" ? 1 : 100;
                  const factor = f.unit === "stk" ? amt : amt / 100;
                  const item = { name, amount: amt, unit: f.unit, kcal: round1(f.kcal * factor), protein: round1(f.protein * factor), fat: round1(f.fat * factor), carbs: round1(f.carbs * factor) };
                  return (
                    <div key={name} className="bg-[#1B2022] rounded-xl px-4 py-3 border border-[#262C2E] flex items-center justify-between">
                      <div className="min-w-0">
                        <div className="font-body text-sm text-[#E9E4DA]">{name}</div>
                        <div className="font-mono text-[10px] text-[#5F6668] mt-0.5">{amt}{f.unit === "stk" ? " Stk" : "g"} · {Math.round(item.kcal)} kcal · P {round1(item.protein)}g</div>
                      </div>
                      <div className="flex items-center gap-2 shrink-0 ml-2">
                        <select id={`fav-meal-${name}`} defaultValue={MEAL_TYPES[0]} className="bg-[#14181A] border border-[#2A2F31] rounded-lg px-2 py-1.5 font-mono text-[10px] text-[#8A9296] focus:outline-none">
                          {MEAL_TYPES.map((m) => (<option key={m} value={m}>{m}</option>))}
                        </select>
                        <button
                          onClick={() => addRecToLog(document.getElementById(`fav-meal-${name}`).value, [item], todayStr())}
                          className="font-mono text-[10px] text-[#E0925C] underline shrink-0"
                        >
                          Übertragen
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* Durchstöberbare Empfehlungen nach Mahlzeit (kuratiert + eigene Cluster) */}
          {MEAL_TYPES.map((mt) => {
            const mealClusters = templates.filter((t) => t.mealType === mt);
            if ((FOOD_RECOMMENDATIONS[mt] || []).length === 0 && mealClusters.length === 0) return null;
            return (
              <div key={mt} className="mb-5">
                <div className="font-mono text-[11px] uppercase tracking-widest text-[#5F6668] mb-2 px-1">{mt}</div>
                <div className="space-y-2">
                  {(FOOD_RECOMMENDATIONS[mt] || []).map((rec, i) => {
                    const items = computeRecItems(rec);
                    const totals = recTotals(items);
                    return (
                      <div key={`rec-${i}`} className="bg-[#1B2022] rounded-xl px-4 py-3 border border-[#262C2E]">
                        <div className="flex items-center justify-between mb-1">
                          <div className="font-body text-sm text-[#E9E4DA]">{rec.name}</div>
                          <div className="font-mono text-[11px] text-[#8A9296]">{Math.round(totals.kcal)} kcal</div>
                        </div>
                        <div className="font-mono text-[10px] text-[#5F6668] mb-2">
                          {items.map((it) => `${it.name} ${it.amount}${it.unit === "stk" ? " Stk" : "g"}`).join(" · ")} · P {round1(totals.protein)}g
                        </div>
                        <button onClick={() => addRecToLog(mt, items, todayStr())} className="font-mono text-[10px] text-[#4E9E8F] underline">Heute ins Tagebuch übertragen</button>
                      </div>
                    );
                  })}
                  {mealClusters.map((t) => {
                    const totals = clusterTotals(t.items);
                    return (
                      <div key={t.id} className="bg-[#1B2022] rounded-xl px-4 py-3 border border-[#7A8FC4]/40">
                        <div className="flex items-center justify-between mb-1">
                          <div className="font-body text-sm text-[#E9E4DA]">{t.name} <span className="font-mono text-[9px] text-[#7A8FC4]">Eigener Cluster</span></div>
                          <div className="font-mono text-[11px] text-[#8A9296]">{Math.round(totals.kcal)} kcal</div>
                        </div>
                        <div className="font-mono text-[10px] text-[#5F6668] mb-2">
                          {t.items.map((it) => `${it.name} ${it.amount}${it.unit === "stk" ? " Stk" : "g"}`).join(" · ")} · P {round1(totals.protein)}g
                        </div>
                        <button onClick={() => addRecToLog(mt, t.items, todayStr())} className="font-mono text-[10px] text-[#7A8FC4] underline">Heute ins Tagebuch übertragen</button>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </>

      )}

      {showFoodSheet && (
        <Sheet title={editingFoodName ? "LEBENSMITTEL BEARBEITEN" : "LEBENSMITTEL ANLEGEN"} onClose={() => setShowFoodSheet(false)}>
          <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">Name</label>
          <input type="text" value={foodForm.name} onChange={(e) => setFoodForm({ ...foodForm, name: e.target.value })} className="w-full mt-1 mb-3 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#E0925C]" />
          <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">Bezugsgröße</label>
          <select value={foodForm.unit} onChange={(e) => setFoodForm({ ...foodForm, unit: e.target.value })} className="w-full mt-1 mb-3 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#E0925C]">
            <option value="g">pro 100g</option>
            <option value="stk">pro Stück</option>
          </select>
          <div className="grid grid-cols-2 gap-3 mb-3">
            <div><label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">Kcal</label><input type="number" value={foodForm.kcal} onChange={(e) => setFoodForm({ ...foodForm, kcal: e.target.value })} className="w-full mt-1 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#E0925C]" /></div>
            <div><label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">Protein (g)</label><input type="number" value={foodForm.protein} onChange={(e) => setFoodForm({ ...foodForm, protein: e.target.value })} className="w-full mt-1 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#E0925C]" /></div>
            <div><label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">Fett (g)</label><input type="number" value={foodForm.fat} onChange={(e) => setFoodForm({ ...foodForm, fat: e.target.value })} className="w-full mt-1 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#E0925C]" /></div>
            <div><label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">Kohlenh. (g)</label><input type="number" value={foodForm.carbs} onChange={(e) => setFoodForm({ ...foodForm, carbs: e.target.value })} className="w-full mt-1 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#E0925C]" /></div>
          </div>
          {foodError && <div className="text-[#C46B6B] font-body text-xs mb-3">{foodError}</div>}
          <div className="flex gap-2">
            {editingFoodName && (<button onClick={() => deleteFood(editingFoodName)} className="p-3 rounded-lg bg-[#14181A] border border-[#2A2F31] text-[#C46B6B]"><Trash2 size={16} /></button>)}
            <button onClick={saveFood} className="flex-1 bg-[#E0925C] text-[#14181A] font-body font-semibold text-sm rounded-lg py-3">Speichern</button>
          </div>
        </Sheet>
      )}

      {showClusterSheet && (
        <Sheet title={editingClusterId ? "CLUSTER BEARBEITEN" : "CLUSTER ANLEGEN"} onClose={() => setShowClusterSheet(false)}>
          <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">Name</label>
          <input type="text" value={clusterName} onChange={(e) => setClusterName(e.target.value)} placeholder="z.B. Frühstück 1" className="w-full mt-1 mb-4 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#E0925C]" />

          <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">Mahlzeit (optional, für Empfehlungen)</label>
          <select value={clusterMealType} onChange={(e) => setClusterMealType(e.target.value)} className="w-full mt-1 mb-4 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#E0925C]">
            <option value="">Ohne Zuordnung</option>
            {MEAL_TYPES.map((m) => (<option key={m} value={m}>{m}</option>))}
          </select>

          {clusterItems.length > 0 && (
            <div className="space-y-1.5 mb-4">
              {clusterItems.map((it) => (
                <div key={it.id} className="flex items-center justify-between bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2">
                  <div className="font-body text-xs text-[#E9E4DA]">{it.name} <span className="font-mono text-[10px] text-[#5F6668]">({it.amount}{it.unit === "stk" ? " Stk" : "g"} · {Math.round(it.kcal)} kcal)</span></div>
                  <button onClick={() => removeClusterItem(it.id)} className="p-1 text-[#5F6668] hover:text-[#C46B6B]"><Trash2 size={13} /></button>
                </div>
              ))}
              <div className="font-mono text-[10px] text-[#8A9296] text-right pt-1">Gesamt: {Math.round(clusterTotals(clusterItems).kcal)} kcal · P{round1(clusterTotals(clusterItems).protein)}g</div>
            </div>
          )}

          <div className="bg-[#14181A] border border-[#2A2F31] rounded-lg p-3 mb-3">
            <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">Lebensmittel hinzufügen</label>
            <input type="text" list="foodNames" value={clusterFoodInput} onChange={(e) => setClusterFoodInput(e.target.value)} placeholder="z.B. Toast" className="w-full mt-1.5 mb-2 bg-[#1B2022] border border-[#2A2F31] rounded-lg px-3 py-2 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#E0925C]" />
            <datalist id="foodNames">{allFoods.map((f) => (<option key={f.name} value={f.name} />))}</datalist>
            <div className="flex gap-2">
              <input type="text" inputMode="decimal" value={clusterAmount} onChange={(e) => setClusterAmount(e.target.value)} placeholder="Menge z.B. 150" className="flex-1 bg-[#1B2022] border border-[#2A2F31] rounded-lg px-3 py-2 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#E0925C]" />
              <button onClick={addClusterItem} className="px-4 rounded-lg bg-[#4E9E8F] text-[#14181A] font-body text-sm font-medium">+ Hinzu</button>
            </div>
          </div>

          {clusterError && <div className="text-[#C46B6B] font-body text-xs mb-3">{clusterError}</div>}
          <div className="flex gap-2">
            {editingClusterId && (<button onClick={() => deleteCluster(editingClusterId)} className="p-3 rounded-lg bg-[#14181A] border border-[#2A2F31] text-[#C46B6B]"><Trash2 size={16} /></button>)}
            <button onClick={saveCluster} className="flex-1 bg-[#E0925C] text-[#14181A] font-body font-semibold text-sm rounded-lg py-3">Cluster speichern</button>
          </div>
        </Sheet>
      )}

      {showLocationSheet && (
        <Sheet title={editingLocationId ? "ORT BEARBEITEN" : "ORT ANLEGEN"} onClose={() => setShowLocationSheet(false)}>
          <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">Name</label>
          <input type="text" value={locationName} onChange={(e) => setLocationName(e.target.value)} placeholder="z.B. Home Gym, Studio, Draußen" className="w-full mt-1 mb-4 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#E0925C]" />

          <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296] mb-2 block">Verfügbares Equipment</label>
          <div className="flex flex-wrap gap-2 mb-3">
            {EQUIPMENT_OPTIONS.map((eq) => {
              const active = locationEquipment.includes(eq);
              return (
                <button
                  key={eq}
                  onClick={() => toggleLocationEquipment(eq)}
                  className="px-3 py-1.5 rounded-full font-body text-xs border transition-colors"
                  style={active ? { background: "#E0925C", color: "#14181A", borderColor: "#E0925C" } : { background: "#14181A", color: "#8A9296", borderColor: "#2A2F31" }}
                >
                  {eq}
                </button>
              );
            })}
            {locationEquipment.filter((eq) => !EQUIPMENT_OPTIONS.includes(eq)).map((eq) => (
              <button key={eq} onClick={() => toggleLocationEquipment(eq)} className="px-3 py-1.5 rounded-full font-body text-xs border" style={{ background: "#E0925C", color: "#14181A", borderColor: "#E0925C" }}>
                {eq} ✕
              </button>
            ))}
          </div>

          <div className="flex gap-2 mb-4">
            <input type="text" value={customEquipmentInput} onChange={(e) => setCustomEquipmentInput(e.target.value)} placeholder="Eigenes Equipment ergänzen..." className="flex-1 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#E0925C]" />
            <button onClick={addCustomEquipment} className="px-4 rounded-lg bg-[#4E9E8F] text-[#14181A] font-body text-sm font-medium">+ Hinzu</button>
          </div>

          {locationError && <div className="text-[#C46B6B] font-body text-xs mb-3">{locationError}</div>}
          <div className="flex gap-2">
            {editingLocationId && (<button onClick={() => deleteLocation(editingLocationId)} className="p-3 rounded-lg bg-[#14181A] border border-[#2A2F31] text-[#C46B6B]"><Trash2 size={16} /></button>)}
            <button onClick={saveLocation} className="flex-1 bg-[#E0925C] text-[#14181A] font-body font-semibold text-sm rounded-lg py-3">Ort speichern</button>
          </div>
          <p className="font-mono text-[10px] text-[#5F6668] mt-3 leading-relaxed">Der Workout-Generator nutzt das hier hinterlegte Equipment, um passende Übungen auszuwählen. Bodyweight-Übungen sind immer verfügbar.</p>
        </Sheet>
      )}
    </div>
  );
}

function estimate1RM(weight, reps) {
  if (!reps || reps <= 1) return weight;
  return Math.round(weight * (1 + reps / 30) * 10) / 10;
}

  const [customExercises, setCustomExercises] = useState([]);

  const [loaded, setLoaded] = useState(false);
  const [search, setSearch] = useState("");
  const [toast, setToast] = useState("");

  const [showAdd, setShowAdd] = useState(false);
  const [exerciseInput, setExerciseInput] = useState("");
  const [weight, setWeight] = useState("");
  const [reps, setReps] = useState("1");
  const [entryDate, setEntryDate] = useState(todayStr());
  const [notes, setNotes] = useState("");
  const [error, setError] = useState("");

  const [detailExercise, setDetailExercise] = useState(null);

  const [cueSaved, setCueSaved] = useState(false);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2000); };

  const allExerciseNames = useMemo(() => {
    const names = new Set([...PRESET_EXERCISES, ...customExercises, ...Object.keys(allData)]);

  }, [customExercises, allData]);

  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get("strengthExercises", false);
        setCustomExercises(r && r.value ? JSON.parse(r.value) : []);
      } catch (e) {}
      try {
        const r = await window.storage.get("exerciseCues", false);
        setCues(r && r.value ? JSON.parse(r.value) : {});

      const data = {};

        const list = await window.storage.list("strength:", false);

          try {
            const r = await window.storage.get(key, false);
            const name = key.slice("strength:".length);

          } catch (e) {}
        }
      } catch (e) {}
      setAllData(data);
      setLoaded(true);
    })();
  }, []);

  const persistCue = async (name, text) => {
    const next = { ...cues, [name]: text };
    setCues(next);
    try {
      await window.storage.set("exerciseCues", JSON.stringify(next), false);
      setCueSaved(true);
      setTimeout(() => setCueSaved(false), 1200);

  const persistCustomExercises = useCallback(async (next) => {

  const persistExerciseData = useCallback(async (name, entries) => {

  const openAdd = (presetName) => {
    setExerciseInput(presetName || "");
    setWeight(""); setReps("1"); setEntryDate(todayStr()); setNotes(""); setError("");
    setShowAdd(true);
  };

  const handleSaveEntry = async () => {
    setError("");
    const name = exerciseInput.trim();
    const w = parseFloat(weight.replace(",", "."));
    const r = parseInt(reps) || 1;
    if (!name) { setError("Bitte eine Übung wählen oder eingeben."); return; }
    if (!w || w <= 0) { setError("Bitte ein gültiges Gewicht eingeben."); return; }
    if (!PRESET_EXERCISES.includes(name) && !customExercises.includes(name)) {
      await persistCustomExercises([...customExercises, name]);
    }
    const entry = { id: uid(), date: entryDate, weight: w, reps: r, est1RM: estimate1RM(w, r), notes: notes.trim() };
    const existing = allData[name] || [];

    const entries = allData[name] || [];

                    </div>
                    <button onClick={() => handleDeleteEntry(detailExercise, e.id)} className="p-1.5 text-[#5F6668] hover:text-[#C46B6B]"><Trash2 size={13} /></button>
                  </div>

              </div>
            </>
          )}
        </Sheet>

      )}
      </>)}
    </div>
  );
}

function suggestMovementWeight(movement, bodyweightKg) {
  if (movement.weightType === "fixed") return movement.weightKg;
  if (movement.weightType === "bodyweight" && bodyweightKg) return Math.round(bodyweightKg * movement.multiplier * 2) / 2;
  return null;
}

function parseTimeToSeconds(str) {
  const parts = str.split(":").map((p) => parseInt(p) || 0);
  if (parts.length === 2) return parts[0] * 60 + parts[1];
  if (parts.length === 1) return parts[0];
  return 0;
}
function formatSeconds(sec) {
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}

    customBenchmarks.forEach((n) => { if (!map[n]) map[n] = { name: n, type: "time", desc: "Eigener WOD", movements: [] }; });
    Object.keys(allData).forEach((n) => { if (!map[n]) map[n] = { name: n, type: "time", desc: "Eigener WOD", movements: [] }; });
    return Object.values(map);
  }, [customBenchmarks, allData]);

  useEffect(() => {

      let d = addDays(todayStr(), -1);

          const r = await window.storage.get(`recovery:${d}`, false);

  const persistWodData = useCallback(async (name, entries) => {
    setAllData((prev) => ({ ...prev, [name]: entries }));
    try { await window.storage.set(`benchmark:${name}`, JSON.stringify(entries), false); } catch (e) {}
  }, []);

  const openAdd = (name) => {
    const wod = allWods.find((w) => w.name === name);
    setWodInput(name || "");
    setWodType(wod ? wod.type : "time");
    setResultTime(""); setResultRounds(""); setRx(true); setEntryDate(todayStr()); setNotes(""); setError("");
    const initWeights = {};
    if (wod && wod.movements) {
      wod.movements.forEach((m) => {
        if (m.weightType !== "none") {
          const sugg = suggestMovementWeight(m, bodyweight);
          if (sugg) initWeights[m.name] = String(sugg);
        }
      });
    }
    setMovementWeights(initWeights);
    setShowAdd(true);
  };

  const handleSave = async () => {
    setError("");
    const name = wodInput.trim();
    if (!name) { setError("Bitte einen WOD-Namen wählen oder eingeben."); return; }
    let value;
    if (wodType === "time") {
      value = parseTimeToSeconds(resultTime);
      if (!value) { setError("Bitte eine gültige Zeit (mm:ss) eingeben."); return; }
    } else {
      value = parseInt(resultRounds);
      if (!value) { setError("Bitte Runden/Reps eingeben."); return; }
    }
    if (!BENCHMARK_WODS.some((w) => w.name === name) && !customBenchmarks.includes(name)) {
      await persistCustomBenchmarks([...customBenchmarks, name]);
    }
    const cleanWeights = {};
    Object.entries(movementWeights).forEach(([k, v]) => {
      const n = parseFloat((v || "").toString().replace(",", "."));
      if (n) cleanWeights[k] = n;
    });
    const entry = { id: uid(), date: entryDate, value, rx, notes: notes.trim(), movementWeights: cleanWeights };
    const existing = allData[name] || [];
    const next = [...existing, entry].sort((a, b) => a.date.localeCompare(b.date));
    await persistWodData(name, next);
    setShowAdd(false);

  };

  const handleDelete = async (name, id) => {
    const next = (allData[name] || []).filter((e) => e.id !== id);
    await persistWodData(name, next);
  };

  const bestFor = (name, type) => {
    const entries = allData[name] || [];
    if (entries.length === 0) return null;
    return entries.reduce((best, e) => {
      if (type === "time") return e.value < best.value ? e : best;
      return e.value > best.value ? e : best;
    }, entries[0]);
  };

  const sortedWods = useMemo(() => {
    return allWods.slice().sort((a, b) => {
      const ha = (allData[a.name] || []).length > 0, hb = (allData[b.name] || []).length > 0;
      if (ha !== hb) return ha ? -1 : 1;
      return a.name.localeCompare(b.name, "de");
    });
  }, [allWods, allData]);

    <>
      <Toast message={toast} />
      {!loaded ? (
        <div className="flex justify-center py-16 text-[#8A9296]"><Loader2 className="animate-spin" size={22} /></div>
      ) : (
        <div className="space-y-2">
          {sortedWods.map((w) => {
            const best = bestFor(w.name, w.type);
            const entries = allData[w.name] || [];
            return (
              <div key={w.name} className="bg-[#1B2022] rounded-xl px-4 py-3 border border-[#262C2E] flex items-center justify-between">
                <button onClick={() => entries.length > 0 && setDetailWod(w)} disabled={entries.length === 0} className="min-w-0 flex-1 text-left">
                  <div className="font-body text-sm text-[#E9E4DA]">{w.name} <span className="font-mono text-[9px] text-[#5F6668]">{w.desc}</span></div>
                  {best ? (
                    <div className="font-mono text-[11px] text-[#7A8FC4] mt-0.5">
                      Best: {w.type === "time" ? formatSeconds(best.value) : `${best.value}`} {best.rx ? "(Rx)" : "(scaled)"} · {new Date(best.date + "T00:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" })}
                    </div>
                  ) : (<div className="font-mono text-[11px] text-[#5F6668] mt-0.5">Noch kein Eintrag</div>)}
                </button>
                <button onClick={() => openAdd(w.name)} className="ml-3 p-2 rounded-full hover:bg-[#262C2E] text-[#7A8FC4] shrink-0" aria-label="Ergebnis eintragen"><Plus size={18} /></button>
              </div>
            );
          })}
        </div>
      )}

      <button onClick={() => openAdd("")} className="fixed bottom-24 right-5 w-14 h-14 rounded-full bg-[#7A8FC4] text-[#14181A] flex items-center justify-center shadow-lg active:scale-95 transition-transform" aria-label="WOD hinzufügen"><Plus size={26} /></button>

      {showAdd && (

          <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">WOD</label>
          <input type="text" list="wodNames" value={wodInput} onChange={(e) => {

            const w = allWods.find((x) => x.name === e.target.value);
            if (w) {
              setWodType(w.type);
              const initWeights = {};
              (w.movements || []).forEach((m) => {
                if (m.weightType !== "none") {
                  const sugg = suggestMovementWeight(m, bodyweight);
                  if (sugg) initWeights[m.name] = String(sugg);
                }
              });
              setMovementWeights(initWeights);
            }
          }} placeholder="z.B. Fran" className="w-full mt-1 mb-3 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#7A8FC4]" />
          <datalist id="wodNames">{allWods.map((w) => (<option key={w.name} value={w.name} />))}</datalist>

          {(() => {
            const selectedWod = allWods.find((w) => w.name === wodInput.trim());
            const movements = selectedWod?.movements || [];
            if (movements.length === 0) return null;
            return (
              <div className="mb-4 bg-[#14181A] border border-[#2A2F31] rounded-lg p-3">
                <div className="flex items-center justify-between mb-2">
                  <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296] block">Bewegungen</label>
                  <div className="flex items-center gap-3 font-mono text-[9px] text-[#5F6668]">
                    <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full inline-block" style={{ background: "#4E9E8F" }} />Standard</span>
                    <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full inline-block" style={{ background: "#E0925C" }} />berechnet</span>
                  </div>
                </div>
                <div className="space-y-2">
                  {movements.map((m) => (
                    <div key={m.name} className="flex items-center justify-between gap-2">
                      <div className="min-w-0 flex-1">
                        <div className="font-body text-xs text-[#E9E4DA]">{m.name}</div>
                        <div className="font-mono text-[9px] text-[#5F6668]">{m.note}</div>
                        {m.weightType === "bodyweight" && (
                          <div className="font-mono text-[9px] mt-0.5" style={{ color: "#E0925C" }}>{m.multiplier}× Körpergewicht</div>

                        {m.weightType === "fixed" && (
                          <div className="font-mono text-[9px] mt-0.5" style={{ color: "#4E9E8F" }}>Rx-Standard {m.weightKg}kg</div>

                      </div>
                      {m.weightType !== "none" ? (
                        <div className="flex items-center gap-1 shrink-0">
                          <input
                            type="text" inputMode="decimal"
                            value={movementWeights[m.name] ?? ""}
                            onChange={(e) => setMovementWeights({ ...movementWeights, [m.name]: e.target.value })}
                            placeholder="kg"
                            className="w-20 bg-[#1B2022] rounded-lg px-2 py-1.5 font-body text-xs text-center focus:outline-none"
                            style={{
                              border: `1.5px solid ${m.weightType === "fixed" ? "#4E9E8F" : "#E0925C"}`,
                              color: m.weightType === "fixed" ? "#4E9E8F" : "#E0925C",
                            }}
                          />
                          <span className="font-mono text-[9px] text-[#5F6668]">kg</span>

                      ) : (

                </div>
                {selectedWod?.movements?.some((m) => m.weightType === "bodyweight") && (
                  <p className="font-mono text-[9px] text-[#5F6668] mt-2.5 leading-relaxed">
                    {bodyweight ? `Orange = aus deinem letzten Gewicht (${bodyweight}kg) berechnet, passe bei Bedarf an. Türkis = fester Rx-Standardwert.` : "Kein Körpergewicht hinterlegt — trag samstags im Training-Tab dein Gewicht ein für automatische Vorschläge."}

                )}
              </div>

          })()}

          <label className="font-mono text-[11px] uppercase tracking-wider text-[#8A9296]">Ergebnistyp</label>
          <select value={wodType} onChange={(e) => setWodType(e.target.value)} className="w-full mt-1 mb-3 bg-[#14181A] border border-[#2A2F31] rounded-lg px-3 py-2.5 font-body text-sm text-[#E9E4DA] focus:outline-none focus:border-[#7A8FC4]">
            <option value="time">Zeit (schneller = besser)</option>

      {detailWod && (

          <div className="space-y-1.5">
            {detailEntries.map((e) => (

                  )}
                  <div className="font-mono text-[10px] text-[#5F6668] mt-0.5">{new Date(e.date + "T00:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" })}{e.notes ? ` · ${e.notes}` : ""}</div>
                </div>
                <button onClick={() => handleDelete(detailWod.name, e.id)} className="p-1.5 text-[#5F6668] hover:text-[#C46B6B] shrink-0"><Trash2 size={13} /></button>

// ---------- Fokus-Modus: eine Übung nach der anderen ----------
function FocusMode({ workout, updateSet, oneRMMap, onMax, onClose }) {
  const steps = [];
  workout.blocks.forEach((b, bi) => b.items.forEach((it, ii) => { if ((it.exercise || "").trim()) steps.push({ bi, ii, block: b }); }));
  const [idx, setIdx] = useState(0);
  const [restLeft, setRestLeft] = useState(0);
  useEffect(() => {
    if (restLeft <= 0) return;
    const id = setTimeout(() => {
      setRestLeft((r) => {
        if (r <= 1) { try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {} return 0; }
        return r - 1;
      });
    }, 1000);
    return () => clearTimeout(id);
  }, [restLeft]);
  if (steps.length === 0) return (<div className="fixed inset-0 z-40 bg-[#14181A] p-6"><button onClick={onClose} className="font-body text-sm text-[#8A9296]">‹ Zurück</button><div className="mt-6 text-[#8A9296] font-body">Dieses Workout hat keine Übungen.</div></div>);
  const st = steps[Math.min(idx, steps.length - 1)];
  const it = st.block.items[st.ii];
  const sets = it.sets || defaultSets(it);
  const inpC = "bg-[#14181A] border border-[#2A2F31] rounded-lg px-2 py-3 font-display text-2xl text-[#E9E4DA] text-center focus:outline-none focus:border-[#E0925C]";
  return (
    <div className="fixed inset-0 z-40 bg-[#14181A] overflow-y-auto overscroll-contain">
      <div className="max-w-xl mx-auto px-5 pt-5 pb-28">
        <div className="flex items-center justify-between mb-3">
          <button onClick={onClose} className="font-body text-sm text-[#8A9296]">‹ Beenden</button>
          <div className="font-mono text-[11px] text-[#8A9296]">Übung {Math.min(idx, steps.length - 1) + 1} / {steps.length}</div>
        </div>
        <div className="h-1.5 rounded-full bg-[#262C2E] overflow-hidden mb-4"><div className="h-full" style={{ width: ((Math.min(idx, steps.length - 1) + 1) / steps.length) * 100 + "%", background: "#E0925C" }} /></div>
        <div className="font-mono text-[10px] uppercase tracking-wider text-[#E0925C] mb-1">{st.block.name}{st.block.format ? " · " + st.block.format : ""}</div>
        <div className="font-display text-4xl leading-tight mb-1">{it.exercise}</div>
        <div className="font-mono text-sm text-[#8A9296] mb-1">{it.reps}{it.weightSuggestion ? " · Vorschlag " + it.weightSuggestion : ""}{it.note ? " · " + it.note : ""}</div>
        <ExHistory name={it.exercise} />
        <button onClick={() => onMax(st.bi, st.ii, it.exercise)} className="mt-2 px-3 py-1.5 rounded-lg bg-[#14181A] border border-[#7A8FC4] font-mono text-[11px] text-[#7A8FC4]">{(oneRMMap && oneRMMap[it.exercise]) ? `🏆 Maximum aktualisieren (aktuell ${oneRMMap[it.exercise]} kg)` : "🏆 Maximum eintragen"}</button>
        <div className="mt-4 space-y-2">
          {sets ? sets.map((s, si) => (
            <div key={si} className="flex items-center gap-2">
              <span className="font-mono text-xs text-[#5F6668] w-5">{si + 1}.</span>
              <input type="text" inputMode="numeric" value={s.reps} onChange={(e) => updateSet(st.bi, st.ii, si, "reps", e.target.value)} placeholder="Wdh." className={inpC + " w-20"} />
              <span className="text-[#5F6668]">×</span>
              <input type="text" inputMode="decimal" value={s.weight} onChange={(e) => updateSet(st.bi, st.ii, si, "weight", e.target.value)} placeholder="kg" className={inpC + " w-24"} />
              <span className="font-mono text-xs text-[#5F6668]">kg</span>
              <button onClick={() => { const nd = !s.done; updateSet(st.bi, st.ii, si, "done", nd); if (nd) setRestLeft(90); }} className="ml-auto w-12 h-12 rounded-xl border-2 flex items-center justify-center text-xl" style={{ borderColor: s.done ? "#4E9E8F" : "#2A2F31", background: s.done ? "#4E9E8F" : "transparent", color: "#14181A" }}>{s.done ? "✓" : ""}</button>
            </div>
          )) : <div className="font-body text-sm text-[#8A9296]">Keine Satzvorgabe. Arbeite nach der Vorgabe oben und tippe unten auf „Weiter“.</div>}
        </div>
        <div className="mt-5 rounded-xl bg-[#1B2022] border border-[#262C2E] p-3 flex items-center justify-between">
          <div>
            <div className="font-mono text-[10px] uppercase tracking-wider text-[#8A9296]">Satzpause</div>
            <div className="font-display text-3xl" style={{ color: restLeft > 0 ? "#E0925C" : "#5F6668" }}>{restLeft > 0 ? fmtMS(restLeft) : "--:--"}</div>
          </div>
          <div className="flex gap-2">
            {[60, 90, 120].map((r) => <button key={r} onClick={() => setRestLeft(r)} className="px-3 py-2 rounded-lg bg-[#14181A] border border-[#2A2F31] font-mono text-xs text-[#E9E4DA]">{r}s</button>)}
            {restLeft > 0 && <button onClick={() => setRestLeft(0)} className="px-3 py-2 rounded-lg bg-[#14181A] border border-[#2A2F31] font-mono text-xs text-[#C46B6B]">✕</button>}
          </div>
        </div>
      </div>
      <div className="fixed bottom-0 left-0 right-0 bg-[#14181A]/95 border-t border-[#2A2F31] p-3" style={{ paddingBottom: "calc(12px + env(safe-area-inset-bottom))" }}>
        <div className="max-w-xl mx-auto flex gap-2">
          <button onClick={() => { setIdx(Math.max(0, idx - 1)); setRestLeft(0); }} disabled={idx === 0} className="flex-1 bg-[#1B2022] border border-[#262C2E] rounded-xl py-3.5 font-body text-sm text-[#E9E4DA] disabled:opacity-40">‹ Zurück</button>
          {idx < steps.length - 1
            ? <button onClick={() => { setIdx(idx + 1); setRestLeft(0); }} className="flex-[2] bg-[#E0925C] text-[#14181A] rounded-xl py-3.5 font-body font-semibold text-sm">Weiter ›</button>
            : <button onClick={onClose} className="flex-[2] bg-[#4E9E8F] text-[#14181A] rounded-xl py-3.5 font-body font-semibold text-sm">Fertig ✓ (unten abschließen)</button>}
        </div>
      </div>
    </div>
  );
}
